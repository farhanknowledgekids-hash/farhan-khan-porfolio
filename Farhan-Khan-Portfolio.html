{\n  display: inline-flex; align-items: center; justify-content: center; min-height: 3.25rem; padding: .9rem 1.75rem;\n  background: var(--plum); color: var(--pearl); border: 1px solid var(--plum); border-radius: 0;\n  font: 500 .9375rem/1 var(--font-body); letter-spacing: .04em; text-decoration: none;\n  transition: background-color .2s ease, color .2s ease;\n}\n.iv-btn:hover { background: transparent; color: var(--plum); }\n\n/* Header */\n.iv-header { background: var(--plum); color: var(--pearl); border-bottom: 1px solid rgba(239,233,231,.12); }\n.iv-header-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 4.5rem; gap: 1rem; }\n.iv-nav { display: flex; gap: 2rem; }\n.iv-nav a, .iv-cta { color: var(--pearl); text-decoration: none; font-size: .9375rem; letter-spacing: .03em; padding-block: .5rem; border-bottom: 1px solid transparent; }\n.iv-nav a:hover, .iv-cta:hover { border-bottom-color: var(--champagne); }\n.iv-cta { justify-self: end; }\n.iv-logo { font-family: var(--font-display); font-size: 1.6rem; font-style: italic; color: var(--pearl); text-decoration: none; letter-spacing: -.01em; white-space: nowrap; }\n.iv-logo span { font-style: normal; font-size: .62em; letter-spacing: .3em; margin-right: .35em; vertical-align: .18em; }\n.iv-menu { display: none; }\n@media (max-width: 52rem) {\n  .iv-header-row { grid-template-columns: auto 1fr auto; }\n  .iv-logo { justify-self: center; font-size: 1.35rem; }\n  .iv-menu { display: inline-block; background: none; border: 1px solid rgba(239,233,231,.35); color: var(--pearl); padding: .55rem .9rem; min-height: 2.75rem; font-size: .875rem; letter-spacing: .05em; }\n  .iv-nav { display: none; position: absolute; left: 0; right: 0; top: 100%; z-index: 40; flex-direction: column; gap: 0; background: var(--plum); padding: .5rem 1rem 1rem; }\n  .iv-nav.is-open { display: flex; }\n  .iv-nav a { padding: .9rem 0; border-bottom: 1px solid rgba(239,233,231,.12); }\n  .iv-header { position: relative; }\n  .iv-cta { font-size: .875rem; }\n}\n@media (max-width: 26rem) { .iv-cta { display: none; } .iv-header-row { grid-template-columns: auto 1fr; } }\n\n/* Hero \u2014 a magazine cover */\n.iv-hero { position: relative; background: var(--plum); color: var(--pearl); overflow: hidden; padding: clamp(2.5rem, 6vw, 5rem) 0 0; }\n.iv-hero-grid { position: relative; display: grid; gap: 2.5rem; }\n@media (min-width: 60rem) { .iv-hero-grid { grid-template-columns: 1fr 1fr; align-items: end; gap: 4rem; } }\n.iv-hero-copy { position: relative; z-index: 4; padding-bottom: clamp(1rem, 13vw, 12rem); }\n.iv-dateline { font-size: .9375rem; letter-spacing: .08em; color: var(--champagne); }\n.iv-hero h1 { font-size: clamp(2.9rem, 1.6rem + 5.4vw, 6rem); margin: 1.25rem 0 1.5rem; max-width: 11ch; }\n.iv-lede { color: #D8CDD0; font-weight: 300; font-size: clamp(1.0625rem, 1rem + .3vw, 1.25rem); max-width: 40ch; margin-bottom: 2.25rem; }\n.iv-hero .iv-btn { background: var(--pearl); color: var(--plum); border-color: var(--pearl); }\n.iv-hero .iv-btn:hover { background: transparent; color: var(--pearl); }\n.iv-hero-figure { position: relative; z-index: 1; margin: 0; }\n.iv-hero-figure img { width: 100%; aspect-ratio: 900 / 1150; object-fit: cover; }\n.iv-hero-figure figcaption { position: absolute; right: .75rem; bottom: .75rem; font-size: .75rem; color: rgba(239,233,231,.7); }\n.iv-masthead {\n  position: absolute; z-index: 3; left: -.04em; bottom: -.24em; pointer-events: none; max-width: none;\n  font-family: var(--font-display); font-style: italic; font-weight: 400; line-height: 1;\n  font-size: clamp(6rem, 22vw, 21rem); letter-spacing: -.04em;\n  color: transparent; -webkit-text-stroke: 1px rgba(194,165,122,.75);\n}\n@media (max-width: 59.99rem) {\n  .iv-hero-copy { order: 1; padding-bottom: 0; }\n  .iv-masthead { order: 2; position: relative; left: auto; bottom: auto; font-size: 31vw; margin: -.15em 0 -.42em -.04em; }\n  .iv-hero-figure { order: 3; }\n  .iv-hero-grid { gap: 0; }\n  .iv-hero-copy .iv-btn { margin-bottom: 1rem; }\n}\n\n/* Approach \u2014 editorial essay */\n.iv-approach { padding: clamp(4rem, 10vw, 8rem) 0; }\n.iv-approach-grid { display: grid; gap: 2rem; }\n@media (min-width: 60rem) { .iv-approach-grid { grid-template-columns: 1fr 1.4fr 1fr; gap: 4rem; align-items: start; } }\n.iv-essay p { font-size: 1.1875rem; line-height: 1.75; max-width: 34em; }\n.iv-essay p + p { margin-top: 1.25rem; }\n.iv-dropcap::first-letter { float: left; font-family: var(--font-display); font-size: 4.6em; line-height: .8; padding: .08em .1em 0 0; color: var(--champagne-ink); }\n.iv-pull { margin: 0; padding-top: 1.25rem; border-top: 1px solid var(--plum); }\n.iv-pull p { font-family: var(--font-display); font-style: italic; font-size: 1.75rem; line-height: 1.2; }\n.iv-pull footer { margin-top: 1rem; font-size: .875rem; color: var(--muted); }\n\n/* Treatments \u2014 an index */\n.iv-treatments { padding: clamp(4rem, 9vw, 7rem) 0; background: #F6F2F0; border-block: 1px solid #DDD2CF; }\n.iv-treatments h2 { margin-bottom: 2.5rem; }\n.iv-index { display: grid; gap: 3rem; }\n@media (min-width: 60rem) { .iv-index { grid-template-columns: 1.5fr 1fr; align-items: start; } }\n.iv-list { margin: 0; border-top: 1px solid var(--plum); }\n.iv-list a { display: grid; gap: .35rem; padding: 1.35rem 0; border-bottom: 1px solid #CDBFBC; text-decoration: none; }\n@media (min-width: 40rem) { .iv-list a { grid-template-columns: minmax(12rem, 1fr) 1.2fr; gap: 2rem; align-items: baseline; } }\n.iv-t-name { font-family: var(--font-display); font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.25rem); line-height: 1.1; transition: color .2s ease, padding .3s ease; }\n.iv-t-desc { color: var(--muted); font-size: 1rem; }\n.iv-list a:hover .iv-t-name, .iv-list a:focus-visible .iv-t-name { color: var(--champagne-ink); font-style: italic; }\n.iv-preview { position: sticky; top: 2rem; display: none; aspect-ratio: 4 / 5; background: var(--plum); overflow: hidden; }\n@media (min-width: 60rem) { .iv-preview { display: block; } }\n.iv-preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .45s ease; filter: grayscale(.9) sepia(.12) contrast(1.04); }\n.iv-preview img.is-active { opacity: 1; }\n\n/* Studio */\n.iv-studio { display: grid; background: var(--plum); color: var(--pearl); }\n@media (min-width: 60rem) { .iv-studio { grid-template-columns: 1.25fr 1fr; } }\n.iv-studio-media img { width: 100%; height: 100%; min-height: 20rem; object-fit: cover; filter: sepia(.18) saturate(.85); }\n.iv-studio-copy { padding: clamp(2.5rem, 6vw, 5rem) clamp(1rem, 5vw, 4.5rem); align-self: center; }\n.iv-studio-copy p { color: #D8CDD0; font-weight: 300; font-size: 1.125rem; margin-top: 1.25rem; max-width: 36em; }\n.iv-facts { margin-top: 2rem; display: grid; gap: 0; }\n.iv-facts div { display: grid; grid-template-columns: 8rem 1fr; gap: .25rem 1rem; padding: .85rem 0; border-top: 1px solid rgba(239,233,231,.16); }\n@media (max-width: 30rem) { .iv-facts div { grid-template-columns: 1fr; } }\n.iv-facts dt { color: var(--champagne); font-size: .9375rem; }\n.iv-studio .iv-note { color: #B7A9AE; }\n\n/* Doctor */\n.iv-doctor { padding: clamp(4rem, 9vw, 7rem) 0; }\n.iv-doctor-grid { display: grid; gap: 1.5rem; }\n@media (min-width: 60rem) { .iv-doctor-grid { grid-template-columns: 1.2fr 1fr; gap: 4rem; align-items: end; } }\n.iv-doc-name { font-family: var(--font-display); font-style: italic; font-size: clamp(2.6rem, 1.5rem + 5vw, 5.5rem); line-height: 1; letter-spacing: -.02em; max-width: none; }\n.iv-doc-role { font-weight: 500; margin-bottom: 1rem; }\n.iv-doctor-grid p + p { margin-top: .9rem; }\n\n/* Reviews slot */\n.iv-reviews { padding: 0 0 clamp(4rem, 9vw, 7rem); }\n.iv-reviews h2 { font-size: clamp(1.8rem, 1.4rem + 1.6vw, 2.6rem); margin-bottom: 1.5rem; }\n.iv-review-slot { border: 1px dashed #A8989E; padding: clamp(1.5rem, 4vw, 2.5rem); display: grid; gap: .75rem; }\n\n/* Consultation */\n.iv-consult { padding: clamp(4rem, 9vw, 7rem) 0; background: var(--rose); }\n.iv-consult-grid { display: grid; gap: 2.5rem; }\n@media (min-width: 60rem) { .iv-consult-grid { grid-template-columns: 1fr 1fr; gap: 5rem; } }\n.iv-consult-grid > div p { margin-top: 1.25rem; font-size: 1.125rem; max-width: 34em; }\n.iv-form { display: grid; gap: 1.25rem; }\n.iv-form .field label { font-weight: 500; }\n.iv-form .iv-btn { justify-self: start; }\n\n/* Footer */\n.iv-footer { background: var(--plum); color: #D8CDD0; padding: 3rem 0; font-size: .9375rem; }\n.iv-footer-grid { display: grid; gap: 1rem; }\n@media (min-width: 52rem) { .iv-footer-grid { grid-template-columns: auto 1fr; align-items: baseline; gap: 3rem; } .iv-footer-grid .iv-note { grid-column: 1 / -1; } }\n.iv-footer .iv-note { color: #A99BA1; }\n.iv-footer a { color: var(--pearl); }\n\n/* One orchestrated entrance: the cover */\n@media (prefers-reduced-motion: no-preference) {\n  .iv-hero-copy > * { animation: iv-rise .9s cubic-bezier(.2,.7,.2,1) both; }\n  .iv-hero-copy > *:nth-child(2) { animation-delay: .08s; }\n  .iv-hero-copy > *:nth-child(3) { animation-delay: .16s; }\n  .iv-hero-copy > *:nth-child(4) { animation-delay: .24s; }\n  .iv-masthead { animation: iv-fade 1.6s ease .2s both; }\n}\n@keyframes iv-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n@keyframes iv-fade { from { opacity: 0; } to { opacity: 1; } }\n<\/style>\n<\/head>\n<body>\n<a class=\"skip-link\" href=\"#main\">Skip to content<\/a>\n\n<aside class=\"demo-bar\" aria-label=\"About this page\">\n  <div class=\"wrap\">\n    <p><strong>Demo concept.<\/strong> Maison Ivoire is a fictional clinic. Forms here don't send anything.<\/p>\n    <nav aria-label=\"Demo concepts\">\n      <a href=\"../index.html#demos\">All demos<\/a>\n      <a href=\"maison-ivoire.html\" aria-current=\"page\">Cosmetic<\/a>\n      <a href=\"little-banyan.html\">Family<\/a>\n      <a href=\"axial-implant-centre.html\">Implants<\/a>\n    <\/nav>\n  <\/div>\n<\/aside>\n\n<header class=\"iv-header\">\n  <div class=\"wrap iv-header-row\">\n    <button class=\"iv-menu\" type=\"button\" aria-expanded=\"false\" aria-controls=\"iv-nav\" data-nav-toggle>Menu<\/button>\n    <nav id=\"iv-nav\" class=\"iv-nav\" aria-label=\"Main\">\n      <a href=\"#approach\">Approach<\/a>\n      <a href=\"#treatments\">Treatments<\/a>\n      <a href=\"#studio\">The studio<\/a>\n    <\/nav>\n    <a class=\"iv-logo\" href=\"#main\" aria-label=\"Maison Ivoire, home\"><span>Maison<\/span> Ivoire<\/a>\n    <a class=\"iv-cta\" href=\"#consult\">Private consultation<\/a>\n  <\/div>\n<\/header>\n\n<main id=\"main\">\n  <section class=\"iv-hero\" aria-labelledby=\"iv-title\">\n    <div class=\"wrap iv-hero-grid\">\n      <div class=\"iv-hero-copy\">\n        <p class=\"iv-dateline\">Smile design studio, Juhu<\/p>\n        <h1 id=\"iv-title\">Considered smiles, designed by hand.<\/h1>\n        <p class=\"iv-lede\">Veneers, bonding and whitening planned around your face, your features and the way you actually smile, never a catalogue shade.<\/p>\n        <a class=\"iv-btn\" href=\"#consult\">Request a private consultation<\/a>\n      <\/div>\n      <figure class=\"iv-hero-figure\">\n        <img src=\"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&amp;fit=crop&amp;crop=faces&amp;w=900&amp;h=1150&amp;q=72\"\n             srcset=\"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&amp;fit=crop&amp;crop=faces&amp;w=560&amp;h=716&amp;q=72 560w, https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&amp;fit=crop&amp;crop=faces&amp;w=900&amp;h=1150&amp;q=72 900w, https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&amp;fit=crop&amp;crop=faces&amp;w=1200&amp;h=1534&amp;q=72 1200w\"\n             sizes=\"(min-width: 60rem) 40vw, 100vw\" width=\"900\" height=\"1150\" fetchpriority=\"high\"\n             alt=\"Portrait of a woman with long hair against a dark grey backdrop\">\n        <figcaption>Stock photograph, model<\/figcaption>\n      <\/figure>\n      <p class=\"iv-masthead\" aria-hidden=\"true\">Ivoire<\/p>\n    <\/div>\n  <\/section>\n\n  <section id=\"approach\" class=\"iv-approach\" aria-labelledby=\"iv-approach-title\">\n    <div class=\"wrap iv-approach-grid\">\n      <h2 id=\"iv-approach-title\">The approach<\/h2>\n      <div class=\"iv-essay\">\n        <p class=\"iv-dropcap\">A beautiful smile is rarely the whitest or the straightest one. It's the one that looks as if it was always yours. Every plan here starts with photographs and a conversation about how you want to feel, before anyone mentions a shade.<\/p>\n        <p>We design your new smile digitally, show it to you on your own face, and make a trial version you can wear before anything is changed. Only once you're sure does the work begin.<\/p>\n      <\/div>\n      <blockquote class=\"iv-pull\">\n        <p>\u201cNothing is changed until you have seen it, worn it and approved it.\u201d<\/p>\n        <footer>The studio's working principle<\/footer>\n      <\/blockquote>\n    <\/div>\n  <\/section>\n\n  <section id=\"treatments\" class=\"iv-treatments\" aria-labelledby=\"iv-treat-title\">\n    <div class=\"wrap\">\n      <h2 id=\"iv-treat-title\">Treatments<\/h2>\n      <div class=\"iv-index\">\n        <ul class=\"iv-list\" role=\"list\">\n          <li>\n            <a href=\"#consult\" data-preview=\"0\">\n              <span class=\"iv-t-name\">Porcelain veneers<\/span>\n              <span class=\"iv-t-desc\">Thin, hand-layered porcelain shells for shape, colour and symmetry. Usually two to three visits.<\/span>\n            <\/a>\n          <\/li>\n          <li>\n            <a href=\"#consult\" data-preview=\"1\">\n              <span class=\"iv-t-name\">Composite bonding<\/span>\n              <span class=\"iv-t-desc\">Chips, gaps and edges refined in a single visit, with little or no change to the natural tooth.<\/span>\n            <\/a>\n          <\/li>\n          <li>\n            <a href=\"#consult\" data-preview=\"2\">\n              <span class=\"iv-t-name\">Professional whitening<\/span>\n              <span class=\"iv-t-desc\">Supervised whitening with custom trays, planned so the result looks natural rather than flat.<\/span>\n            <\/a>\n          <\/li>\n          <li>\n            <a href=\"#consult\" data-preview=\"3\">\n              <span class=\"iv-t-name\">Clear aligners<\/span>\n              <span class=\"iv-t-desc\">Discreet straightening, often used to prepare teeth before veneers or bonding.<\/span>\n            <\/a>\n          <\/li>\n          <li>\n            <a href=\"#consult\" data-preview=\"0\">\n              <span class=\"iv-t-name\">Digital smile design<\/span>\n              <span class=\"iv-t-desc\">See your planned smile on your own photographs, then try it in the mouth before committing.<\/span>\n            <\/a>\n          <\/li>\n        <\/ul>\n        <div class=\"iv-preview\" aria-hidden=\"true\">\n          <img data-preview-img=\"0\" src=\"https://images.unsplash.com/photo-1609840114035-3c981b782dfe?auto=format&amp;fit=crop&amp;w=720&amp;h=900&amp;q=70\" alt=\"\" width=\"720\" height=\"900\" loading=\"lazy\" decoding=\"async\" class=\"is-active\">\n          <img data-preview-img=\"1\" src=\"https://images.unsplash.com/photo-1468493858157-0da44aaf1d13?auto=format&amp;fit=crop&amp;w=720&amp;h=900&amp;q=70\" alt=\"\" width=\"720\" height=\"900\" loading=\"lazy\" decoding=\"async\">\n          <img data-preview-img=\"2\" src=\"https://images.unsplash.com/photo-1607613009820-a29f7bb81c04?auto=format&amp;fit=crop&amp;w=720&amp;h=900&amp;q=70\" alt=\"\" width=\"720\" height=\"900\" loading=\"lazy\" decoding=\"async\">\n          <img data-preview-img=\"3\" src=\"https://images.unsplash.com/photo-1609840114035-3c981b782dfe?auto=format&amp;fit=crop&amp;crop=bottom&amp;w=720&amp;h=900&amp;q=70\" alt=\"\" width=\"720\" height=\"900\" loading=\"lazy\" decoding=\"async\">\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"studio\" class=\"iv-studio\" aria-labelledby=\"iv-studio-title\">\n    <div class=\"iv-studio-media\">\n      <img src=\"https://images.unsplash.com/photo-1445527815219-ecbfec67492e?auto=format&amp;fit=crop&amp;w=1400&amp;h=1000&amp;q=70\"\n           srcset=\"https://images.unsplash.com/photo-1445527815219-ecbfec67492e?auto=format&amp;fit=crop&amp;w=700&amp;h=500&amp;q=70 700w, https://images.unsplash.com/photo-1445527815219-ecbfec67492e?auto=format&amp;fit=crop&amp;w=1400&amp;h=1000&amp;q=70 1400w\"\n           sizes=\"(min-width: 60rem) 55vw, 100vw\" width=\"1400\" height=\"1000\" loading=\"lazy\" decoding=\"async\"\n           alt=\"A calm treatment room with pale wood cabinetry and a basin\">\n    <\/div>\n    <div class=\"iv-studio-copy\">\n      <h2 id=\"iv-studio-title\">The studio<\/h2>\n      <p>Two private suites, one patient at a time, and a lounge where nobody is called by a token number. Appointments run to time, and your consultation is never rushed into treatment on the same day.<\/p>\n      <dl class=\"iv-facts\">\n        <div><dt>Consultations<\/dt><dd>By appointment, 60 minutes<\/dd><\/div>\n        <div><dt>Hours<\/dt><dd>Tuesday to Saturday, 10 am to 7 pm<\/dd><\/div>\n        <div><dt>Address<\/dt><dd>Juhu Tara Road, Mumbai<span class=\"iv-note\"> (fictional)<\/span><\/dd><\/div>\n      <\/dl>\n    <\/div>\n  <\/section>\n\n  <section class=\"iv-doctor\" aria-labelledby=\"iv-doc-title\">\n    <div class=\"wrap iv-doctor-grid\">\n      <h2 id=\"iv-doc-title\" class=\"visually-hidden\">Your dentist<\/h2>\n      <p class=\"iv-doc-name\">Dr. Meera Ivani<\/p>\n      <div>\n        <p class=\"iv-doc-role\">MDS, Prosthodontics and Crown &amp; Bridge. Founder and lead clinician.<\/p>\n        <p>Dr. Ivani plans and places every veneer case herself, working with a single ceramist so that each smile is made, not ordered.<\/p>\n        <p class=\"iv-note\">Fictional profile for this demo. A live site shows the real dentist's qualifications and Dental Council registration number.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"iv-reviews\" aria-labelledby=\"iv-rev-title\">\n    <div class=\"wrap\">\n      <h2 id=\"iv-rev-title\">What patients say<\/h2>\n      <div class=\"iv-review-slot\">\n        <p>On a live site, this space shows the clinic's real Google reviews, pulled directly from its Google Business Profile with the reviewer's name and date.<\/p>\n        <p class=\"iv-note\">This demo shows no reviews, because it's not a real clinic and invented testimonials would mislead patients.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"consult\" class=\"iv-consult\" aria-labelledby=\"iv-consult-title\">\n    <div class=\"wrap iv-consult-grid\">\n      <div>\n        <h2 id=\"iv-consult-title\">Request a private consultation<\/h2>\n        <p>Leave your details and the studio coordinator will call you to find a time. Your consultation includes photographs, a smile assessment and a written plan with costs.<\/p>\n      <\/div>\n      <form class=\"iv-form\" data-enquiry=\"demo\" novalidate>\n        <div class=\"field\">\n          <label for=\"iv-name\">Name<\/label>\n          <input id=\"iv-name\" name=\"name\" type=\"text\" autocomplete=\"name\" required aria-describedby=\"iv-name-error\">\n          <p id=\"iv-name-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"iv-phone\">Mobile number<\/label>\n          <input id=\"iv-phone\" name=\"phone\" type=\"tel\" inputmode=\"tel\" autocomplete=\"tel-national\" required aria-describedby=\"iv-phone-error\">\n          <p id=\"iv-phone-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"iv-interest\">I'm interested in<\/label>\n          <select id=\"iv-interest\" name=\"interest\" required aria-describedby=\"iv-interest-error\">\n            <option value=\"\">Choose one<\/option>\n            <option>Porcelain veneers<\/option>\n            <option>Composite bonding<\/option>\n            <option>Professional whitening<\/option>\n            <option>Clear aligners<\/option>\n            <option>I'm not sure yet<\/option>\n          <\/select>\n          <p id=\"iv-interest-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"iv-time\">Best time to call<\/label>\n          <select id=\"iv-time\" name=\"time\">\n            <option>Weekday morning<\/option>\n            <option>Weekday afternoon<\/option>\n            <option>Saturday<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field\">\n          <div class=\"check\">\n            <input id=\"iv-consent\" name=\"consent\" type=\"checkbox\" required aria-describedby=\"iv-consent-error\">\n            <label for=\"iv-consent\">I agree to be contacted by the studio about this request. Please don't include medical details; the dentist will ask about your health in person.<\/label>\n          <\/div>\n          <p id=\"iv-consent-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n        <\/div>\n        <div class=\"form-status\" data-form-status role=\"status\" aria-live=\"polite\" hidden><\/div>\n        <button class=\"iv-btn\" type=\"submit\">Request consultation<\/button>\n      <\/form>\n    <\/div>\n  <\/section>\n<\/main>\n\n<footer class=\"iv-footer\">\n  <div class=\"wrap iv-footer-grid\">\n    <p class=\"iv-logo iv-logo--footer\"><span>Maison<\/span> Ivoire<\/p>\n    <p>Juhu Tara Road, Mumbai. Tuesday to Saturday, 10 am to 7 pm.<\/p>\n    <p class=\"iv-note\">A fictional clinic. Demo concept by <a href=\"../index.html\">Farhan Khan<\/a>. Photographs from Unsplash.<\/p>\n  <\/div>\n<\/footer>\n\n<script>/*\n * Site configuration \u2014 the only file you need to edit to go live.\n *\n * FORM_ENDPOINT\n *   A form backend that accepts a JSON POST and returns 2xx on success.\n *   Works with Formspree (https://formspree.io/f/xxxxxxx) or\n *   Web3Forms (https://api.web3forms.com/submit \u2014 also set WEB3FORMS_KEY).\n *   Leave empty and the studio form falls back to opening an email draft\n *   to CONTACT_EMAIL. If both are empty the form shows a clear\n *   \"not connected\" error instead of pretending to send.\n *\n * WHATSAPP_NUMBER\n *   International format, digits only, no \"+\" or spaces. e.g. \"919812345678\".\n *   Leave empty and every WhatsApp button stays hidden.\n */\nwindow.SITE_CONFIG = {\n  FORM_ENDPOINT: \"\",\n  WEB3FORMS_KEY: \"\",\n  CONTACT_EMAIL: \"\",\n  WHATSAPP_NUMBER: \"\",\n  WHATSAPP_MESSAGE: \"Hi Farhan, I saw your dental website demos and would like to discuss a website for my clinic.\"\n};\n<\/script>\n<script>/* Shared behaviour: navigation, enquiry forms, WhatsApp links. No dependencies. */\n(function () {\n  \"use strict\";\n  var cfg = window.SITE_CONFIG || {};\n\n  /* ---------- Mobile navigation ---------- */\n  document.querySelectorAll(\"[data-nav-toggle]\").forEach(function (btn) {\n    var menu = document.getElementById(btn.getAttribute(\"aria-controls\"));\n    if (!menu) return;\n    function close() {\n      btn.setAttribute(\"aria-expanded\", \"false\");\n      menu.classList.remove(\"is-open\");\n    }\n    btn.addEventListener(\"click\", function () {\n      var open = btn.getAttribute(\"aria-expanded\") === \"true\";\n      btn.setAttribute(\"aria-expanded\", String(!open));\n      menu.classList.toggle(\"is-open\", !open);\n    });\n    menu.querySelectorAll(\"a\").forEach(function (a) { a.addEventListener(\"click\", close); });\n    document.addEventListener(\"keydown\", function (e) {\n      if (e.key === \"Escape\" && btn.getAttribute(\"aria-expanded\") === \"true\") { close(); btn.focus(); }\n    });\n  });\n\n  /* ---------- WhatsApp: only shown when a number is configured ---------- */\n  var wa = String(cfg.WHATSAPP_NUMBER || \"\").replace(/\\D/g, \"\");\n  if (wa.length >= 10) {\n    var href = \"https://wa.me/\" + wa + \"?text=\" + encodeURIComponent(cfg.WHATSAPP_MESSAGE || \"\");\n    document.querySelectorAll(\"[data-whatsapp]\").forEach(function (el) {\n      el.setAttribute(\"href\", href);\n      el.setAttribute(\"target\", \"_blank\");\n      el.setAttribute(\"rel\", \"noopener\");\n      el.hidden = false;\n    });\n  }\n\n  /* ---------- Footer year ---------- */\n  document.querySelectorAll(\"[data-year]\").forEach(function (el) { el.textContent = new Date().getFullYear(); });\n\n  /* ---------- Forms ---------- */\n  var MESSAGES = {\n    name: \"Enter your name.\",\n    clinic: \"Enter your clinic's name.\",\n    phone: \"Enter a 10-digit Indian mobile number, e.g. 98123 45678.\",\n    email: \"Enter an email address like name@clinic.com.\",\n    consent: \"Tick the box so we're allowed to contact you.\",\n    select: \"Choose an option.\",\n    generic: \"Fill in this field.\"\n  };\n\n  function normalisePhone(v) {\n    var d = v.replace(/\\D/g, \"\");\n    if (d.length === 12 && d.indexOf(\"91\") === 0) d = d.slice(2);\n    if (d.length === 11 && d.charAt(0) === \"0\") d = d.slice(1);\n    return d;\n  }\n\n  function validateField(field) {\n    var v = field.type === \"checkbox\" ? field.checked : field.value.trim();\n    var key = field.dataset.msg || field.name;\n    var msg = \"\";\n    if (field.required && (field.type === \"checkbox\" ? !v : v === \"\")) {\n      msg = MESSAGES[key] || (field.tagName === \"SELECT\" ? MESSAGES.select : MESSAGES.generic);\n    } else if (v && field.type === \"tel\" && !/^[6-9]\\d{9}$/.test(normalisePhone(field.value))) {\n      msg = MESSAGES.phone;\n    } else if (v && field.type === \"email\" && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(field.value.trim())) {\n      msg = MESSAGES.email;\n    }\n    var err = document.getElementById(field.id + \"-error\");\n    if (err) err.textContent = msg;\n    field.setAttribute(\"aria-invalid\", msg ? \"true\" : \"false\");\n    var wrap = field.closest(\".field\");\n    if (wrap) wrap.classList.toggle(\"has-error\", !!msg);\n    return !msg;\n  }\n\n  function setStatus(form, type, html) {\n    var box = form.querySelector(\"[data-form-status]\");\n    if (!box) return;\n    box.className = \"form-status is-\" + type;\n    box.innerHTML = html;\n    box.hidden = false;\n    box.setAttribute(\"tabindex\", \"-1\");\n    box.focus({ preventScroll: false });\n  }\n\n  function collect(form) {\n    var data = {};\n    new FormData(form).forEach(function (val, key) { data[key] = typeof val === \"string\" ? val.trim() : val; });\n    if (data.phone) data.phone = \"+91 \" + normalisePhone(data.phone);\n    delete data.company_website; // honeypot\n    return data;\n  }\n\n  function mailtoFallback(data) {\n    var lines = Object.keys(data).filter(function (k) { return k !== \"consent\"; })\n      .map(function (k) { return k.replace(/_/g, \" \") + \": \" + data[k]; });\n    return \"mailto:\" + cfg.CONTACT_EMAIL +\n      \"?subject=\" + encodeURIComponent(\"Website enquiry \u2014 \" + (data.clinic || data.name || \"dental clinic\")) +\n      \"&body=\" + encodeURIComponent(lines.join(\"\\n\"));\n  }\n\n  document.querySelectorAll(\"form[data-enquiry]\").forEach(function (form) {\n    var mode = form.getAttribute(\"data-enquiry\"); // \"studio\" | \"demo\"\n    var fields = Array.prototype.slice.call(form.querySelectorAll(\"input:not([type=hidden]):not([name=company_website]), select, textarea\"));\n    var submit = form.querySelector(\"[type=submit]\");\n    var label = submit ? submit.textContent : \"\";\n\n    fields.forEach(function (f) {\n      f.addEventListener(\"blur\", function () { if (f.value || f.type === \"checkbox\") validateField(f); });\n      f.addEventListener(\"input\", function () { if (f.getAttribute(\"aria-invalid\") === \"true\") validateField(f); });\n      f.addEventListener(\"change\", function () { if (f.getAttribute(\"aria-invalid\") === \"true\") validateField(f); });\n    });\n\n    form.addEventListener(\"submit\", function (e) {\n      e.preventDefault();\n      var firstBad = null;\n      fields.forEach(function (f) { if (!validateField(f) && !firstBad) firstBad = f; });\n      if (firstBad) {\n        var n = fields.filter(function (f) { return f.getAttribute(\"aria-invalid\") === \"true\"; }).length;\n        setStatus(form, \"error\", \"<strong>\" + n + (n === 1 ? \" field needs\" : \" fields need\") + \" attention.<\/strong> Check the highlighted fields and try again.\");\n        firstBad.focus();\n        return;\n      }\n      var hp = form.querySelector(\"[name=company_website]\");\n      if (hp && hp.value) { form.reset(); return; } // silently drop bots\n\n      var data = collect(form);\n\n      if (mode === \"demo\") {\n        submit.disabled = true; submit.textContent = \"Checking\u2026\";\n        setTimeout(function () {\n          submit.disabled = false; submit.textContent = label;\n          form.reset();\n          fields.forEach(function (f) { f.removeAttribute(\"aria-invalid\"); });\n          setStatus(form, \"success\", \"<strong>Request received \u2014 in a live site.<\/strong> This is a demo concept, so nothing was sent and nothing was stored. On a real clinic site this goes straight to the front desk.\");\n        }, 600);\n        return;\n      }\n\n      if (cfg.FORM_ENDPOINT) {\n        submit.disabled = true; submit.textContent = \"Sending\u2026\";\n        var payload = Object.assign({}, data, { _subject: \"Website enquiry \u2014 \" + (data.clinic || data.name) });\n        if (cfg.WEB3FORMS_KEY) payload.access_key = cfg.WEB3FORMS_KEY;\n        fetch(cfg.FORM_ENDPOINT, {\n          method: \"POST\",\n          headers: { \"Content-Type\": \"application/json\", \"Accept\": \"application/json\" },\n          body: JSON.stringify(payload)\n        }).then(function (res) {\n          if (!res.ok) throw new Error(\"HTTP \" + res.status);\n          form.reset();\n          fields.forEach(function (f) { f.removeAttribute(\"aria-invalid\"); });\n          setStatus(form, \"success\", \"<strong>Enquiry sent.<\/strong> I'll reply within one working day on the number or email you gave.\");\n        }).catch(function () {\n          setStatus(form, \"error\", \"<strong>Your enquiry didn't send.<\/strong> Check your connection and press \u201cSend enquiry\u201d again.\" +\n            (cfg.CONTACT_EMAIL ? \" Or email <a href=\\\"mailto:\" + cfg.CONTACT_EMAIL + \"\\\">\" + cfg.CONTACT_EMAIL + \"<\/a>.\" : \"\"));\n        }).finally(function () {\n          submit.disabled = false; submit.textContent = label;\n        });\n        return;\n      }\n\n      if (cfg.CONTACT_EMAIL) {\n        window.location.href = mailtoFallback(data);\n        setStatus(form, \"success\", \"<strong>Your email app should now be open with the enquiry filled in.<\/strong> Press send there to finish. If nothing opened, email <a href=\\\"mailto:\" + cfg.CONTACT_EMAIL + \"\\\">\" + cfg.CONTACT_EMAIL + \"<\/a>.\");\n        return;\n      }\n\n      setStatus(form, \"error\", \"<strong>This form isn't connected yet.<\/strong> The site owner needs to add a form endpoint or email address in <code>assets/js/config.js<\/code>. Nothing was sent.\");\n    });\n  });\n})();\n<\/script>\n<script>\n  /* Treatment index: swap the preview image on hover or keyboard focus */\n  (function () {\n    var imgs = document.querySelectorAll(\"[data-preview-img]\");\n    document.querySelectorAll(\"[data-preview]\").forEach(function (a) {\n      function show() {\n        var i = a.getAttribute(\"data-preview\");\n        imgs.forEach(function (img) { img.classList.toggle(\"is-active\", img.getAttribute(\"data-preview-img\") === i); });\n      }\n      a.addEventListener(\"mouseenter\", show);\n      a.addEventListener(\"focus\", show);\n    });\n  })();\n<\/script>\n<\/body>\n<\/html>\n", "banyan": "<!doctype html>\n<html lang=\"en-IN\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Little Banyan Family Dental, Powai (demo concept)<\/title>\n  <meta name=\"description\" content=\"Demo concept for a family dentistry website. Little Banyan Family Dental is a fictional clinic.\">\n  <meta name=\"robots\" content=\"noindex, nofollow\">\n  <meta name=\"theme-color\" content=\"#2D5F48\">\n  <link rel=\"icon\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iIzBGM0QzNyIvPjxwYXRoIGQ9Ik04IDZoMTZ2MTJhOCA4IDAgMCAxLTE2IDB6IiBmaWxsPSIjQThFNkNGIi8+PC9zdmc+Cg==\" type=\"image/svg+xml\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"preconnect\" href=\"https://images.unsplash.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,800&display=swap\">\n  <style>/* Shared foundation for the studio site and every demo concept.\n   Each page sets its own tokens on :root; this file only consumes them. */\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-body);\n  font-size: 1.0625rem;\n  line-height: 1.6;\n  text-rendering: optimizeLegibility;\n  -webkit-font-smoothing: antialiased;\n  overflow-x: clip;\n}\nimg, svg, video { display: block; max-width: 100%; height: auto; }\nimg { background: var(--img-placeholder, rgba(127,127,127,.15)); }\nh1, h2, h3, h4, p, ul, ol, dl, dd, figure, blockquote { margin: 0; }\nul[role=\"list\"], ol[role=\"list\"] { list-style: none; padding: 0; }\na { color: inherit; text-underline-offset: .18em; text-decoration-thickness: 1px; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\n:target { scroll-margin-top: 6rem; }\n[hidden] { display: none !important; }\n\n/* Focus: always visible for keyboard users */\n:focus { outline: none; }\n:focus-visible {\n  outline: 3px solid var(--focus, #1a73e8);\n  outline-offset: 3px;\n  border-radius: 2px;\n}\n\n.visually-hidden {\n  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;\n  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;\n}\n.skip-link {\n  position: absolute; left: 1rem; top: -4rem; z-index: 100;\n  background: var(--fg); color: var(--bg); padding: .75rem 1rem; text-decoration: none; font-weight: 600;\n}\n.skip-link:focus { top: 1rem; }\n\n.wrap { width: min(100% - 2rem, var(--max, 72rem)); margin-inline: auto; }\n@media (min-width: 48rem) { .wrap { width: min(100% - 4rem, var(--max, 72rem)); } }\n\n/* ---------- Demo concept banner (shown on every demo page) ---------- */\n.demo-bar {\n  position: relative; z-index: 60;\n  background: #1b1f1e; color: #f1f4f3;\n  font: 500 .8125rem/1.4 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n}\n.demo-bar .wrap { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: center; justify-content: space-between; padding-block: .55rem; }\n.demo-bar strong { color: #ffd88a; font-weight: 600; }\n.demo-bar a { color: #f1f4f3; font-weight: 600; }\n.demo-bar nav { display: flex; gap: 1rem; flex-wrap: wrap; }\n.demo-bar nav a[aria-current=\"page\"] { text-decoration: none; opacity: .6; }\n\n/* ---------- Forms ---------- */\n.field { display: grid; gap: .4rem; align-content: start; }\n.field label, .field legend { font-weight: 600; font-size: .9375rem; }\n.field .hint { font-size: .8125rem; color: var(--muted); margin-top: -.2rem; }\n.field input, .field select, .field textarea {\n  width: 100%; min-height: 3rem; padding: .75rem .9rem;\n  background: var(--field-bg, #fff); color: var(--field-fg, inherit);\n  border: 1px solid var(--field-border, #9aa5a1); border-radius: var(--field-radius, 6px);\n  transition: border-color .15s ease, box-shadow .15s ease;\n}\n.field textarea { min-height: 7rem; resize: vertical; }\n.field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 1.15rem) 1.3rem, calc(100% - .8rem) 1.3rem; background-size: .35rem .35rem; background-repeat: no-repeat; padding-right: 2.25rem; }\n.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--field-border-hover, currentColor); }\n.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {\n  outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent);\n}\n.field.has-error input, .field.has-error select, .field.has-error textarea { border-color: var(--error, #b42318); }\n.field-error { color: var(--error, #b42318); font-size: .875rem; font-weight: 600; min-height: 0; }\n.field-error:empty { display: none; }\n.check { display: grid; grid-template-columns: auto 1fr; gap: .7rem; align-items: start; font-size: .9375rem; }\n.check input { width: 1.25rem; height: 1.25rem; margin-top: .2rem; accent-color: var(--accent); }\n.check label { font-weight: 400; }\n.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }\n\n.form-status { border-radius: var(--field-radius, 6px); padding: 1rem 1.1rem; font-size: .9375rem; line-height: 1.5; border: 1px solid; }\n.form-status.is-success { background: color-mix(in srgb, var(--success, #127a4a) 10%, var(--bg)); border-color: var(--success, #127a4a); color: var(--fg); }\n.form-status.is-error { background: color-mix(in srgb, var(--error, #b42318) 8%, var(--bg)); border-color: var(--error, #b42318); color: var(--fg); }\n.form-status:focus-visible { outline-offset: 2px; }\n\nbutton[disabled] { opacity: .65; cursor: progress; }\n\n/* ---------- Motion ---------- */\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }\n}\n<\/style>\n  <style>/* Little Banyan Family Dental \u2014 family dentistry (demo concept)\n   Warm and trustworthy: Young Serif headings, Nunito Sans text, leaf green, marigold, peach */\n:root {\n  --leaf: #2D5F48;\n  --leaf-2: #244E3B;\n  --leaf-soft: #DCEBDF;\n  --marigold: #F3B23C;\n  --peach: #FCE7D6;\n  --sky: #DDEEF0;\n  --bg: #FFFAF5;\n  --fg: #2A2622;\n  --muted: #5C554E;\n  --accent: var(--leaf);\n  --focus: #1F6FC5;\n  --error: #B42318;\n  --success: #2D5F48;\n  --field-bg: #fff;\n  --field-border: #9A8F84;\n  --field-radius: 14px;\n  --font-display: \"Young Serif\", Georgia, serif;\n  --font-body: \"Nunito Sans\", \"Segoe UI\", system-ui, sans-serif;\n  --max: 72rem;\n  --img-placeholder: #F1DFCF;\n}\nh1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.12; text-wrap: balance; }\nh2 { font-size: clamp(2rem, 1.5rem + 2vw, 3rem); }\nh3 { font-size: 1.3rem; }\n.lb-note { font-size: .875rem; color: var(--muted); }\n\n.lb-btn {\n  display: inline-flex; align-items: center; justify-content: center; min-height: 3rem; padding: .8rem 1.5rem;\n  background: var(--leaf); color: #fff; border: 2px solid var(--leaf); border-radius: 999px;\n  font-weight: 800; font-size: 1rem; text-decoration: none; text-align: center;\n  transition: background-color .15s ease, transform .15s ease;\n}\n.lb-btn:hover { background: var(--leaf-2); border-color: var(--leaf-2); }\n.lb-btn:active { transform: scale(.98); }\n.lb-btn--soft { background: transparent; color: var(--leaf); }\n.lb-btn--soft:hover { background: var(--leaf-soft); color: var(--leaf-2); }\n.lb-btn--small { min-height: 2.6rem; padding: .5rem 1.15rem; font-size: .9375rem; }\n\n/* Header */\n.lb-header { position: sticky; top: 0; z-index: 50; background: rgba(255,250,245,.96); border-bottom: 1px solid #EEDFD0; }\n@supports (backdrop-filter: blur(8px)) { .lb-header { background: rgba(255,250,245,.85); backdrop-filter: blur(8px); } }\n.lb-header-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 4.5rem; }\n.lb-logo { display: inline-flex; align-items: center; gap: .6rem; text-decoration: none; }\n.lb-logo svg { width: 2.6rem; height: 2.6rem; }\n.lb-logo span { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.05; color: var(--leaf); }\n.lb-logo small { display: block; font-family: var(--font-body); font-size: .8125rem; font-weight: 600; color: var(--muted); }\n.lb-nav { display: flex; align-items: center; gap: 1.5rem; }\n.lb-nav a:not(.lb-btn) { text-decoration: none; font-weight: 600; font-size: .9375rem; padding: .5rem 0; border-bottom: 2px solid transparent; }\n.lb-nav a:not(.lb-btn):hover { border-bottom-color: var(--marigold); }\n.lb-menu { display: none; }\n@media (max-width: 54rem) {\n  .lb-menu { display: inline-grid; place-items: center; width: 3rem; height: 3rem; border-radius: 999px; border: 2px solid var(--leaf-soft); background: #fff; }\n  .lb-menu-icon, .lb-menu-icon::before, .lb-menu-icon::after { display: block; width: 1.1rem; height: 2px; border-radius: 2px; background: var(--leaf); position: relative; transition: transform .2s ease; }\n  .lb-menu-icon::before, .lb-menu-icon::after { content: \"\"; position: absolute; left: 0; }\n  .lb-menu-icon::before { top: -6px; } .lb-menu-icon::after { top: 6px; }\n  .lb-menu[aria-expanded=\"true\"] .lb-menu-icon { background: transparent; }\n  .lb-menu[aria-expanded=\"true\"] .lb-menu-icon::before { transform: translateY(6px) rotate(45deg); }\n  .lb-menu[aria-expanded=\"true\"] .lb-menu-icon::after { transform: translateY(-6px) rotate(-45deg); }\n  .lb-nav { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; align-items: stretch; gap: 0; padding: .5rem 1rem 1.25rem; background: var(--bg); border-bottom: 1px solid #EEDFD0; box-shadow: 0 12px 24px -16px rgba(42,38,34,.3); }\n  .lb-nav.is-open { display: flex; }\n  .lb-nav a:not(.lb-btn) { padding: .85rem 0; border-bottom: 1px solid #F0E4D8; }\n  .lb-nav .lb-btn { margin-top: 1rem; }\n}\n\n/* Hero */\n.lb-hero { padding: clamp(2rem, 5vw, 4.5rem) 0 clamp(3rem, 6vw, 5rem); background: linear-gradient(180deg, var(--peach) 0%, var(--bg) 100%); }\n.lb-hero-grid { display: grid; gap: 2.5rem; align-items: center; }\n@media (min-width: 60rem) { .lb-hero-grid { grid-template-columns: 1.1fr .9fr; gap: 4rem; } }\n.lb-hero h1 { font-size: clamp(2.3rem, 1.5rem + 3.4vw, 4rem); color: var(--leaf-2); max-width: 16ch; }\n.lb-lede { margin-top: 1.25rem; font-size: clamp(1.0625rem, 1rem + .35vw, 1.25rem); color: var(--muted); max-width: 46ch; }\n.lb-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }\n.lb-badges { display: flex; flex-wrap: wrap; gap: .5rem; margin: 2rem 0 0; }\n.lb-badges li { padding: .4rem .9rem; border-radius: 999px; background: #fff; border: 1px solid #EBD9C6; font-size: .875rem; font-weight: 600; }\n.lb-hero-media { position: relative; max-width: 30rem; justify-self: center; width: 100%; }\n.lb-hero-media img { width: 100%; aspect-ratio: 9 / 10; object-fit: cover; border-radius: 50% 50% 28px 28px / 42% 42% 28px 28px; }\n.lb-leaf { position: absolute; width: clamp(3.5rem, 10vw, 5.5rem); left: -1rem; bottom: 1rem; transform: rotate(-24deg); filter: drop-shadow(0 6px 10px rgba(42,38,34,.18)); }\n\n/* Ages */\n.lb-ages { padding: clamp(4rem, 8vw, 6.5rem) 0; }\n.lb-ages h2 { max-width: 20ch; }\n.lb-age-list { display: grid; gap: 1rem; margin-top: 2.5rem; }\n@media (min-width: 40rem) { .lb-age-list { grid-template-columns: 1fr 1fr; } }\n@media (min-width: 64rem) { .lb-age-list { grid-template-columns: repeat(4, 1fr); } }\n.lb-age { padding: 1.75rem 1.5rem 2rem; border-radius: 24px; }\n.lb-age--1 { background: var(--peach); }\n.lb-age--2 { background: #FDF0C9; }\n.lb-age--3 { background: var(--leaf-soft); }\n.lb-age--4 { background: var(--sky); }\n.lb-age-range { font-weight: 800; font-size: .9375rem; color: var(--leaf); margin: .3rem 0 .75rem; }\n.lb-age p:last-child { color: #3F3933; font-size: 1rem; }\n\n/* First visit */\n.lb-first { padding: clamp(4rem, 8vw, 6.5rem) 0; background: #fff; border-block: 1px solid #F0E4D8; }\n.lb-first-grid { display: grid; gap: 2.5rem; align-items: start; }\n@media (min-width: 60rem) { .lb-first-grid { grid-template-columns: .8fr 1.2fr; gap: 4.5rem; } .lb-first-media { position: sticky; top: 7rem; } }\n.lb-first-media img { width: 100%; aspect-ratio: 8 / 9; object-fit: cover; border-radius: 28px; }\n.lb-intro { margin: 1rem 0 2rem; font-size: 1.125rem; color: var(--muted); }\n.lb-steps { counter-reset: s; display: grid; gap: 1.5rem; margin: 0; }\n.lb-steps li { counter-increment: s; display: grid; grid-template-columns: 3rem 1fr; column-gap: 1rem; }\n.lb-steps li::before { content: counter(s); grid-row: span 2; display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 50%; background: var(--marigold); color: var(--fg); font-family: var(--font-display); font-size: 1.25rem; }\n.lb-steps h3 { align-self: center; }\n.lb-steps p { color: var(--muted); grid-column: 2; margin-top: .25rem; }\n\n/* Visit */\n.lb-visit { padding: clamp(4rem, 8vw, 6.5rem) 0; }\n.lb-visit-grid { display: grid; gap: 2rem; }\n@media (min-width: 60rem) { .lb-visit-grid { grid-template-columns: 1.1fr .9fr; gap: 4rem; align-items: start; } }\n.lb-hours { width: 100%; margin-top: 1.75rem; border-collapse: collapse; font-size: 1.0625rem; }\n.lb-hours th, .lb-hours td { text-align: left; padding: 1rem 0; border-top: 1px solid #EBD9C6; vertical-align: top; }\n.lb-hours th { font-weight: 800; width: 45%; padding-right: 1rem; }\n.lb-hours tr:last-child th, .lb-hours tr:last-child td { border-bottom: 1px solid #EBD9C6; }\n.lb-where { background: var(--leaf); color: #F3F8F4; border-radius: 28px; padding: clamp(1.5rem, 4vw, 2.25rem); }\n.lb-address { font-family: var(--font-display); font-size: 1.4rem; line-height: 1.3; }\n.lb-where .lb-note { color: #C7DCCF; }\n.lb-where-list { margin: 1.25rem 0; display: grid; gap: .5rem; }\n.lb-where-list li { padding-left: 1.5rem; position: relative; }\n.lb-where-list li::before { content: \"\"; position: absolute; left: 0; top: .5em; width: .7rem; height: .7rem; border-radius: 50% 0 50% 0; background: var(--marigold); }\n\n/* Team */\n.lb-team { padding: clamp(3rem, 7vw, 5.5rem) 0; background: var(--peach); }\n.lb-team-grid { display: grid; gap: 2rem; align-items: center; }\n@media (min-width: 52rem) { .lb-team-grid { grid-template-columns: 18rem 1fr; gap: 3.5rem; } }\n.lb-team img { width: min(18rem, 100%); aspect-ratio: 1; object-fit: cover; border-radius: 50%; border: 8px solid #fff; }\n.lb-role { font-weight: 800; color: var(--leaf); margin: .5rem 0 1rem; }\n.lb-team-grid p + p { margin-top: .9rem; }\n\n/* Reviews slot */\n.lb-reviews { padding: clamp(3.5rem, 7vw, 5rem) 0 0; }\n.lb-review-slot { margin-top: 1.5rem; padding: clamp(1.5rem, 4vw, 2rem); border-radius: 24px; border: 2px dashed #E3CDB6; display: grid; gap: .6rem; }\n\n/* FAQ */\n.lb-faq { padding: clamp(4rem, 8vw, 6.5rem) 0; }\n.lb-faq-grid { display: grid; gap: 2rem; }\n@media (min-width: 60rem) { .lb-faq-grid { grid-template-columns: .8fr 1.2fr; gap: 4rem; } }\n.lb-faq-list { display: grid; gap: .75rem; }\n.lb-faq details { background: #fff; border: 1px solid #EEDFD0; border-radius: 18px; }\n.lb-faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1rem; align-items: center; padding: 1.1rem 1.25rem; font-weight: 800; font-size: 1.0625rem; border-radius: 18px; }\n.lb-faq summary::-webkit-details-marker { display: none; }\n.lb-faq summary::after { content: \"+\"; flex: none; display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%; background: var(--leaf-soft); color: var(--leaf); font-size: 1.25rem; line-height: 1; transition: transform .2s ease; }\n.lb-faq details[open] summary::after { transform: rotate(45deg); }\n.lb-faq details p { padding: 0 1.25rem 1.25rem; color: var(--muted); }\n\n/* Booking */\n.lb-book { padding: clamp(4rem, 8vw, 6.5rem) 0; background: var(--leaf-soft); }\n.lb-book-grid { display: grid; gap: 2rem; }\n@media (min-width: 60rem) { .lb-book-grid { grid-template-columns: .8fr 1.2fr; gap: 4rem; } }\n.lb-book-grid > div p { margin-top: 1rem; font-size: 1.125rem; color: #3F3933; }\n.lb-form { display: grid; gap: 1.25rem; background: #fff; padding: clamp(1.25rem, 4vw, 2rem); border-radius: 28px; }\n.lb-who { border: 0; padding: 0; margin: 0; min-width: 0; }\n.lb-who legend { padding: 0; margin-bottom: .5rem; }\n.lb-chips { display: flex; flex-wrap: wrap; gap: .5rem; }\n.lb-chips label { position: relative; display: inline-flex; align-items: center; gap: .5rem; min-height: 2.75rem; padding: .5rem 1rem; border-radius: 999px; border: 2px solid #E3D6C9; font-weight: 600; font-size: .9375rem; cursor: pointer; }\n.lb-chips input { width: 1.1rem; height: 1.1rem; accent-color: var(--leaf); margin: 0; }\n.lb-chips label:has(input:checked) { border-color: var(--leaf); background: var(--leaf-soft); }\n.lb-chips label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }\n.lb-form .lb-btn { justify-self: start; }\n\n/* Footer */\n.lb-footer { padding: 2.5rem 0; background: var(--leaf-2); color: #E2EDE6; font-size: .9375rem; }\n.lb-footer-grid { display: grid; gap: .75rem; }\n.lb-footer .lb-note { color: #B7CDBF; }\n.lb-footer a { color: #fff; }\n\n/* One gentle entrance on the hero photo */\n@media (prefers-reduced-motion: no-preference) {\n  .lb-hero-media img { animation: lb-in .9s cubic-bezier(.2,.7,.2,1) both; }\n  .lb-leaf { animation: lb-leaf 1.1s cubic-bezier(.2,.7,.2,1) .3s both; }\n}\n@keyframes lb-in { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }\n@keyframes lb-leaf { from { opacity: 0; transform: rotate(-60deg) scale(.6); } to { opacity: 1; transform: rotate(-24deg); } }\n<\/style>\n<\/head>\n<body>\n<a class=\"skip-link\" href=\"#main\">Skip to content<\/a>\n\n<aside class=\"demo-bar\" aria-label=\"About this page\">\n  <div class=\"wrap\">\n    <p><strong>Demo concept.<\/strong> Little Banyan is a fictional clinic. Forms here don't send anything.<\/p>\n    <nav aria-label=\"Demo concepts\">\n      <a href=\"../index.html#demos\">All demos<\/a>\n      <a href=\"maison-ivoire.html\">Cosmetic<\/a>\n      <a href=\"little-banyan.html\" aria-current=\"page\">Family<\/a>\n      <a href=\"axial-implant-centre.html\">Implants<\/a>\n    <\/nav>\n  <\/div>\n<\/aside>\n\n<header class=\"lb-header\">\n  <div class=\"wrap lb-header-row\">\n    <a class=\"lb-logo\" href=\"#main\" aria-label=\"Little Banyan Family Dental, home\">\n      <svg viewBox=\"0 0 48 48\" aria-hidden=\"true\" focusable=\"false\"><circle cx=\"24\" cy=\"18\" r=\"14\" fill=\"#2D5F48\"/><circle cx=\"14\" cy=\"22\" r=\"9\" fill=\"#3E7A5D\"/><circle cx=\"34\" cy=\"22\" r=\"9\" fill=\"#3E7A5D\"/><path d=\"M22 26h4v16h-4z M18 42c2-6 4-9 6-10 2 1 4 4 6 10\" fill=\"#8A5A34\"/><\/svg>\n      <span>Little Banyan<small>Family Dental<\/small><\/span>\n    <\/a>\n    <button class=\"lb-menu\" type=\"button\" aria-expanded=\"false\" aria-controls=\"lb-nav\" data-nav-toggle>\n      <span class=\"visually-hidden\">Menu<\/span><span aria-hidden=\"true\" class=\"lb-menu-icon\"><\/span>\n    <\/button>\n    <nav id=\"lb-nav\" class=\"lb-nav\" aria-label=\"Main\">\n      <a href=\"#ages\">Who we see<\/a>\n      <a href=\"#first-visit\">First visit<\/a>\n      <a href=\"#visit\">Timings<\/a>\n      <a href=\"#faq\">Questions<\/a>\n      <a class=\"lb-btn lb-btn--small\" href=\"#book\">Book a visit<\/a>\n    <\/nav>\n  <\/div>\n<\/header>\n\n<main id=\"main\">\n  <section class=\"lb-hero\" aria-labelledby=\"lb-title\">\n    <div class=\"wrap lb-hero-grid\">\n      <div class=\"lb-hero-copy\">\n        <h1 id=\"lb-title\">Gentle dental care for the whole family, from first tooth to grandparents.<\/h1>\n        <p class=\"lb-lede\">A calm, unhurried clinic in Powai where children are never rushed and parents always know what's happening and what it will cost.<\/p>\n        <div class=\"lb-actions\">\n          <a class=\"lb-btn\" href=\"#book\">Book a visit<\/a>\n          <a class=\"lb-btn lb-btn--soft\" href=\"#first-visit\">What happens at the first visit<\/a>\n        <\/div>\n        <ul class=\"lb-badges\" role=\"list\">\n          <li>Open 6 days a week<\/li>\n          <li>Children's play corner<\/li>\n          <li>Lift and wheelchair access<\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"lb-hero-media\">\n        <img src=\"https://images.unsplash.com/photo-1609220136736-443140cffec6?auto=format&amp;fit=crop&amp;crop=faces&amp;w=900&amp;h=1000&amp;q=72\"\n             srcset=\"https://images.unsplash.com/photo-1609220136736-443140cffec6?auto=format&amp;fit=crop&amp;crop=faces&amp;w=560&amp;h=622&amp;q=72 560w, https://images.unsplash.com/photo-1609220136736-443140cffec6?auto=format&amp;fit=crop&amp;crop=faces&amp;w=900&amp;h=1000&amp;q=72 900w, https://images.unsplash.com/photo-1609220136736-443140cffec6?auto=format&amp;fit=crop&amp;crop=faces&amp;w=1200&amp;h=1333&amp;q=72 1200w\"\n             sizes=\"(min-width: 60rem) 42vw, 100vw\" width=\"900\" height=\"1000\" fetchpriority=\"high\"\n             alt=\"A smiling father carrying a baby on his shoulders, with his young son beside him\">\n        <svg class=\"lb-leaf\" viewBox=\"0 0 120 160\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M60 6C92 34 106 74 92 108c-8 20-20 30-32 44-12-14-24-24-32-44C14 74 28 34 60 6z\" fill=\"#F3B23C\"/><path d=\"M60 26v124M60 62l-16-12M60 62l16-12M60 92l-20-14M60 92l20-14\" stroke=\"#B9801C\" stroke-width=\"3\" stroke-linecap=\"round\" fill=\"none\"/><\/svg>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"ages\" class=\"lb-ages\" aria-labelledby=\"lb-ages-title\">\n    <div class=\"wrap\">\n      <h2 id=\"lb-ages-title\">Care for every age in the family<\/h2>\n      <ul class=\"lb-age-list\" role=\"list\">\n        <li class=\"lb-age lb-age--1\">\n          <h3>Little ones<\/h3>\n          <p class=\"lb-age-range\">From the first tooth to age 6<\/p>\n          <p>Happy first visits, check-ups, fluoride varnish and advice on brushing and bottles.<\/p>\n        <\/li>\n        <li class=\"lb-age lb-age--2\">\n          <h3>Kids and teens<\/h3>\n          <p class=\"lb-age-range\">Ages 6 to 18<\/p>\n          <p>Cavity prevention with sealants, sports mouthguards, and braces or aligner assessments.<\/p>\n        <\/li>\n        <li class=\"lb-age lb-age--3\">\n          <h3>Parents<\/h3>\n          <p class=\"lb-age-range\">Adults<\/p>\n          <p>Cleaning, fillings, root canal treatment, crowns and whitening, scheduled around work.<\/p>\n        <\/li>\n        <li class=\"lb-age lb-age--4\">\n          <h3>Grandparents<\/h3>\n          <p class=\"lb-age-range\">Seniors<\/p>\n          <p>Dentures, implants and gum care, with ground-floor access and extra time per appointment.<\/p>\n        <\/li>\n      <\/ul>\n    <\/div>\n  <\/section>\n\n  <section id=\"first-visit\" class=\"lb-first\" aria-labelledby=\"lb-first-title\">\n    <div class=\"wrap lb-first-grid\">\n      <div class=\"lb-first-media\">\n        <img src=\"https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?auto=format&amp;fit=crop&amp;crop=faces&amp;w=800&amp;h=900&amp;q=70\"\n             srcset=\"https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?auto=format&amp;fit=crop&amp;crop=faces&amp;w=500&amp;h=562&amp;q=70 500w, https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?auto=format&amp;fit=crop&amp;crop=faces&amp;w=800&amp;h=900&amp;q=70 800w\"\n             sizes=\"(min-width: 60rem) 38vw, 100vw\" width=\"800\" height=\"900\" loading=\"lazy\" decoding=\"async\"\n             alt=\"A laughing little girl with a yellow hair bow and paint on her face\">\n      <\/div>\n      <div>\n        <h2 id=\"lb-first-title\">Your child's first visit, step by step<\/h2>\n        <p class=\"lb-intro\">Most children are nervous because they don't know what will happen. So we tell them.<\/p>\n        <ol class=\"lb-steps\" role=\"list\">\n          <li><h3>Meet the chair<\/h3><p>Your child rides the chair up and down and holds the little mirror before anyone looks inside.<\/p><\/li>\n          <li><h3>Count the teeth<\/h3><p>A quick, gentle look while sitting on your lap if they prefer. No instruments they haven't seen first.<\/p><\/li>\n          <li><h3>Brushing lesson<\/h3><p>We show your child, and you, the best way to brush at their age.<\/p><\/li>\n          <li><h3>A plan for parents<\/h3><p>You leave with a written summary, any treatment advised and its cost, with no pressure to decide that day.<\/p><\/li>\n        <\/ol>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"visit\" class=\"lb-visit\" aria-labelledby=\"lb-visit-title\">\n    <div class=\"wrap lb-visit-grid\">\n      <div>\n        <h2 id=\"lb-visit-title\">Timings and finding us<\/h2>\n        <table class=\"lb-hours\">\n          <caption class=\"visually-hidden\">Clinic timings<\/caption>\n          <tbody>\n            <tr><th scope=\"row\">Monday to Friday<\/th><td>9:30 am to 1:30 pm, 5 pm to 9 pm<\/td><\/tr>\n            <tr><th scope=\"row\">Saturday<\/th><td>9:30 am to 4 pm<\/td><\/tr>\n            <tr><th scope=\"row\">Sunday<\/th><td>Closed. Emergencies by phone<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <div class=\"lb-where\">\n        <p class=\"lb-address\">Ground floor, Hiranandani Gardens, Powai, Mumbai<span class=\"lb-note\"> (fictional address)<\/span><\/p>\n        <ul class=\"lb-where-list\" role=\"list\">\n          <li>Visitor parking in the building basement<\/li>\n          <li>Five minutes' walk from the main bus stop<\/li>\n          <li>Pram and wheelchair friendly entrance<\/li>\n        <\/ul>\n        <p class=\"lb-note\">On a live site, this panel includes a one-tap \u201cGet directions\u201d link and the clinic's phone number.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"lb-team\" aria-labelledby=\"lb-team-title\">\n    <div class=\"wrap lb-team-grid\">\n      <img src=\"https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&amp;fit=crop&amp;crop=faces&amp;w=640&amp;h=640&amp;q=70\" width=\"640\" height=\"640\" loading=\"lazy\" decoding=\"async\"\n           alt=\"A smiling dentist in blue scrubs with his arms folded\">\n      <div>\n        <h2 id=\"lb-team-title\">Hello, I'm Dr. Arjun Banerji<\/h2>\n        <p class=\"lb-role\">BDS, MDS in Paediatric and Preventive Dentistry<\/p>\n        <p>I started Little Banyan so families could see one dentist they trust, year after year. Many of my patients now bring their own children.<\/p>\n        <p class=\"lb-note\">Fictional profile and stock photograph for this demo. A live site shows the real dentist's photo, qualifications and Dental Council registration number.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"lb-reviews\" aria-labelledby=\"lb-rev-title\">\n    <div class=\"wrap\">\n      <h2 id=\"lb-rev-title\">What families say about us<\/h2>\n      <div class=\"lb-review-slot\">\n        <p><strong>Real Google reviews appear here on a live site,<\/strong> loaded from the clinic's Google Business Profile, with names and dates exactly as posted.<\/p>\n        <p class=\"lb-note\">This is a fictional clinic, so there are no reviews to show and none have been made up.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"faq\" class=\"lb-faq\" aria-labelledby=\"lb-faq-title\">\n    <div class=\"wrap lb-faq-grid\">\n      <h2 id=\"lb-faq-title\">Questions parents ask us<\/h2>\n      <div class=\"lb-faq-list\">\n        <details>\n          <summary>When should my child first see a dentist?<\/summary>\n          <p>Around their first birthday, or within six months of the first tooth appearing. Early visits are short and mostly about getting comfortable.<\/p>\n        <\/details>\n        <details>\n          <summary>Can I stay with my child during treatment?<\/summary>\n          <p>Yes. Parents are always welcome in the room, and younger children can sit on your lap for check-ups.<\/p>\n        <\/details>\n        <details>\n          <summary>Will I know the cost before treatment starts?<\/summary>\n          <p>Always. You get a written estimate for any treatment before it begins, and nothing is added without asking you first.<\/p>\n        <\/details>\n        <details>\n          <summary>Do you see dental emergencies?<\/summary>\n          <p>Yes, during clinic hours. On Sundays, call the clinic number and the on-call dentist will advise you.<\/p>\n        <\/details>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"book\" class=\"lb-book\" aria-labelledby=\"lb-book-title\">\n    <div class=\"wrap lb-book-grid\">\n      <div>\n        <h2 id=\"lb-book-title\">Book a visit<\/h2>\n        <p>Send a request and the front desk will call you back to confirm a time, usually the same day.<\/p>\n      <\/div>\n      <form class=\"lb-form\" data-enquiry=\"demo\" novalidate>\n        <div class=\"field\">\n          <label for=\"lb-name\">Your name<\/label>\n          <input id=\"lb-name\" name=\"name\" type=\"text\" autocomplete=\"name\" required aria-describedby=\"lb-name-error\">\n          <p id=\"lb-name-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"lb-phone\">Mobile number<\/label>\n          <input id=\"lb-phone\" name=\"phone\" type=\"tel\" inputmode=\"tel\" autocomplete=\"tel-national\" required aria-describedby=\"lb-phone-error\">\n          <p id=\"lb-phone-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n        <\/div>\n        <fieldset class=\"field lb-who\">\n          <legend>Who is the appointment for?<\/legend>\n          <div class=\"lb-chips\">\n            <label><input type=\"radio\" name=\"for\" value=\"Me\" checked> Me<\/label>\n            <label><input type=\"radio\" name=\"for\" value=\"My child\"> My child<\/label>\n            <label><input type=\"radio\" name=\"for\" value=\"A parent or grandparent\"> A parent or grandparent<\/label>\n            <label><input type=\"radio\" name=\"for\" value=\"More than one of us\"> More than one of us<\/label>\n          <\/div>\n        <\/fieldset>\n        <div class=\"field\">\n          <label for=\"lb-day\">Preferred time<\/label>\n          <select id=\"lb-day\" name=\"preferred_time\">\n            <option>Weekday morning<\/option>\n            <option>Weekday evening<\/option>\n            <option>Saturday<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field\">\n          <div class=\"check\">\n            <input id=\"lb-consent\" name=\"consent\" type=\"checkbox\" required aria-describedby=\"lb-consent-error\">\n            <label for=\"lb-consent\">I agree to the clinic calling or messaging me about this booking. No medical details are needed here.<\/label>\n          <\/div>\n          <p id=\"lb-consent-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n        <\/div>\n        <div class=\"form-status\" data-form-status role=\"status\" aria-live=\"polite\" hidden><\/div>\n        <button class=\"lb-btn\" type=\"submit\">Request appointment<\/button>\n      <\/form>\n    <\/div>\n  <\/section>\n<\/main>\n\n<footer class=\"lb-footer\">\n  <div class=\"wrap lb-footer-grid\">\n    <p><strong>Little Banyan Family Dental<\/strong>, Powai, Mumbai.<\/p>\n    <p>Monday to Saturday. Closed Sundays.<\/p>\n    <p class=\"lb-note\">A fictional clinic. Demo concept by <a href=\"../index.html\">Farhan Khan<\/a>. Photographs from Unsplash.<\/p>\n  <\/div>\n<\/footer>\n\n<script>/*\n * Site configuration \u2014 the only file you need to edit to go live.\n *\n * FORM_ENDPOINT\n *   A form backend that accepts a JSON POST and returns 2xx on success.\n *   Works with Formspree (https://formspree.io/f/xxxxxxx) or\n *   Web3Forms (https://api.web3forms.com/submit \u2014 also set WEB3FORMS_KEY).\n *   Leave empty and the studio form falls back to opening an email draft\n *   to CONTACT_EMAIL. If both are empty the form shows a clear\n *   \"not connected\" error instead of pretending to send.\n *\n * WHATSAPP_NUMBER\n *   International format, digits only, no \"+\" or spaces. e.g. \"919812345678\".\n *   Leave empty and every WhatsApp button stays hidden.\n */\nwindow.SITE_CONFIG = {\n  FORM_ENDPOINT: \"\",\n  WEB3FORMS_KEY: \"\",\n  CONTACT_EMAIL: \"\",\n  WHATSAPP_NUMBER: \"\",\n  WHATSAPP_MESSAGE: \"Hi Farhan, I saw your dental website demos and would like to discuss a website for my clinic.\"\n};\n<\/script>\n<script>/* Shared behaviour: navigation, enquiry forms, WhatsApp links. No dependencies. */\n(function () {\n  \"use strict\";\n  var cfg = window.SITE_CONFIG || {};\n\n  /* ---------- Mobile navigation ---------- */\n  document.querySelectorAll(\"[data-nav-toggle]\").forEach(function (btn) {\n    var menu = document.getElementById(btn.getAttribute(\"aria-controls\"));\n    if (!menu) return;\n    function close() {\n      btn.setAttribute(\"aria-expanded\", \"false\");\n      menu.classList.remove(\"is-open\");\n    }\n    btn.addEventListener(\"click\", function () {\n      var open = btn.getAttribute(\"aria-expanded\") === \"true\";\n      btn.setAttribute(\"aria-expanded\", String(!open));\n      menu.classList.toggle(\"is-open\", !open);\n    });\n    menu.querySelectorAll(\"a\").forEach(function (a) { a.addEventListener(\"click\", close); });\n    document.addEventListener(\"keydown\", function (e) {\n      if (e.key === \"Escape\" && btn.getAttribute(\"aria-expanded\") === \"true\") { close(); btn.focus(); }\n    });\n  });\n\n  /* ---------- WhatsApp: only shown when a number is configured ---------- */\n  var wa = String(cfg.WHATSAPP_NUMBER || \"\").replace(/\\D/g, \"\");\n  if (wa.length >= 10) {\n    var href = \"https://wa.me/\" + wa + \"?text=\" + encodeURIComponent(cfg.WHATSAPP_MESSAGE || \"\");\n    document.querySelectorAll(\"[data-whatsapp]\").forEach(function (el) {\n      el.setAttribute(\"href\", href);\n      el.setAttribute(\"target\", \"_blank\");\n      el.setAttribute(\"rel\", \"noopener\");\n      el.hidden = false;\n    });\n  }\n\n  /* ---------- Footer year ---------- */\n  document.querySelectorAll(\"[data-year]\").forEach(function (el) { el.textContent = new Date().getFullYear(); });\n\n  /* ---------- Forms ---------- */\n  var MESSAGES = {\n    name: \"Enter your name.\",\n    clinic: \"Enter your clinic's name.\",\n    phone: \"Enter a 10-digit Indian mobile number, e.g. 98123 45678.\",\n    email: \"Enter an email address like name@clinic.com.\",\n    consent: \"Tick the box so we're allowed to contact you.\",\n    select: \"Choose an option.\",\n    generic: \"Fill in this field.\"\n  };\n\n  function normalisePhone(v) {\n    var d = v.replace(/\\D/g, \"\");\n    if (d.length === 12 && d.indexOf(\"91\") === 0) d = d.slice(2);\n    if (d.length === 11 && d.charAt(0) === \"0\") d = d.slice(1);\n    return d;\n  }\n\n  function validateField(field) {\n    var v = field.type === \"checkbox\" ? field.checked : field.value.trim();\n    var key = field.dataset.msg || field.name;\n    var msg = \"\";\n    if (field.required && (field.type === \"checkbox\" ? !v : v === \"\")) {\n      msg = MESSAGES[key] || (field.tagName === \"SELECT\" ? MESSAGES.select : MESSAGES.generic);\n    } else if (v && field.type === \"tel\" && !/^[6-9]\\d{9}$/.test(normalisePhone(field.value))) {\n      msg = MESSAGES.phone;\n    } else if (v && field.type === \"email\" && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(field.value.trim())) {\n      msg = MESSAGES.email;\n    }\n    var err = document.getElementById(field.id + \"-error\");\n    if (err) err.textContent = msg;\n    field.setAttribute(\"aria-invalid\", msg ? \"true\" : \"false\");\n    var wrap = field.closest(\".field\");\n    if (wrap) wrap.classList.toggle(\"has-error\", !!msg);\n    return !msg;\n  }\n\n  function setStatus(form, type, html) {\n    var box = form.querySelector(\"[data-form-status]\");\n    if (!box) return;\n    box.className = \"form-status is-\" + type;\n    box.innerHTML = html;\n    box.hidden = false;\n    box.setAttribute(\"tabindex\", \"-1\");\n    box.focus({ preventScroll: false });\n  }\n\n  function collect(form) {\n    var data = {};\n    new FormData(form).forEach(function (val, key) { data[key] = typeof val === \"string\" ? val.trim() : val; });\n    if (data.phone) data.phone = \"+91 \" + normalisePhone(data.phone);\n    delete data.company_website; // honeypot\n    return data;\n  }\n\n  function mailtoFallback(data) {\n    var lines = Object.keys(data).filter(function (k) { return k !== \"consent\"; })\n      .map(function (k) { return k.replace(/_/g, \" \") + \": \" + data[k]; });\n    return \"mailto:\" + cfg.CONTACT_EMAIL +\n      \"?subject=\" + encodeURIComponent(\"Website enquiry \u2014 \" + (data.clinic || data.name || \"dental clinic\")) +\n      \"&body=\" + encodeURIComponent(lines.join(\"\\n\"));\n  }\n\n  document.querySelectorAll(\"form[data-enquiry]\").forEach(function (form) {\n    var mode = form.getAttribute(\"data-enquiry\"); // \"studio\" | \"demo\"\n    var fields = Array.prototype.slice.call(form.querySelectorAll(\"input:not([type=hidden]):not([name=company_website]), select, textarea\"));\n    var submit = form.querySelector(\"[type=submit]\");\n    var label = submit ? submit.textContent : \"\";\n\n    fields.forEach(function (f) {\n      f.addEventListener(\"blur\", function () { if (f.value || f.type === \"checkbox\") validateField(f); });\n      f.addEventListener(\"input\", function () { if (f.getAttribute(\"aria-invalid\") === \"true\") validateField(f); });\n      f.addEventListener(\"change\", function () { if (f.getAttribute(\"aria-invalid\") === \"true\") validateField(f); });\n    });\n\n    form.addEventListener(\"submit\", function (e) {\n      e.preventDefault();\n      var firstBad = null;\n      fields.forEach(function (f) { if (!validateField(f) && !firstBad) firstBad = f; });\n      if (firstBad) {\n        var n = fields.filter(function (f) { return f.getAttribute(\"aria-invalid\") === \"true\"; }).length;\n        setStatus(form, \"error\", \"<strong>\" + n + (n === 1 ? \" field needs\" : \" fields need\") + \" attention.<\/strong> Check the highlighted fields and try again.\");\n        firstBad.focus();\n        return;\n      }\n      var hp = form.querySelector(\"[name=company_website]\");\n      if (hp && hp.value) { form.reset(); return; } // silently drop bots\n\n      var data = collect(form);\n\n      if (mode === \"demo\") {\n        submit.disabled = true; submit.textContent = \"Checking\u2026\";\n        setTimeout(function () {\n          submit.disabled = false; submit.textContent = label;\n          form.reset();\n          fields.forEach(function (f) { f.removeAttribute(\"aria-invalid\"); });\n          setStatus(form, \"success\", \"<strong>Request received \u2014 in a live site.<\/strong> This is a demo concept, so nothing was sent and nothing was stored. On a real clinic site this goes straight to the front desk.\");\n        }, 600);\n        return;\n      }\n\n      if (cfg.FORM_ENDPOINT) {\n        submit.disabled = true; submit.textContent = \"Sending\u2026\";\n        var payload = Object.assign({}, data, { _subject: \"Website enquiry \u2014 \" + (data.clinic || data.name) });\n        if (cfg.WEB3FORMS_KEY) payload.access_key = cfg.WEB3FORMS_KEY;\n        fetch(cfg.FORM_ENDPOINT, {\n          method: \"POST\",\n          headers: { \"Content-Type\": \"application/json\", \"Accept\": \"application/json\" },\n          body: JSON.stringify(payload)\n        }).then(function (res) {\n          if (!res.ok) throw new Error(\"HTTP \" + res.status);\n          form.reset();\n          fields.forEach(function (f) { f.removeAttribute(\"aria-invalid\"); });\n          setStatus(form, \"success\", \"<strong>Enquiry sent.<\/strong> I'll reply within one working day on the number or email you gave.\");\n        }).catch(function () {\n          setStatus(form, \"error\", \"<strong>Your enquiry didn't send.<\/strong> Check your connection and press \u201cSend enquiry\u201d again.\" +\n            (cfg.CONTACT_EMAIL ? \" Or email <a href=\\\"mailto:\" + cfg.CONTACT_EMAIL + \"\\\">\" + cfg.CONTACT_EMAIL + \"<\/a>.\" : \"\"));\n        }).finally(function () {\n          submit.disabled = false; submit.textContent = label;\n        });\n        return;\n      }\n\n      if (cfg.CONTACT_EMAIL) {\n        window.location.href = mailtoFallback(data);\n        setStatus(form, \"success\", \"<strong>Your email app should now be open with the enquiry filled in.<\/strong> Press send there to finish. If nothing opened, email <a href=\\\"mailto:\" + cfg.CONTACT_EMAIL + \"\\\">\" + cfg.CONTACT_EMAIL + \"<\/a>.\");\n        return;\n      }\n\n      setStatus(form, \"error\", \"<strong>This form isn't connected yet.<\/strong> The site owner needs to add a form endpoint or email address in <code>assets/js/config.js<\/code>. Nothing was sent.\");\n    });\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n", "axial": "<!doctype html>\n<html lang=\"en-IN\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Axial Implant Centre, Lower Parel (demo concept)<\/title>\n  <meta name=\"description\" content=\"Demo concept for an implant dentistry website. Axial Implant Centre is a fictional clinic.\">\n  <meta name=\"robots\" content=\"noindex, nofollow\">\n  <meta name=\"theme-color\" content=\"#0B1B2B\">\n  <link rel=\"icon\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iIzBGM0QzNyIvPjxwYXRoIGQ9Ik04IDZoMTZ2MTJhOCA4IDAgMCAxLTE2IDB6IiBmaWxsPSIjQThFNkNGIi8+PC9zdmc+Cg==\" type=\"image/svg+xml\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"preconnect\" href=\"https://images.unsplash.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,500;100,600;112,700;125,800&family=IBM+Plex+Mono:wght@500&display=swap\">\n  <style>/* Shared foundation for the studio site and every demo concept.\n   Each page sets its own tokens on :root; this file only consumes them. */\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-body);\n  font-size: 1.0625rem;\n  line-height: 1.6;\n  text-rendering: optimizeLegibility;\n  -webkit-font-smoothing: antialiased;\n  overflow-x: clip;\n}\nimg, svg, video { display: block; max-width: 100%; height: auto; }\nimg { background: var(--img-placeholder, rgba(127,127,127,.15)); }\nh1, h2, h3, h4, p, ul, ol, dl, dd, figure, blockquote { margin: 0; }\nul[role=\"list\"], ol[role=\"list\"] { list-style: none; padding: 0; }\na { color: inherit; text-underline-offset: .18em; text-decoration-thickness: 1px; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\n:target { scroll-margin-top: 6rem; }\n[hidden] { display: none !important; }\n\n/* Focus: always visible for keyboard users */\n:focus { outline: none; }\n:focus-visible {\n  outline: 3px solid var(--focus, #1a73e8);\n  outline-offset: 3px;\n  border-radius: 2px;\n}\n\n.visually-hidden {\n  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;\n  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;\n}\n.skip-link {\n  position: absolute; left: 1rem; top: -4rem; z-index: 100;\n  background: var(--fg); color: var(--bg); padding: .75rem 1rem; text-decoration: none; font-weight: 600;\n}\n.skip-link:focus { top: 1rem; }\n\n.wrap { width: min(100% - 2rem, var(--max, 72rem)); margin-inline: auto; }\n@media (min-width: 48rem) { .wrap { width: min(100% - 4rem, var(--max, 72rem)); } }\n\n/* ---------- Demo concept banner (shown on every demo page) ---------- */\n.demo-bar {\n  position: relative; z-index: 60;\n  background: #1b1f1e; color: #f1f4f3;\n  font: 500 .8125rem/1.4 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n}\n.demo-bar .wrap { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: center; justify-content: space-between; padding-block: .55rem; }\n.demo-bar strong { color: #ffd88a; font-weight: 600; }\n.demo-bar a { color: #f1f4f3; font-weight: 600; }\n.demo-bar nav { display: flex; gap: 1rem; flex-wrap: wrap; }\n.demo-bar nav a[aria-current=\"page\"] { text-decoration: none; opacity: .6; }\n\n/* ---------- Forms ---------- */\n.field { display: grid; gap: .4rem; align-content: start; }\n.field label, .field legend { font-weight: 600; font-size: .9375rem; }\n.field .hint { font-size: .8125rem; color: var(--muted); margin-top: -.2rem; }\n.field input, .field select, .field textarea {\n  width: 100%; min-height: 3rem; padding: .75rem .9rem;\n  background: var(--field-bg, #fff); color: var(--field-fg, inherit);\n  border: 1px solid var(--field-border, #9aa5a1); border-radius: var(--field-radius, 6px);\n  transition: border-color .15s ease, box-shadow .15s ease;\n}\n.field textarea { min-height: 7rem; resize: vertical; }\n.field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(13 Centre \u2014 implant dentistry (demo concept)\n   Clinical and modern: Archivo (wide display, normal text), Plex Mono for clinical data, ink, titanium, cobalt */\n:root {\n  --ink: #0B1B2B;\n  --ink-2: #13283D;\n  --titanium: #5F6E7C;\n  --mist: #EEF2F5;\n  --line: #D4DCE3;\n  --cobalt: #2343D6;\n  --cobalt-2: #1A34AE;\n  --bg: #FFFFFF;\n  --fg: var(--ink);\n  --muted: #4D5B68;\n  --accent: var(--cobalt);\n  --focus: #2343D6;\n  --error: #B42318;\n  --success: #12704A;\n  --field-bg: #fff;\n  --field-border: #8C99A5;\n  --field-radius: 4px;\n  --font-display: \"Archivo\", \"Arial\", sans-serif;\n  --font-body: \"Archivo\", \"Segoe UI\", system-ui, sans-serif;\n  --font-data: \"IBM Plex Mono\", ui-monospace, Consolas, monospace;\n  --max: 76rem;\n  --img-placeholder: #DCE3E9;\n}\nbody { font-stretch: 100%; }\nh1, h2, h3 { font-family: var(--font-display); line-height: 1.04; text-wrap: balance; }\nh1, h2 { font-weight: 800; font-stretch: 125%; letter-spacing: -.03em; }\nh2 { font-size: clamp(1.9rem, 1.3rem + 2.4vw, 3rem); }\nh3 { font-weight: 700; font-stretch: 112%; font-size: 1.1875rem; letter-spacing: -.01em; }\n.ax-note { font-size: .875rem; color: var(--muted); }\n\n.ax-btn {\n  display: inline-flex; align-items: center; justify-content: center; min-height: 3rem; padding: .8rem 1.4rem;\n  background: var(--cobalt); color: #fff; border: 2px solid var(--cobalt); border-radius: 4px;\n  font-weight: 600; font-size: 1rem; text-decoration: none; text-align: center;\n  transition: background-color .15s ease, border-color .15s ease, color .15s ease;\n}\n.ax-btn:hover { background: var(--cobalt-2); border-color: var(--cobalt-2); }\n.ax-btn--line { background: transparent; color: var(--ink); border-color: var(--ink); }\n.ax-btn--line:hover { background: var(--ink); color: #fff; border-color: var(--ink); }\n.ax-btn--small { min-height: 2.5rem; padding: .45rem 1rem; font-size: .9375rem; }\n\n/* Header */\n.ax-header { position: sticky; top: 0; z-index: 50; background: #fff;

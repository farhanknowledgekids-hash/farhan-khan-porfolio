 1rem + .35vw, 1.25rem); color: var(--muted); max-width: 48ch; }\n.ax-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }\n.ax-hero-figure { position: relative; margin: 0; }\n.ax-hero-figure img { width: 100%; aspect-ratio: 8 / 9; object-fit: cover; border-radius: 4px; }\n.ax-hero-figure figcaption { position: relative; margin: -3.5rem 1rem 0; }\n@media (min-width: 60rem) { .ax-hero-figure figcaption { position: absolute; left: -3rem; bottom: 2rem; margin: 0; width: min(22rem, 90%); } }\n.ax-spec { background: var(--ink); color: #fff; border-radius: 4px; padding: .5rem 1.1rem; margin: 0; }\n.ax-spec div { display: grid; grid-template-columns: 7.5rem 1fr; gap: .75rem; padding: .7rem 0; border-top: 1px solid rgba(255,255,255,.14); }\n.ax-spec div:first-child { border-top: 0; }\n.ax-spec dt { font-family: var(--font-data); font-size: .75rem; letter-spacing: .02em; color: #9FB3C8; padding-top: .15rem; }\n.ax-spec dd { font-weight: 600; font-size: .9375rem; }\n.ax-spec--light { background: var(--mist); color: var(--ink); margin-top: 1.25rem; }\n.ax-spec--light div { border-color: var(--line); }\n.ax-spec--light dt { color: var(--titanium); }\n\n/* Process timeline */\n.ax-process { padding: clamp(4rem, 8vw, 7rem) 0; background: var(--ink); color: #fff; }\n.ax-head { display: grid; gap: 1rem; margin-bottom: 3rem; }\n@media (min-width: 60rem) { .ax-head { grid-template-columns: 1.3fr 1fr; gap: 4rem; align-items: end; } }\n.ax-head p { color: #A9BACB; }\n.ax-timeline { display: grid; margin: 0; }\n@media (min-width: 64rem) { .ax-timeline { grid-template-columns: repeat(5, 1fr); } }\n.ax-timeline li { position: relative; padding: 0 0 2rem 2rem; border-left: 2px solid #2C4560; }\n.ax-timeline li::before { content: \"\"; position: absolute; left: -7px; top: .15rem; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 2px solid #6F8CF5; }\n.ax-timeline li:last-child { padding-bottom: 0; }\n@media (min-width: 64rem) {\n  .ax-timel  0; } }\n.ax-tech-img { width: 100%; aspect-ratio: 5 / 2; object-fit: cover; border-radius: 4px; margin-top: 3rem; }\n@media (max-width: 40rem) { .ax-tech-img { aspect-ratio: 16 / 9; } }\n\n/* Cost */\n.ax-cost { padding: clamp(4rem, 8vw, 7rem) 0; }\n.ax-cost-grid { display: grid; gap: 2.5rem; }\n@media (min-width: 60rem) { .ax-cost-grid { grid-template-columns: .9fr 1.1fr; gap: 4rem; } }\n.ax-cost-grid > div p { margin-top: 1rem; color: var(--muted); font-size: 1.0625rem; }\n.ax-factors { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin: 0; }\n@media (min-width: 36rem) { .ax-factors { grid-template-columns: 1fr 1fr; } }\n.ax-factors li { background: #fff; padding: 1.4rem 1.25rem; }\n.ax-factors p { margin-top: .4rem; color: var(--muted); font-size: .975rem; }\n\n/* Team */\n.ax-team { padding: clamp(4rem, 8vw, 6rem) 0; border-top: 1px solid var(--line); }\n.ax-team-grid { display: grid; gap: 2rem; align-items: center; }\n@media (min-width: 52rem) { .ax-team-grid { grid-template-columns: 20rem 1fr; gap: 4rem; } }\n.ax-team img { width: 100%; max-width: 20rem; aspect-ratio: 64 / 76; object-fit: cover; border-radius: 4px; filter: grayscale(.15); }\n.ax-team h2 { font-size: 1rem; font-stretch: 100%; font-weight: 600; letter-spacing: 0; color: var(--titanium); }\n.ax-name { font-weight: 800; font-stretch: 125%; font-size: clamp(2rem, 1.4rem + 2.4vw, 3.2rem); letter-spacing: -.03em; line-height: 1.05; margin-top: .4rem; max-width: none; }\n.ax-team .ax-note { margin-top: 1rem; }\n\n/* Referrals */\n.ax-ref { padding: clamp(3rem, 6vw, 4.5rem) 0; background: var(--cobalt); color: #fff; }\n.ax-ref-grid { display: grid; gap: 1.25rem; }\n@media (min-width: 60rem) { .ax-ref-grid { grid-template-columns: .9fr 1.1fr; gap: 4rem; align-items: start; } }\n.ax-ref p { font-size: 1.125rem; }\n.ax-ref .ax-note { color: #CBD4FF; font-size: .875rem; margin-top: .75rem; }\n\n/* Reviews */\n.ax-reviews { padding: clamp(4rem, 8vw, 6rem) 0 0; }\n.ax-review-slot { margin-top: 1.5rem; padding: clamp(1.5rem, 4vw, 2rem); border: 1px dashed var(--field-border); border-radius: 4px; display: grid; gap: .6rem; }\n\n/* Booking */\n.ax-book { padding: clamp(4rem, 8vw, 7rem) 0; }\n.ax-book-grid { display: grid; gap: 2rem; }\n@media (min-width: 60rem) { .ax-book-grid { grid-template-columns: .8fr 1.2fr; gap: 4rem; } }\n.ax-book-grid > div p { margin-top: 1rem; color: var(--muted); font-size: 1.0625rem; }\n.ax-form { display: grid; gap: 1.25rem; padding: clamp(1.25rem, 3vw, 2rem); border: 1px solid var(--line); border-top: 4px solid var(--cobalt); border-radius: 4px; background: #fff; }\n.ax-form-row { display: grid; gap: 1.25rem; }\n@media (min-width: 40rem) { .ax-form-row { grid-template-columns: 1fr 1fr; } }\n.ax-optional { font-weight: 400; color: var(--muted); }\n.ax-form .ax-btn { justify-self: start; }\n\n/* Footer */\n.ax-footer { padding: 2.5rem 0; background: var(--ink); color: #C9D4DF; font-size: .9375rem; }\n.ax-footer-grid { display: grid; gap: .75rem; }\n.ax-footer .ax-note { color: #8FA2B5; }\n.ax-footer a { color: #fff; }\n<\/style>\n<\/head>\n<body>\n<a class=\"skip-link\" href=\"#main\">Skip to content<\/a>\n\n<aside class=\"demo-bar\" aria-label=\"About this page\">\n  <div class=\"wrap\">\n    <p><strong>Demo concept.<\/strong> Axial Implant Centre is a fictional clinic. Forms here don't send anything.<\/p>\n    <nav aria-label=\"Demo concepts\">\n      <a href=\"../index.html#demos\">All demos<\/a>\n      <a href=\"maison-ivoire.html\">Cosmetic<\/a>\n      <a href=\"little-banyan.html\">Family<\/a>\n      <a href=\"axial-implant-centre.html\" aria-current=\"page\">Implants<\/a>\n    <\/nav>\n  <\/div>\n<\/aside>\n\n<header class=\"ax-header\">\n  <div class=\"wrap ax-header-row\">\n    <a class=\"ax-logo\" href=\"#main\" aria-label=\"Axial Implant Centre, home\">\n      <svg viewBox=\"0 0 24 40\" aria-hidden=\"true\" focusable=\"false\"><path d=\"M4 2h16l-2 8H6z\" fill=\"currentColor\"/><path d=\"M7 12h10M7.5 17h9M8 22h8M8.5 27h7M9 32h6M10.5 37h3\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"/><\/svg>\n      <span>Axial<small>Implant Centre<\/small><\/span>\n    <\/a>\n    <button class=\"ax-menu\" type=\"button\" aria-expanded=\"false\" aria-controls=\"ax-nav\" data-nav-toggle>Menu<\/button>\n    <nav id=\"ax-nav\" class=\"ax-nav\" aria-label=\"Main\">\n      <a href=\"#process\">Treatment process<\/a>\n      <a href=\"#options\">Implant options<\/a>\n      <a href=\"#cost\">Cost<\/a>\n      <a href=\"#referrals\">For dentists<\/a>\n      <a class=\"ax-btn ax-btn--small\" href=\"#assessment\">Book an assessment<\/a>\n    <\/nav>\n  <\/div>\n<\/header>\n\n<main id=\"main\">\n  <section class=\"ax-hero\" aria-labelledby=\"ax-title\">\n    <div class=\"wrap ax-hero-grid\">\n      <div class=\"ax-hero-copy\">\n        <h1 id=\"ax-title\">Dental implants, planned precisely and explained clearly.<\/h1>\n        <p class=\"ax-lede\">Every implant at Axial is planned on a 3D scan before surgery, placed with a printed surgical guide, and quoted in writing before you agree to anything.<\/p>\n        <div class=\"ax-actions\">\n          <a class=\"ax-btn\" href=\"#assessment\">Book an implant assessment<\/a>\n          <a class=\"ax-btn ax-btn--line\" href=\"#process\">See the process<\/a>\n        <\/div>\n      <\/div>\n      <figure class=\"ax-hero-figure\">\n        <img src=\"https://images.unsplash.com/photo-1588776814546-daab30f310ce?auto=format&amp;fit=crop&amp;w=960&amp;h=1080&amp;q=72\"\n             srcset=\"https://images.unsplash.com/photo-1588776814546-daab30f310ce?auto=format&amp;fit=crop&amp;w=600&amp;h=675&amp;q=72 600w, https://images.unsplash.com/photo-1588776814546-daab30f310ce?auto=format&amp;fit=crop&amp;w=960&amp;h=1080&amp;q=72 960w, https://images.unsplash.com/photo-1588776814546-daab30f310ce?auto=format&amp;fit=crop&amp;w=1280&amp;h=1440&amp;q=72 1280w\"\n             sizes=\"(min-width: 60rem) 44vw, 100vw\" width=\"960\" height=\"1080\" fetchpriority=\"high\"\n             alt=\"Two dentists in surgical caps and masks treating a patient in a bright operatory\">\n        <figcaption>\n          <dl class=\"ax-spec\">\n            <div><dt>Planning<\/dt><dd>CBCT 3D scan<\/dd><\/div>\n            <div><dt>Placement<\/dt><dd>Printed surgical guide<\/dd><\/div>\n            <div><dt>Restoration<\/dt><dd>Zirconia or porcelain crown<\/dd><\/div>\n          <\/dl>\n        <\/figcaption>\n      <\/figure>\n    <\/div>\n  <\/section>\n\n  <section id=\"process\" class=\"ax-process\" aria-labelledby=\"ax-process-title\">\n    <div class=\"wrap\">\n      <div class=\"ax-head\">\n        <h2 id=\"ax-process-title\">The implant process, from assessment to final tooth<\/h2>\n        <p>Timings vary from patient to patient. Your dentist will give you your own timeline after the assessment.<\/p>\n      <\/div>\n      <ol class=\"ax-timeline\" role=\"list\">\n        <li>\n          <p class=\"ax-when\">Day 1<\/p>\n          <h3>Assessment and 3D scan<\/h3>\n          <p>A full examination, a CBCT scan and a frank conversation about whether an implant is right for you.<\/p>\n        <\/li>\n        <li>\n          <p class=\"ax-when\">Within a week<\/p>\n          <h3>Digital plan and written quote<\/h3>\n          <p>The implant position is planned on your scan. You receive the plan, the options and an itemised cost.<\/p>\n        <\/li>\n        <li>\n          <p class=\"ax-when\">Surgery day<\/p>\n          <h3>Guided placement<\/h3>\n          <p>The implant is placed under local anaesthetic using a guide made from your plan. A temporary tooth is often possible.<\/p>\n        <\/li>\n        <li>\n          <p class=\"ax-when\">Typically 3 to 6 months<\/p>\n          <h3>Healing<\/h3>\n          <p>The implant bonds with the bone. Review visits check that healing is on track.<\/p>\n        <\/li>\n        <li>\n          <p class=\"ax-when\">Final visit<\/p>\n          <h3>Your permanent crown<\/h3>\n          <p>A crown is made from a digital scan, matched to your neighbouring teeth and fixed in place.<\/p>\n        <\/li>\n      <\/ol>\n    <\/div>\n  <\/section>\n\n  <section id=\"options\" class=\"ax-options\" aria-labelledby=\"ax-options-title\">\n    <div class=\"wrap\">\n      <h2 id=\"ax-options-title\">Which kind of implant treatment?<\/h2>\n      <div class=\"ax-option-grid\">\n        <article class=\"ax-option\">\n          <svg viewBox=\"0 0 120 60\" aria-hidden=\"true\" focusable=\"false\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M8 10h20v18a10 10 0 0 1-20 0zM92 10h20v18a10 10 0 0 1-20 0z\" opacity=\".35\"/><path d=\"M50 10h20v18a10 10 0 0 1-20 0z\"/><path d=\"M56 40h8M56.5 45h7M57 50h6M58 55h4\"/><\/g><\/svg>\n          <h3>One missing tooth<\/h3>\n          <p>A single implant and crown, without touching the healthy teeth on either side.<\/p>\n        <\/article>\n        <article class=\"ax-option\">\n          <svg viewBox=\"0 0 120 60\" aria-hidden=\"true\" focusable=\"false\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14 10h92v18a10 10 0 0 1-10 10H24a10 10 0 0 1-10-10z\"/><path d=\"M26 44h8M26.5 49h7M27 54h6M86 44h8M86.5 49h7M87 54h6\"/><\/g><\/svg>\n          <h3>Several missing teeth<\/h3>\n          <p>An implant-supported bridge: two implants can often replace three or four teeth.<\/p>\n        <\/article>\n        <article class=\"ax-option\">\n          <svg viewBox=\"0 0 120 60\" aria-hidden=\"true\" focusable=\"false\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 14c18-8 90-8 108 0v10c-18 10-90 10-108 0z\"/><path d=\"M18 40h7M18.5 45h6M19 50h5M48 42h7M48.5 47h6M49 52h5M66 42h7M66.5 47h6M67 52h5M95 40h7M95.5 45h6M96 50h5\"/><\/g><\/svg>\n          <h3>A full arch<\/h3>\n          <p>A fixed set of teeth on four to six implants, as an alternative to removable dentures.<\/p>\n        <\/article>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"ax-tech\" aria-labelledby=\"ax-tech-title\">\n    <div class=\"wrap ax-tech-grid\">\n      <div>\n        <h2 id=\"ax-tech-title\">What's used, and why it matters to you<\/h2>\n        <p>Equipment only matters if it changes the result or the experience. Here's what each piece does.<\/p>\n      <\/div>\n      <table class=\"ax-table\">\n        <caption class=\"visually-hidden\">Clinic equipment and what it does for patients<\/caption>\n        <thead><tr><th scope=\"col\">Equipment<\/th><th scope=\"col\">What it means for you<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><th scope=\"row\">CBCT 3D scanner<\/th><td>Shows bone height, width and nerve position, so the implant is planned on facts, not estimates.<\/td><\/tr>\n          <tr><th scope=\"row\">Intraoral scanner<\/th><td>Digital impressions instead of impression putty, for a more comfortable visit.<\/td><\/tr>\n          <tr><th scope=\"row\">Printed surgical guide<\/th><td>Transfers the digital plan to surgery, for accurate placement through a smaller opening.<\/td><\/tr>\n          <tr><th scope=\"row\">Implant passport<\/th><td>A record of your implant brand and size, so any dentist can maintain it in future.<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n    <div class=\"wrap\">\n      <img class=\"ax-tech-img\" src=\"https://images.unsplash.com/photo-1600170311833-c2cf5280ce49?auto=format&amp;fit=crop&amp;w=1600&amp;h=640&amp;q=70\"\n           srcset=\"https://images.unsplash.com/photo-1600170311833-c2cf5280ce49?auto=format&amp;fit=crop&amp;w=800&amp;h=420&amp;q=70 800w, https://images.unsplash.com/photo-1600170311833-c2cf5280ce49?auto=format&amp;fit=crop&amp;w=1600&amp;h=640&amp;q=70 1600w\"\n           sizes=\"(min-width: 76rem) 72rem, 100vw\" width=\"1600\" height=\"640\" loading=\"lazy\" decoding=\"async\"\n           alt=\"A digital dental model of a set of teeth on a screen\">\n    <\/div>\n  <\/section>\n\n  <section id=\"cost\" class=\"ax-cost\" aria-labelledby=\"ax-cost-title\">\n    <div class=\"wrap ax-cost-grid\">\n      <div>\n        <h2 id=\"ax-cost-title\">What affects the cost of an implant<\/h2>\n        <p>No two cases cost the same, so this page doesn't publish a price that might not apply to you. After your assessment you get an itemised, written quote, and the price doesn't change unless your treatment plan does.<\/p>\n      <\/div>\n      <ul class=\"ax-factors\" role=\"list\">\n        <li><h3>Number of implants<\/h3><p>One tooth, a bridge or a full arch.<\/p><\/li>\n        <li><h3>Bone grafting<\/h3><p>Needed only if the scan shows too little bone.<\/p><\/li>\n        <li><h3>Implant system<\/h3><p>Different brands, all with documented track records.<\/p><\/li>\n        <li><h3>Crown material<\/h3><p>Zirconia, porcelain-fused-to-metal or full ceramic.<\/p><\/li>\n        <li><h3>Temporary teeth<\/h3><p>Whether you'd like a tooth during healing.<\/p><\/li>\n        <li><h3>Extractions<\/h3><p>If a failing tooth must come out first.<\/p><\/li>\n      <\/ul>\n    <\/div>\n  <\/section>\n\n  <section class=\"ax-team\" aria-labelledby=\"ax-team-title\">\n    <div class=\"wrap ax-team-grid\">\n      <img src=\"https://images.unsplash.com/photo-1612531386530-97286d97c2d2?auto=format&amp;fit=crop&amp;crop=faces&amp;w=640&amp;h=760&amp;q=70\" width=\"640\" height=\"760\" loading=\"lazy\" decoding=\"async\"\n           alt=\"A doctor with glasses and a stethoscope, arms folded\">\n      <div>\n        <h2 id=\"ax-team-title\">Your implant surgeon<\/h2>\n        <p class=\"ax-name\">Dr. Vikram Sethna<\/p>\n        <dl class=\"ax-spec ax-spec--light\">\n          <div><dt>Qualifications<\/dt><dd>BDS, MDS (Oral and Maxillofacial Surgery)<\/dd><\/div>\n          <div><dt>Focus<\/dt><dd>Guided implant surgery and full-arch rehabilitation<\/dd><\/div>\n          <div><dt>Registration<\/dt><dd>Dental Council number shown on a live site<\/dd><\/div>\n        <\/dl>\n        <p class=\"ax-note\">Fictional profile and stock photograph for this demo.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"referrals\" class=\"ax-ref\" aria-labelledby=\"ax-ref-title\">\n    <div class=\"wrap ax-ref-grid\">\n      <h2 id=\"ax-ref-title\">For referring dentists<\/h2>\n      <div>\n        <p>Refer a patient for the surgical stage only, and we return them to you for the crown, with the scan, plan and implant details. Your patient stays your patient.<\/p>\n        <p class=\"ax-note\">On a live site, this links to a referral form and a downloadable referral pad.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"ax-reviews\" aria-labelledby=\"ax-rev-title\">\n    <div class=\"wrap\">\n      <h2 id=\"ax-rev-title\">Patient reviews<\/h2>\n      <div class=\"ax-review-slot\">\n        <p>A live site shows the clinic's real Google reviews here, loaded from its Google Business Profile. Implant patients read reviews closely, so they're never edited or invented.<\/p>\n        <p class=\"ax-note\">This is a fictional clinic, so no reviews are shown.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section id=\"assessment\" class=\"ax-book\" aria-labelledby=\"ax-book-title\">\n    <div class=\"wrap ax-book-grid\">\n      <div>\n        <h2 id=\"ax-book-title\">Book an implant assessment<\/h2>\n        <p>The coordinator will call to arrange your 45-minute assessment and tell you what to bring. Please don't send X-rays or medical history here; the dentist goes through them with you in person.<\/p>\n      <\/div>\n      <form class=\"ax-form\" data-enquiry=\"demo\" novalidate>\n        <div class=\"ax-form-row\">\n          <div class=\"field\">\n            <label for=\"ax-name\">Name<\/label>\n            <input id=\"ax-name\" name=\"name\" type=\"text\" autocomplete=\"name\" required aria-describedby=\"ax-name-error\">\n            <p id=\"ax-name-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"ax-phone\">Mobile number<\/label>\n            <input id=\"ax-phone\" name=\"phone\" type=\"tel\" inputmode=\"tel\" autocomplete=\"tel-national\" required aria-describedby=\"ax-phone-error\">\n            <p id=\"ax-phone-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n          <\/div>\n        <\/div>\n        <div class=\"ax-form-row\">\n          <div class=\"field\">\n            <label for=\"ax-email\">Email <span class=\"ax-optional\">(optional)<\/span><\/label>\n            <input id=\"ax-email\" name=\"email\" type=\"email\" autocomplete=\"email\" aria-describedby=\"ax-email-error\">\n            <p id=\"ax-email-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"ax-reason\">I'm looking for<\/label>\n            <select id=\"ax-reason\" name=\"reason\" required aria-describedby=\"ax-reason-error\">\n              <option value=\"\">Choose one<\/option>\n              <option>Information about implants<\/option>\n              <option>A second opinion on a plan I've received<\/option>\n              <option>An assessment appointment<\/option>\n            <\/select>\n            <p id=\"ax-reason-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <div class=\"check\">\n            <input id=\"ax-consent\" name=\"consent\" type=\"checkbox\" required aria-describedby=\"ax-consent-error\">\n            <label for=\"ax-consent\">I agree to Axial contacting me about this request by phone, WhatsApp or email.<\/label>\n          <\/div>\n          <p id=\"ax-consent-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n        <\/div>\n        <div class=\"form-status\" data-form-status role=\"status\" aria-live=\"polite\" hidden><\/div>\n        <button class=\"ax-btn\" type=\"submit\">Request assessment<\/button>\n      <\/form>\n    <\/div>\n  <\/section>\n<\/main>\n\n<footer class=\"ax-footer\">\n  <div class=\"wrap ax-footer-grid\">\n    <p><strong>Axial Implant Centre<\/strong>, Lower Parel, Mumbai.<\/p>\n    <p>Monday to Saturday, 10 am to 7 pm.<\/p>\n    <p class=\"ax-note\">A fictional clinic. Demo concept by <a href=\"../index.html\">Farhan Khan<\/a>. Photographs from Unsplash.<\/p>\n  <\/div>\n<\/footer>\n\n<script>/*\n * Site configuration \u2014 the only file you need to edit to go live.\n *\n * FORM_ENDPOINT\n *   A form backend that accepts a JSON POST and returns 2xx on success.\n *   Works with Formspree (https://formspree.io/f/xxxxxxx) or\n *   Web3Forms (https://api.web3forms.com/submit \u2014 also set WEB3FORMS_KEY).\n *   Leave empty and the studio form falls back to opening an email draft\n *   to CONTACT_EMAIL. If both are empty the form shows a clear\n *   \"not connected\" error instead of pretending to send.\n *\n * WHATSAPP_NUMBER\n *   International format, digits only, no \"+\" or spaces. e.g. \"919812345678\".\n *   Leave empty and every WhatsApp button stays hidden.\n */\nwindow.SITE_CONFIG = {\n  FORM_ENDPOINT: \"\",\n  WEB3FORMS_KEY: \"\",\n  CONTACT_EMAIL: \"\",\n  WHATSAPP_NUMBER: \"\",\n  WHATSAPP_MESSAGE: \"Hi Farhan, I saw your dental website demos and would like to discuss a website for my clinic.\"\n};\n<\/script>\n<script>/* Shared behaviour: navigation, enquiry forms, WhatsApp links. No dependencies. */\n(function () {\n  \"use strict\";\n  var cfg = window.SITE_CONFIG || {};\n\n  /* ---------- Mobile navigation ---------- */\n  document.querySelectorAll(\"[data-nav-toggle]\").forEach(function (btn) {\n    var menu = document.getElementById(btn.getAttribute(\"aria-controls\"));\n    if (!menu) return;\n    function close() {\n      btn.setAttribute(\"aria-expanded\", \"false\");\n      menu.classList.remove(\"is-open\");\n    }\n    btn.addEventListener(\"click\", function () {\n      var open = btn.getAttribute(\"aria-expanded\") === \"true\";\n      btn.setAttribute(\"aria-expanded\", String(!open));\n      menu.classList.toggle(\"is-open\", !open);\n    });\n    menu.querySelectorAll(\"a\").forEach(function (a) { a.addEventListener(\"click\", close); });\n    document.addEventListener(\"keydown\", function (e) {\n      if (e.key === \"Escape\" && btn.getAttribute(\"aria-expanded\") === \"true\") { close(); btn.focus(); }\n    });\n  });\n\n  /* ---------- WhatsApp: only shown when a number is configured ---------- */\n  var wa = String(cfg.WHATSAPP_NUMBER || \"\").replace(/\\D/g, \"\");\n  if (wa.length >= 10) {\n    var href = \"https://wa.me/\" + wa + \"?text=\" + encodeURIComponent(cfg.WHATSAPP_MESSAGE || \"\");\n    document.querySelectorAll(\"[data-whatsapp]\").forEach(function (el) {\n      el.setAttribute(\"href\", href);\n      el.setAttribute(\"target\", \"_blank\");\n      el.setAttribute(\"rel\", \"noopener\");\n      el.hidden = false;\n    });\n  }\n\n  /* ---------- Footer year ---------- */\n  document.querySelectorAll(\"[data-year]\").forEach(function (el) { el.textContent = new Date().getFullYear(); });\n\n  /* ---------- Forms ---------- */\n  var MESSAGES = {\n    name: \"Enter your name.\",\n    clinic: \"Enter your clinic's name.\",\n    phone: \"Enter a 10-digit Indian mobile number, e.g. 98123 45678.\",\n    email: \"Enter an email address like name@clinic.com.\",\n    consent: \"Tick the box so we're allowed to contact you.\",\n    select: \"Choose an option.\",\n    generic: \"Fill in this field.\"\n  };\n\n  function normalisePhone(v) {\n    var d = v.replace(/\\D/g, \"\");\n    if (d.length === 12 && d.indexOf(\"91\") === 0) d = d.slice(2);\n    if (d.length === 11 && d.charAt(0) === \"0\") d = d.slice(1);\n    return d;\n  }\n\n  function validateField(field) {\n    var v = field.type === \"checkbox\" ? field.checked : field.value.trim();\n    var key = field.dataset.msg || field.name;\n    var msg = \"\";\n    if (field.required && (field.type === \"checkbox\" ? !v : v === \"\")) {\n      msg = MESSAGES[key] || (field.tagName === \"SELECT\" ? MESSAGES.select : MESSAGES.generic);\n    } else if (v && field.type === \"tel\" && !/^[6-9]\\d{9}$/.test(normalisePhone(field.value))) {\n      msg = MESSAGES.phone;\n    } else if (v && field.type === \"email\" && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(field.value.trim())) {\n      msg = MESSAGES.email;\n    }\n    var err = document.getElementById(field.id + \"-error\");\n    if (err) err.textContent = msg;\n    field.setAttribute(\"aria-invalid\", msg ? \"true\" : \"false\");\n    var wrap = field.closest(\".field\");\n    if (wrap) wrap.classList.toggle(\"has-error\", !!msg);\n    return !msg;\n  }\n\n  function setStatus(form, type, html) {\n    var box = form.querySelector(\"[data-form-status]\");\n    if (!box) return;\n    box.className = \"form-status is-\" + type;\n    box.innerHTML = html;\n    box.hidden = false;\n    box.setAttribute(\"tabindex\", \"-1\");\n    box.focus({ preventScroll: false });\n  }\n\n  function collect(form) {\n    var data = {};\n    new FormData(form).forEach(function (val, key) { data[key] = typeof val === \"string\" ? val.trim() : val; });\n    if (data.phone) data.phone = \"+91 \" + normalisePhone(data.phone);\n    delete data.company_website; // honeypot\n    return data;\n  }\n\n  function mailtoFallback(data) {\n    var lines = Object.keys(data).filter(function (k) { return k !== \"consent\"; })\n      .map(function (k) { return k.replace(/_/g, \" \") + \": \" + data[k]; });\n    return \"mailto:\" + cfg.CONTACT_EMAIL +\n      \"?subject=\" + encodeURIComponent(\"Website enquiry \u2014 \" + (data.clinic || data.name || \"dental clinic\")) +\n      \"&body=\" + encodeURIComponent(lines.join(\"\\n\"));\n  }\n\n  document.querySelectorAll(\"form[data-enquiry]\").forEach(function (form) {\n    var mode = form.getAttribute(\"data-enquiry\"); // \"studio\" | \"demo\"\n    var fields = Array.prototype.slice.call(form.querySelectorAll(\"input:not([type=hidden]):not([name=company_website]), select, textarea\"));\n    var submit = form.querySelector(\"[type=submit]\");\n    var label = submit ? submit.textContent : \"\";\n\n    fields.forEach(function (f) {\n      f.addEventListener(\"blur\", function () { if (f.value || f.type === \"checkbox\") validateField(f); });\n      f.addEventListener(\"input\", function () { if (f.getAttribute(\"aria-invalid\") === \"true\") validateField(f); });\n      f.addEventListener(\"change\", function () { if (f.getAttribute(\"aria-invalid\") === \"true\") validateField(f); });\n    });\n\n    form.addEventListener(\"submit\", function (e) {\n      e.preventDefault();\n      var firstBad = null;\n      fields.forEach(function (f) { if (!validateField(f) && !firstBad) firstBad = f; });\n      if (firstBad) {\n        var n = fields.filter(function (f) { return f.getAttribute(\"aria-invalid\") === \"true\"; }).length;\n        setStatus(form, \"error\", \"<strong>\" + n + (n === 1 ? \" field needs\" : \" fields need\") + \" attention.<\/strong> Check the highlighted fields and try again.\");\n        firstBad.focus();\n        return;\n      }\n      var hp = form.querySelector(\"[name=company_website]\");\n      if (hp && hp.value) { form.reset(); return; } // silently drop bots\n\n      var data = collect(form);\n\n      if (mode === \"demo\") {\n        submit.disabled = true; submit.textContent = \"Checking\u2026\";\n        setTimeout(function () {\n          submit.disabled = false; submit.textContent = label;\n          form.reset();\n          fields.forEach(function (f) { f.removeAttribute(\"aria-invalid\"); });\n          setStatus(form, \"success\", \"<strong>Request received \u2014 in a live site.<\/strong> This is a demo concept, so nothing was sent and nothing was stored. On a real clinic site this goes straight to the front desk.\");\n        }, 600);\n        return;\n      }\n\n      if (cfg.FORM_ENDPOINT) {\n        submit.disabled = true; submit.textContent = \"Sending\u2026\";\n        var payload = Object.assign({}, data, { _subject: \"Website enquiry \u2014 \" + (data.clinic || data.name) });\n        if (cfg.WEB3FORMS_KEY) payload.access_key = cfg.WEB3FORMS_KEY;\n        fetch(cfg.FORM_ENDPOINT, {\n          method: \"POST\",\n          headers: { \"Content-Type\": \"application/json\", \"Accept\": \"application/json\" },\n          body: JSON.stringify(payload)\n        }).then(function (res) {\n          if (!res.ok) throw new Error(\"HTTP \" + res.status);\n          form.reset();\n          fields.forEach(function (f) { f.removeAttribute(\"aria-invalid\"); });\n          setStatus(form, \"success\", \"<strong>Enquiry sent.<\/strong> I'll reply within one working day on the number or email you gave.\");\n        }).catch(function () {\n          setStatus(form, \"error\", \"<strong>Your enquiry didn't send.<\/strong> Check your connection and press \u201cSend enquiry\u201d again.\" +\n            (cfg.CONTACT_EMAIL ? \" Or email <a href=\\\"mailto:\" + cfg.CONTACT_EMAIL + \"\\\">\" + cfg.CONTACT_EMAIL + \"<\/a>.\" : \"\"));\n        }).finally(function () {\n          submit.disabled = false; submit.textContent = label;\n        });\n        return;\n      }\n\n      if (cfg.CONTACT_EMAIL) {\n        window.location.href = mailtoFallback(data);\n        setStatus(form, \"success\", \"<strong>Your email app should now be open with the enquiry filled in.<\/strong> Press send there to finish. If nothing opened, email <a href=\\\"mailto:\" + cfg.CONTACT_EMAIL + \"\\\">\" + cfg.CONTACT_EMAIL + \"<\/a>.\");\n        return;\n      }\n\n      setStatus(form, \"error\", \"<strong>This form isn't connected yet.<\/strong> The site owner needs to add a form endpoint or email address in <code>assets/js/config.js<\/code>. Nothing was sent.\");\n    });\n  });\n})();\n<\/script>\n<\/body>\n<\/html>\n", "privacy": "<!doctype html>\n<html lang=\"en-IN\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Privacy notice | Farhan Khan, dental clinic websites<\/title>\n  <meta name=\"description\" content=\"How enquiry details sent through this website are used, stored and deleted.\">\n  <meta name=\"theme-color\" content=\"#0F3D37\">\n  <link rel=\"icon\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iIzBGM0QzNyIvPjxwYXRoIGQ9Ik04IDZoMTZ2MTJhOCA4IDAgMCAxLTE2IDB6IiBmaWxsPSIjQThFNkNGIi8+PC9zdmc+Cg==\" type=\"image/svg+xml\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600&display=swap\">\n  <style>/* Shared foundation for the studio site and every demo concept.\n   Each page sets its own tokens on :root; this file only consumes them. */\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-body);\n  font-size: 1.0625rem;\n  line-height: 1.6;\n  text-rendering: optimizeLegibility;\n  -webkit-font-smoothing: antialiased;\n  overflow-x: clip;\n}\nimg, svg, video { display: block; max-width: 100%; height: auto; }\nimg { background: var(--img-placeholder, rgba(127,127,127,.15)); }\nh1, h2, h3, h4, p, ul, ol, dl, dd, figure, blockquote { margin: 0; }\nul[role=\"list\"], ol[role=\"list\"] { list-style: none; padding: 0; }\na { color: inherit; text-underline-offset: .18em; text-decoration-thickness: 1px; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\n:target { scroll-margin-top: 6rem; }\n[hidden] { display: none !important; }\n\n/* Focus: always visible esize: vertical; }\n.field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 1.15rem) 1.3rem, calc(100% - .8rem) 1.3rem; background-size: .35rem .35rem; background-repeat: no-repeat; padding-right: 2.25rem; }\n.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--field-border-hover, currentColor); }\n.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {\n  outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent);\n}\n.field.has-error input, .field.has-error select, .field.has-error textarea { border-color: var(--error, #b42318); }\n.field-error { color: var(--error, #b42318); font-size: .875rem; font-weight: 600; min-height: 0; }\n.field-error:empty { display: none; }\n.check { display: grid; grid-template-columns: auto 1fr; gap: .7rem; align-items: start; font-size: .9375rem; }\n.check input { width: 1.25rem; height: 1.25rem; margin-top: .2rem; accent-color: var(--accent); }\n.check label { font-weight: 400; }\n.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }\n\n.form-status { border-radius: var(--field-radius, 6px); padding: 1rem 1.1rem; font-size: .9375rem; line-height: 1.5; border: 1px solid; }\n.form-status.is-success { background: color-mix(in srgb, var(--success, #127a4a) 10%, var(--bg)); border-color: var(--success, #127a4a); color: var(--fg); }\n.form-status.is-error { background: color-mix(in srgb, var(--error, #b42318) 8%, var(--bg)); border-color: var(--error, #b42318); color: var(--fg); }\n.form-status:focus-visible { outline-offset: 2px; }\n\nbutton[disabled] { opacity: .65; cursor: progress; }\n\n/* ---------- Motion ---------- */\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }\n}\n<\/style>\n  <style>/* Studio site \u2014 Farhan Khan, dental clinic websites\n   Palette: operatory green, porcelain, graphite, mint, enamel shade A2 */\n:root {\n  --green: #0F3D37;\n  --green-2: #15524A;\n  --porcelain: #F4F6F5;\n  --graphite: #18201E;\n  --mint: #A8E6CF;\n  --shade: #E7DCC4;\n  --rule: #D3DBD8;\n  --bg: var(--porcelain);\n  --fg: var(--graphite);\n  --muted: #4E5B57;\n  --accent: var(--green);\n  --focus: #1D6FD8;\n  --error: #B42318;\n  --success: #127A4A;\n  --field-bg: #fff;\n  --field-border: #8C9894;\n  --field-radius: 8px;\n  --font-display: \"Bricolage Grotesque\", \"Segoe UI\", system-ui, sans-serif;\n  --font-body: \"Figtree\", \"Segoe UI\", system-ui, sans-serif;\n  --max: 74rem;\n  --img-placeholder: #DDE4E1;\n}\n\nh1, h2, h3 { font-family: var(--font-display); font-weight: 800; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }\nh2 { font-size: clamp(2rem, 1.4rem + 2.6vw, 3.25rem); }\nh3 { font-size: 1.375rem; letter-spacing: -.01em; line-height: 1.2; }\np { max-width: 66ch; }\n\n/* ---------- Buttons: one system everywhere ---------- */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;\n  min-height: 3rem; padding: .8rem 1.35rem;\n  background: var(--green); color: var(--porcelain);\n  border: 2px solid var(--green); border-radius: 8px;\n  font-weight: 600; font-size: 1rem; line-height: 1.2; text-decoration: none; text-align: center;\n  transition: background-color .15s ease, color .15s ease, border-color .15s ease;\n}\n.btn:hover { background: var(--green-2); border-color: var(--green-2); }\n.btn-ghost { background: transparent; color: var(--green); }\n.btn-ghost:hover { background: var(--green); color: var(--porcelain); }\n.btn-small { min-height: 2.5rem; padding: .5rem 1rem; font-size: .9375rem; }\n.btn-block { width: 100%; }\n.btn-wa { background: #1F7A4C; border-c reen)\" stroke-width=\"1.6\" opacity=\".55\"/><\/svg>\n      <span><strong>Farhan Khan<\/strong><small>Dental clinic websites<\/small><\/span>\n    <\/a>\n    <a class=\"btn btn-small\" href=\"./#enquire\">Get a quote<\/a>\n  <\/div>\n<\/header>\n\n<main id=\"main\" class=\"doc\">\n  <div class=\"wrap\">\n    <h1>Privacy notice<\/h1>\n    <p class=\"updated\">Last updated 16 October 2026<\/p>\n\n    <p>This notice explains what happens to the details you send through the enquiry form on this website. It is written to follow India's Digital Personal Data Protection Act, 2023.<\/p>\n\n    <h2>Who is responsible<\/h2>\n    <p>Farhan Khan, an individual web designer based in Mumbai, decides how your details are used. <span data-contact-line>To contact me about your data, use the enquiry form on the home page.<\/span><\/p>\n\n    <h2>What is collected<\/h2>\n    <ul>\n      <li>Your name, your clinic's name and area<\/li>\n      <li>Your mobile number and, if you give it, your email address<\/li>\n      <li>The package you're interested in and any message you write<\/li>\n    <\/ul>\n    <p>The form does not ask for, and you should not send, any patient or health information.<\/p>\n\n    <h2>Why it is used<\/h2>\n    <p>Only to reply to your enquiry, prepare a quote and, if you go ahead, run your project. Your details are never sold, shared for marketing, or added to a mailing list.<\/p>\n\n    <h2>Where it is stored<\/h2>\n    <p>Enquiries are delivered by email through a form service that processes them on my behalf. They are kept for up to 12 months after our last conversation, or for as long as the law requires if you become a client, and are then deleted.<\/p>\n\n    <h2>Your rights<\/h2>\n    <p>You can ask to see the details I hold about you, correct them, or have them deleted, and you can withdraw your consent at any time. Withdrawing consent stops further contact; it doesn't affect anything already done. If you're not satisfied with my response, you can complain to the Data Protection Board of India.<\/p>\n\n    <h2>Cookies and third parties<\/h2>\n    <p>This website sets no cookies and uses no tracking or advertising scripts. Fonts are loaded from Google Fonts and photographs from Unsplash, so those services receive your device's IP address when the page loads, as with any website that uses them.<\/p>\n\n    <h2>Demo concept pages<\/h2>\n    <p>The forms on the Maison Ivoire, Little Banyan and Axial demo pages are for demonstration only. They check what you type in your browser and then discard it; nothing is sent or stored.<\/p>\n\n    <p style=\"margin-top:2.5rem\"><a href=\"./\">Back to the home page<\/a><\/p>\n  <\/div>\n<\/main>\n\n<footer class=\"site-footer\">\n  <div class=\"wrap footer-grid\">\n    <p><strong>Farhan Khan<\/strong>, dental clinic websites, Mumbai.<\/p>\n    <nav aria-label=\"Footer\"><a href=\"./#demos\">Demos<\/a><a href=\"./#packages\">Packages<\/a><a href=\"privacy.html\" aria-current=\"page\">Privacy notice<\/a><\/nav>\n  <\/div>\n<\/footer>\n<script>/*\n * Site configuration \u2014 the only file you need to edit to go live.\n *\n * FORM_ENDPOINT\n *   A form backend that accepts a JSON POST and returns 2xx on success.\n *   Works with Formspree (https://formspree.io/f/xxxxxxx) or\n *   Web3Forms (https://api.web3forms.com/submit \u2014 also set WEB3FORMS_KEY).\n *   Leave empty and the studio form falls back to opening an email draft\n *   to CONTACT_EMAIL. If both are empty the form shows a clear\n *   \"not connected\" error instead of pretending to send.\n *\n * WHATSAPP_NUMBER\n *   International format, digits only, no \"+\" or spaces. e.g. \"919812345678\".\n *   Leave empty and every WhatsApp button stays hidden.\n */\nwindow.SITE_CONFIG = {\n  FORM_ENDPOINT: \"\",\n  WEB3FORMS_KEY: \"\",\n  CONTACT_EMAIL: \"\",\n  WHATSAPP_NUMBER: \"\",\n  WHATSAPP_MESSAGE: \"Hi Farhan, I saw your dental website demos and would like to discuss a website for my clinic.\"\n};\n<\/script>\n<script>\n  (   var TITLES={"home": "Dental Clinic Websites | Farhan Khan", "ivoire": "Maison Ivoire (demo)", "banyan": "Little Banyan Family Dental (demo)", "axial": "Axial Implant Centre (demo)", "privacy": "Privacy notice | Farhan Khan"};

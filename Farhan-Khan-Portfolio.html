  &lt;style&gt;/* Shared foundation for the studio site and every demo concept.

  &lt;style&gt;/* Studio site — Farhan Khan, dental clinic websites
   Palette: operatory green, porcelain, graphite, mint, enamel shade A2 */
:root {
  --green: #0F3D37;
  --green-2: #15524A;
  --porcelain: #F4F6F5;
  --graphite: #18201E;
  --mint: #A8E6CF;
  --shade: #E7DCC4;
  --rule: #D3DBD8;
  --bg: var(--porcelain);
  --fg: var(--graphite);
  --muted: #4E5B57;
  --accent: var(--green);
  --focus: #1D6FD8;
  --error: #B42318;
  --success: #127A4A;
  --field-bg: #fff;
  --field-border: #8C9894;
  --field-radius: 8px;
  --font-display: &quot;Bricolage Grotesque&quot;, &quot;Segoe UI&quot;, system-ui, sans-serif;
  --font-body: &quot;Figtree&quot;, &quot;Segoe UI&quot;, system-ui, sans-serif;
  --max: 74rem;
  --img-placeholder: #DDE4E1;
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 800; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: clamp(2rem, 1.4rem + 2.6vw, 3.25rem); }
h3 { font-size: 1.375rem; letter-spacing: -.01em; line-height: 1.2; }
p { max-width: 66ch; }

/* ---------- Buttons: one system everywhere ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  min-height: 3rem; padding: .8rem 1.35rem;
  background: var(--green); color: var(--porcelain);
  border: 2px solid var(--green); border-radius: 8px;
  font-weight: 600; font-size: 1rem; line-height: 1.2; text-decoration: none; text-align: center;
  transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}
.btn:hover { background: var(--green-2); border-color: var(--green-2); }
.btn-ghost { background: transparent; color: var(--green); }
.btn-ghost:hover { background: var(--green); color: var(--porcelain); }
.btn-small { min-height: 2.5rem; padding: .5rem 1rem; font-size: .9375rem; }
.btn-block { width: 100%; }
.btn-wa { background: #1F7A4C; border-color: #1F7A4C; margin-top: 1rem; }
.btn-wa:hover { background: #17633D; border-color: #17633D; }

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 50; background: var(--green); color: var(--porcelain); border-bottom: 1px solid rgba(255,255,255,.08); }
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 4.25rem; }
.wordmark { display: inline-flex; align-items: center; gap: .7rem; text-decoration: none; color: var(--porcelain); }
.wordmark-mark { width: 1.6rem; color: var(--mint); }
.wordmark strong { display: block; font-family: var(--font-display); font-size: 1.125rem; letter-spacing: -.01em; line-height: 1.1; }
.wordmark small { display: block; font-size: .8125rem; color: #B9CCC7; }
.site-nav { display: flex; align-items: center; gap: 1.75rem; }
.site-nav a:not(.btn) { color: var(--porcelain); text-decoration: none; font-weight: 500; font-size: .9375rem; padding-block: .5rem; border-bottom: 2px solid transparent; }
.site-nav a:not(.btn):hover { border-bottom-color: var(--mint); }
.site-header .btn { background: var(--mint); color: var(--green); border-color: var(--mint); }
.site-header .btn:hover { background: #C5F0DF; border-color: #C5F0DF; }
.nav-toggle { display: none; }

@media (max-width: 52rem) {
  .nav-toggle { display: inline-grid; place-items: center; width: 3rem; height: 3rem; background: none; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; }
  .nav-toggle-bars, .nav-toggle-bars::before, .nav-toggle-bars::after { display: block; width: 1.25rem; height: 2px; background: var(--porcelain); position: relative; transition: transform .2s ease; }
  .nav-toggle-bars::before, .nav-toggle-bars::after { content: &quot;&quot;; position: absolute; left: 0; }
  .nav-toggle-bars::before { top: -6px; } .nav-toggle-bars::after { top: 6px; }
  .nav-toggle[aria-expanded=&quot;true&quot;] .nav-toggle-bars { background: transparent; }
  .nav-toggle[aria-expanded=&quot;true&quot;] .nav-toggle-bars::before { transform: translateY(6px) rotate(45deg); }
  .nav-toggle[aria-expanded=&quot;true&quot;] .nav-toggle-bars::after { transform: translateY(-6px) rotate(-45deg); }
  .site-nav { display: none; position: absolute; inset: 100% 0 auto 0; flex-direction: column; align-items: stretch; gap: 0; background: var(--green); padding: .5rem 1rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,.12); }
  .site-nav.is-open { display: flex; }
  .site-nav a:not(.btn) { padding: .9rem 0; border-bottom: 1px solid rgba(255,255,255,.1); }
  .site-nav .btn { margin-top: 1rem; }
}

/* ---------- Hero ---------- */
.hero { background: var(--green); color: var(--porcelain); padding: clamp(2.5rem, 6vw, 5.5rem) 0 clamp(3rem, 7vw, 6rem); }
.hero-grid { display: grid; gap: 3rem; align-items: center; }
@media (min-width: 60rem) { .hero-grid { grid-template-columns: 1.08fr .92fr; gap: 4rem; } }
.hero h1 { font-size: clamp(2.5rem, 1.5rem + 4.4vw, 4.6rem); line-height: .98; letter-spacing: -.035em; max-width: 14ch; }
.lede { margin-top: 1.5rem; font-size: clamp(1.0625rem, 1rem + .3vw, 1.25rem); color: #D4E2DE; max-width: 52ch; }
.hero-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
.hero .btn { background: var(--mint); color: var(--green); border-color: var(--mint); }
.hero .btn:hover { background: #C5F0DF; border-color: #C5F0DF; }
.hero .btn-ghost { background: transparent; color: var(--porcelain); border-color: rgba(244,246,245,.5); }
.hero .btn-ghost:hover { background: rgba(244,246,245,.1); border-color: var(--porcelain); }
.hero-facts { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 1rem 2.5rem; margin-top: 2.75rem; padding-top: 1.5rem; border-top: 1px solid rgba(244,246,245,.18); }
.hero-facts dt { font-size: .8125rem; color: #A9C0BA; }
.hero-facts dd { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; letter-spacing: -.01em; }
@media (max-width: 30rem) { .hero-facts { grid-template-columns: 1fr 1fr; } }

/* The memorable element: demos presented as a dental shade guide */
.shade-guide { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(.6rem, 1.5vw, 1rem); align-items: start; padding-bottom: 2rem; }
.shade { position: relative; display: block; text-decoration: none; color: var(--graphite); border-radius: 10px 10px 999px 999px / 10px 10px 34% 34%; overflow: hidden; background: var(--shade); box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 18px 40px -18px rgba(0,0,0,.55); transition: transform .35s cubic-bezier(.2,.7,.2,1); }
.shade:nth-child(2) { margin-top: 2.5rem; }
.shade:nth-child(3) { margin-top: 5rem; }
.shade img { width: 100%; aspect-ratio: 42 / 62; object-fit: cover; }
.shade-label { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: .1rem; justify-items: center; text-align: center; padding: 2.6rem .5rem 1.6rem; background: linear-gradient(to top, rgba(10,22,20,.86) 30%, rgba(10,22,20,0)); color: #fff; }
.shade-name { font-size: clamp(.95rem, .7rem + .9vw, 1.35rem); line-height: 1.1; }
.shade-kind { font-size: .8125rem; color: #E1ECE8; }
.shade:hover, .shade:focus-visible { transform: translateY(-.6rem); }
.shade-note { position: absolute; left: 0; bottom: -.25rem; font-size: .8125rem; color: #A9C0BA; }
@media (max-width: 30rem) { .shade:nth-child(2) { margin-top: 1.25rem; } .shade:nth-child(3) { margin-top: 2.5rem; } .shade-label { padding: 2rem .25rem 1rem; } }

/* Demo brand faces, loaded as subsets */
.ivoire-type { font-family: &quot;Bodoni Moda&quot;, Didot, Georgia, serif; font-style: italic; font-weight: 500; letter-spacing: -.01em; }
.banyan-type { font-family: &quot;Young Serif&quot;, Georgia, serif; font-weight: 400; letter-spacing: -.01em; }
.axial-type  { font-family: &quot;Archivo&quot;, &quot;Arial Narrow&quot;, sans-serif; font-weight: 700; font-stretch: 112%; letter-spacing: -.02em; }

/* ---------- Sections ---------- */
.section { padding: clamp(4rem, 9vw, 7.5rem) 0; }
.section-head { display: grid; gap: 1rem; margin-bottom: clamp(2.5rem, 5vw, 4rem); }
@media (min-width: 60rem) { .section-head { grid-template-columns: 1fr 1fr; align-items: end; gap: 4rem; } }
.section-head p { color: var(--muted); font-size: 1.125rem; }

/* ---------- Demos ---------- */
.demo { display: grid; gap: 1.75rem; align-items: center; padding-block: clamp(2rem, 4vw, 3rem); border-top: 1px solid var(--rule); }
.demo:last-child { border-bottom: 1px solid var(--rule); }
@media (min-width: 60rem) {
  .demo { grid-template-columns: 1.1fr 1fr; gap: 4rem; }
  .demo:nth-of-type(even) .demo-media { order: 2; }
}
.demo-media { display: block; }
.demo-media img { width: 100%; height: auto; background: transparent; transition: transform .5s cubic-bezier(.2,.7,.2,1); }
.demo-media:hover img { transform: translateY(-4px); }
.demo-kind { font-size: .9375rem; font-weight: 600; color: var(--green-2); }
.demo h3 { font-size: clamp(2rem, 1.5rem + 2vw, 2.9rem); margin: .4rem 0 1rem; line-height: 1.05; }
.demo-body &gt; p:not(.demo-kind) { color: var(--muted); }
.demo-points { margin: 1.25rem 0 1.75rem; padding: 0; list-style: none; display: grid; gap: .55rem; }
.demo-points li { position: relative; padding-left: 1.4rem; }
.demo-points li::before { content: &quot;&quot;; position: absolute; left: 0; top: .62em; width: .55rem; height: .55rem; border-radius: 2px 2px 50% 50%; background: var(--green); }

/* ---------- Included ---------- */
.included { background: #fff; border-block: 1px solid var(--rule); }
.included-grid { display: grid; gap: 2.5rem; }
@media (min-width: 60rem) { .included-grid { grid-template-columns: .8fr 1.2fr; gap: 5rem; } .included h2 { position: sticky; top: 7rem; align-self: start; } }
.included-list { display: grid; gap: 0; }
@media (min-width: 40rem) { .included-list { grid-template-columns: 1fr 1fr; column-gap: 2.5rem; } }
.included-list div { padding: 1.4rem 0; border-top: 1px solid var(--rule); }
.included-list dt { font-family: var(--font-display); font-weight: 600; font-size: 1.1875rem; letter-spacing: -.01em; }
.included-list dd { margin-top: .4rem; color: var(--muted); font-size: 1rem; }

/* ---------- Packages ---------- */
.plans { display: grid; gap: 1rem; }
@media (min-width: 56rem) { .plans { grid-template-columns: repeat(3, 1fr); align-items: stretch; } }
.plan { position: relative; display: flex; flex-direction: column; gap: .75rem; padding: 1.75rem; background: #fff; border: 1px solid var(--rule); border-radius: 12px; }
.plan h3 { font-size: 1.625rem; }
.plan-for { color: var(--muted); font-size: 1rem; min-height: 3.2em; }
.plan-price { font-size: .9375rem; color: var(--muted); }
.plan-price .amount { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; letter-spacing: -.03em; color: var(--fg); margin-right: .25rem; }
.plan-list { list-style: none; padding: 1rem 0 0; margin: 0 0 1.25rem; border-top: 1px solid var(--rule); display: grid; gap: .45rem; }
.plan .btn { margin-top: auto; }
.plan--featured { background: var(--green); color: var(--porcelain); border-color: var(--green); }
.plan--featured .plan-for, .plan--featured .plan-price { color: #C6D8D3; }
.plan--featured .plan-price .amount { color: #fff; }
.plan--featured .plan-list { border-color: rgba(255,255,255,.18); }
.plan--featured .btn { background: var(--mint); color: var(--green); border-color: var(--mint); }
.plan--featured .btn:hover { background: #C5F0DF; border-color: #C5F0DF; }
.plan-flag { align-self: flex-start; font-size: .8125rem; font-weight: 600; background: var(--mint); color: var(--green); padding: .25rem .6rem; border-radius: 4px; }

.compare { margin-top: 3rem; overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; background: #fff; -webkit-overflow-scrolling: touch; }
.compare table { width: 100%; min-width: 40rem; border-collapse: collapse; font-size: .9375rem; }
.compare caption { text-align: left; padding: 1.25rem 1.25rem .75rem; font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; letter-spacing: -.01em; }
.compare th, .compare td { padding: .8rem 1.25rem; text-align: left; vertical-align: top; border-top: 1px solid var(--rule); }
.compare thead th { font-family: var(--font-display); font-size: 1rem; background: #F7F9F8; }
.compare thead th:nth-child(3), .compare tbody td:nth-child(3) { background: #EEF6F3; }
.compare tbody th { font-weight: 500; width: 34%; position: sticky; left: 0; background: #fff; }
.compare .yes::before { content: &quot;&quot;; display: inline-block; width: .55rem; height: .3rem; border: solid var(--success); border-width: 0 0 2px 2px; transform: rotate(-45deg) translateY(-.15rem); margin-right: .5rem; }
.compare .no { color: #5E6A66; }
.compare .row-price th, .compare .row-price td { font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; }
.compare-hint { font-size: .875rem; color: var(--muted); margin-top: .75rem; }
@media (min-width: 46rem) { .compare-hint { display: none; } }

.care { display: grid; gap: 1.5rem; margin-top: 3rem; padding: 1.75rem; border-radius: 12px; background: var(--shade); }
@media (min-width: 56rem) { .care { grid-template-columns: 1fr 1.6fr; align-items: center; } }
.care h3 { font-size: 1.5rem; margin-bottom: .35rem; }
.care .plan-price { color: #5A5240; }
.care-list { margin: 0; padding-left: 1.1rem; display: grid; gap: .35rem; }
@media (min-width: 40rem) { .care-list { grid-template-columns: 1fr 1fr; column-gap: 2.5rem; } }

/* ---------- Process (a real sequence, so numbered) ---------- */
.process { background: var(--green); color: var(--porcelain); }
.steps { counter-reset: step; display: grid; gap: 0; margin-top: 3rem; }
@media (min-width: 60rem) { .steps { grid-template-columns: repeat(5, 1fr); gap: 1.5rem; } }
.steps li { counter-increment: step; position: relative; padding: 1.5rem 0 1.5rem 3.25rem; border-top: 1px solid rgba(244,246,245,.18); }
@media (min-width: 60rem) { .steps li { padding: 4rem 0 0; } }
.steps li::before { content: counter(step); position: absolute; left: 0; top: 1.4rem; font-family: var(--font-display); font-weight: 800; font-size: 1.75rem; line-height: 1; color: var(--mint); }
.steps h3 { font-size: 1.1875rem; margin-bottom: .5rem; }
.steps p { color: #C6D8D3; font-size: .9875rem; }

/* ---------- Terms ---------- */
.terms-grid { display: grid; gap: 2.5rem; }
@media (min-width: 60rem) { .terms-grid { grid-template-columns: .8fr 1.2fr; gap: 5rem; } }
.terms-grid &gt; div &gt; p { margin-top: 1rem; color: var(--muted); font-size: 1.125rem; }
.terms-list details { border-top: 1px solid var(--rule); }
.terms-list details:last-child { border-bottom: 1px solid var(--rule); }
.terms-list summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; gap: 1rem; align-items: center; padding: 1.25rem 0; font-family: var(--font-display); font-weight: 600; font-size: 1.1875rem; letter-spacing: -.01em; }
.terms-list summary::-webkit-details-marker { display: none; }
.terms-list summary::after { content: &quot;&quot;; flex: none; width: .65rem; height: .65rem; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg) translateY(-.2rem); transition: transform .2s ease; }
.terms-list details[open] summary::after { transform: rotate(-135deg) translateY(-.1rem); }
.terms-list details p { padding: 0 0 1.4rem; color: var(--muted); }

/* ---------- Enquire ---------- */
.enquire { background: #fff; border-top: 1px solid var(--rule); }
.enquire-grid { display: grid; gap: 2.5rem; }
@media (min-width: 60rem) { .enquire-grid { grid-template-columns: .85fr 1.15fr; gap: 5rem; } }
.enquire-copy p { margin-top: 1rem; color: var(--muted); font-size: 1.0625rem; }
.enquire-copy .who { padding-top: 1rem; border-top: 1px solid var(--rule); margin-top: 1.5rem; }
.enquire-copy a { color: var(--green); font-weight: 600; }
.enquire-copy .btn-wa { color: #fff; }
.enquiry-form { display: grid; gap: 1.25rem; padding: clamp(1.25rem, 3vw, 2rem); background: var(--porcelain); border: 1px solid var(--rule); border-radius: 12px; }
.form-row { display: grid; gap: 1.25rem; }
@media (min-width: 40rem) { .form-row { grid-template-columns: 1fr 1fr; } }
.optional { font-weight: 400; color: var(--muted); }
.form-note { font-size: .875rem; color: var(--muted); }
.enquiry-form a { color: var(--green); font-weight: 600; }

/* ---------- Footer ---------- */
.site-footer { background: var(--graphite); color: #C9D2CF; padding: 3rem 0; font-size: .9375rem; }
.footer-grid { display: grid; gap: 1.25rem; }
@media (min-width: 52rem) { .footer-grid { grid-template-columns: 1fr auto; } .footer-grid .fine { grid-column: 1 / -1; } }
.site-footer strong { color: #fff; }
.site-footer nav { display: flex; flex-wrap: wrap; gap: 1.5rem; }
.site-footer a { color: #fff; }
.fine { font-size: .8125rem; color: #9AA6A2; max-width: none; padding-top: 1.25rem; border-top: 1px solid rgba(255,255,255,.1); }

/* ---------- Privacy / simple pages ---------- */
.doc { padding: clamp(3rem, 7vw, 5rem) 0 5rem; }
.doc .wrap { --max: 46rem; }
.doc h1 { font-size: clamp(2.2rem, 1.6rem + 2.5vw, 3.2rem); margin-bottom: 1rem; }
.doc h2 { font-size: 1.5rem; margin: 2.5rem 0 .75rem; }
.doc p, .doc li { color: #2F3A37; }
.doc p + p { margin-top: 1rem; }
.doc ul { padding-left: 1.2rem; display: grid; gap: .4rem; }
.doc .updated { color: var(--muted); font-size: .9375rem; }
.doc a { color: var(--green); font-weight: 600; }

          &lt;p class=&quot;demo-kind&quot;&gt;Demo concept: family dentistry&lt;/p&gt;
          &lt;h3 class=&quot;banyan-type&quot;&gt;Little Banyan Family Dental&lt;/h3&gt;
          &lt;p&gt;For a neighbourhood practice that treats grandparents, parents and a child&#x27;s first visit, where timings and parking matter as much as treatments.&lt;/p&gt;
          &lt;ul class=&quot;demo-points&quot;&gt;
            &lt;li&gt;Warm colours and rounded shapes that feel calm for nervous children&lt;/li&gt;
            &lt;li&gt;Clinic timings, “first visit” steps and FAQs answered before anyone has to call&lt;/li&gt;
            &lt;li&gt;Booking form asks who the appointment is for, not for medical details&lt;/li&gt;
          &lt;/ul&gt;

  &lt;!-- ===== Process ===== --&gt;
  &lt;section id=&quot;process&quot; class=&quot;section process&quot; aria-labelledby=&quot;process-title&quot;&gt;
    &lt;div class=&quot;wrap&quot;&gt;
      &lt;h2 id=&quot;process-title&quot;&gt;How a project runs&lt;/h2&gt;
      &lt;ol class=&quot;steps&quot; role=&quot;list&quot;&gt;
        &lt;li&gt;&lt;h3&gt;A 20-minute call&lt;/h3&gt;&lt;p&gt;At your clinic or by phone. We agree the package, the pages and what makes your clinic different. You get a written quote the same day.&lt;/p&gt;&lt;/li&gt;
        &lt;li&gt;&lt;h3&gt;Your content checklist&lt;/h3&gt;&lt;p&gt;A short list: logo, doctor details, timings, treatments and photos. If you don&#x27;t have photos, I&#x27;ll suggest a photographer or licensed stock images.&lt;/p&gt;&lt;/li&gt;
        &lt;li&gt;&lt;h3&gt;First draft&lt;/h3&gt;&lt;p&gt;A private preview link you can open on your phone. You and your team comment on it directly.&lt;/p&gt;&lt;/li&gt;
        &lt;li&gt;&lt;h3&gt;Revisions&lt;/h3&gt;&lt;p&gt;Each round covers all your changes at once. Fixes to my own mistakes never count as a round.&lt;/p&gt;&lt;/li&gt;
        &lt;li&gt;&lt;h3&gt;Launch and handover&lt;/h3&gt;&lt;p&gt;The site goes live on your domain. You receive the logins, the code, the PageSpeed report and a short guide to editing timings yourself.&lt;/p&gt;&lt;/li&gt;
      &lt;/ol&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ===== Terms ===== --&gt;
  &lt;section id=&quot;terms&quot; class=&quot;section terms&quot; aria-labelledby=&quot;terms-title&quot;&gt;
    &lt;div class=&quot;wrap terms-grid&quot;&gt;
      &lt;div&gt;
        &lt;h2 id=&quot;terms-title&quot;&gt;Ownership, revisions and maintenance&lt;/h2&gt;
        &lt;p&gt;The details clinics usually find out too late, written down before you pay anything.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;terms-list&quot;&gt;
        &lt;details open&gt;
          &lt;summary&gt;Who owns the website?&lt;/summary&gt;
          &lt;p&gt;You do. The domain is registered in your clinic&#x27;s name, and hosting is billed to you directly. After the final payment you receive the full code, images and logins. There&#x27;s no lock-in: you can move to another developer at any time.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details&gt;
          &lt;summary&gt;What counts as a revision round?&lt;/summary&gt;
          &lt;p&gt;One consolidated list of changes to text, images, colours or layout within the agreed pages. Extra rounds are ₹1,000 each. New pages beyond the package are ₹1,000 per page.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details&gt;
          &lt;summary&gt;What happens after launch?&lt;/summary&gt;
          &lt;p&gt;Every package includes free fixes for anything that isn&#x27;t working as agreed, for 30, 60 or 90 days. After that, the optional care plan covers updates and small changes, or you can make changes yourself.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details&gt;
          &lt;summary&gt;When is the delivery clock started?&lt;/summary&gt;
          &lt;p&gt;Delivery times start once I have the deposit and your content checklist. If content arrives late, the date moves by the same number of days, and I&#x27;ll tell you the new date in writing.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details&gt;
          &lt;summary&gt;How are payments made?&lt;/summary&gt;
          &lt;p&gt;50% when we start and 50% after you approve the final draft, before it goes live, by UPI or bank transfer. You get an invoice for both.&lt;/p&gt;
        &lt;/details&gt;
        &lt;details&gt;
          &lt;summary&gt;What won&#x27;t you do?&lt;/summary&gt;
          &lt;p&gt;I won&#x27;t write fake reviews, promise a first-page Google ranking or guarantee a number of new patients. I also won&#x27;t publish before-and-after photos without the patient&#x27;s written consent.&lt;/p&gt;
        &lt;/details&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

            &lt;label for=&quot;f-consent&quot;&gt;I agree to be contacted about this enquiry by phone, WhatsApp or email. My details are used only to reply, as described in the &lt;a href=&quot;privacy.html&quot;&gt;privacy notice&lt;/a&gt;.&lt;/label&gt;
          &lt;/div&gt;

&lt;script&gt;/*
 * Site configuration — the only file you need to edit to go live.
 *
 * FORM_ENDPOINT
 *   A form backend that accepts a JSON POST and returns 2xx on success.
 *   Works with Formspree (https://formspree.io/f/xxxxxxx) or
 *   Web3Forms (https://api.web3forms.com/submit — also set WEB3FORMS_KEY).
 *   Leave empty and the studio form falls back to opening an email draft
 *   to CONTACT_EMAIL. If both are empty the form shows a clear
 *   &quot;not connected&quot; error instead of pretending to send.
 *
 * WHATSAPP_NUMBER
 *   International format, digits only, no &quot;+&quot; or spaces. e.g. &quot;919812345678&quot;.
 *   Leave empty and every WhatsApp button stays hidden.
 */
window.SITE_CONFIG = {
  FORM_ENDPOINT: &quot;&quot;,
  WEB3FORMS_KEY: &quot;&quot;,
  CONTACT_EMAIL: &quot;&quot;,
  WHATSAPP_NUMBER: &quot;&quot;,
  WHATSAPP_MESSAGE: &quot;Hi Farhan, I saw your dental website demos and would like to discuss a website for my clinic.&quot;
};
&lt;/script&gt;
&lt;script&gt;/* Shared behaviour: navigation, enquiry forms, WhatsApp links. No dependencies. */
(function () {
  &quot;use strict&quot;;
  var cfg = window.SITE_CONFIG || {};

  /* ---------- Mobile navigation ---------- */
  document.querySelectorAll(&quot;[data-nav-toggle]&quot;).forEach(function (btn) {
    var menu = document.getElementById(btn.getAttribute(&quot;aria-controls&quot;));
    if (!menu) return;
    function close() {
      btn.setAttribute(&quot;aria-expanded&quot;, &quot;false&quot;);
      menu.classList.remove(&quot;is-open&quot;);
    }
    btn.addEventListener(&quot;click&quot;, function () {
      var open = btn.getAttribute(&quot;aria-expanded&quot;) === &quot;true&quot;;
      btn.setAttribute(&quot;aria-expanded&quot;, String(!open));
      menu.classList.toggle(&quot;is-open&quot;, !open);
    });
    menu.querySelectorAll(&quot;a&quot;).forEach(function (a) { a.addEventListener(&quot;click&quot;, close); });
    document.addEventListener(&quot;keydown&quot;, function (e) {
      if (e.key === &quot;Escape&quot; &amp;&amp; btn.getAttribute(&quot;aria-expanded&quot;) === &quot;true&quot;) { close(); btn.focus(); }
    });
  });

  /* ---------- WhatsApp: only shown when a number is configured ---------- */
  var wa = String(cfg.WHATSAPP_NUMBER || &quot;&quot;).replace(/\D/g, &quot;&quot;);
  if (wa.length &gt;= 10) {
    var href = &quot;https://wa.me/&quot; + wa + &quot;?text=&quot; + encodeURIComponent(cfg.WHATSAPP_MESSAGE || &quot;&quot;);
    document.querySelectorAll(&quot;[data-whatsapp]&quot;).forEach(function (el) {
      el.setAttribute(&quot;href&quot;, href);
      el.setAttribute(&quot;target&quot;, &quot;_blank&quot;);
      el.setAttribute(&quot;rel&quot;, &quot;noopener&quot;);
      el.hidden = false;
    });
  }

  /* ---------- Footer year ---------- */
  document.querySelectorAll(&quot;[data-year]&quot;).forEach(function (el) { el.textContent = new Date().getFullYear(); });

  /* ---------- Forms ---------- */
  var MESSAGES = {
    name: &quot;Enter your name.&quot;,
    clinic: &quot;Enter your clinic&#x27;s name.&quot;,
    phone: &quot;Enter a 10-digit Indian mobile number, e.g. 98123 45678.&quot;,
    email: &quot;Enter an email address like name@clinic.com.&quot;,
    consent: &quot;Tick the box so we&#x27;re allowed to contact you.&quot;,
    select: &quot;Choose an option.&quot;,
    generic: &quot;Fill in this field.&quot;
  };

  function normalisePhone(v) {
    var d = v.replace(/\D/g, &quot;&quot;);
    if (d.length === 12 &amp;&amp; d.indexOf(&quot;91&quot;) === 0) d = d.slice(2);
    if (d.length === 11 &amp;&amp; d.charAt(0) === &quot;0&quot;) d = d.slice(1);
    return d;
  }

  function validateField(field) {
    var v = field.type === &quot;checkbox&quot; ? field.checked : field.value.trim();
    var key = field.dataset.msg || field.name;
    var msg = &quot;&quot;;
    if (field.required &amp;&amp; (field.type === &quot;checkbox&quot; ? !v : v === &quot;&quot;)) {
      msg = MESSAGES[key] || (field.tagName === &quot;SELECT&quot; ? MESSAGES.select : MESSAGES.generic);
    } else if (v &amp;&amp; field.type === &quot;tel&quot; &amp;&amp; !/^[6-9]\d{9}$/.test(normalisePhone(field.value))) {
      msg = MESSAGES.phone;
    } else if (v &amp;&amp; field.type === &quot;email&quot; &amp;&amp; !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(field.value.trim())) {
      msg = MESSAGES.email;
    }
    var err = document.getElementById(field.id + &quot;-error&quot;);
    if (err) err.textContent = msg;
    field.setAttribute(&quot;aria-invalid&quot;, msg ? &quot;true&quot; : &quot;false&quot;);
    var wrap = field.closest(&quot;.field&quot;);
    if (wrap) wrap.classList.toggle(&quot;has-error&quot;, !!msg);
    return !msg;
  }

  function setStatus(form, type, html) {
    var box = form.querySelector(&quot;[data-form-status]&quot;);
    if (!box) return;
    box.className = &quot;form-status is-&quot; + type;
    box.innerHTML = html;
    box.hidden = false;
    box.setAttribute(&quot;tabindex&quot;, &quot;-1&quot;);
    box.focus({ preventScroll: false });
  }

  function collect(form) {
    var data = {};
    new FormData(form).forEach(function (val, key) { data[key] = typeof val === &quot;string&quot; ? val.trim() : val; });
    if (data.phone) data.phone = &quot;+91 &quot; + normalisePhone(data.phone);
    delete data.company_website; // honeypot
    return data;
  }

  function mailtoFallback(data) {
    var lines = Object.keys(data).filter(function (k) { return k !== &quot;consent&quot;; })
      .map(function (k) { return k.replace(/_/g, &quot; &quot;) + &quot;: &quot; + data[k]; });
    return &quot;mailto:&quot; + cfg.CONTACT_EMAIL +
      &quot;?subject=&quot; + encodeURIComponent(&quot;Website enquiry — &quot; + (data.clinic || data.name || &quot;dental clinic&quot;)) +
      &quot;&amp;body=&quot; + encodeURIComponent(lines.join(&quot;\n&quot;));
  }

  document.querySelectorAll(&quot;form[data-enquiry]&quot;).forEach(function (form) {
    var mode = form.getAttribute(&quot;data-enquiry&quot;); // &quot;studio&quot; | &quot;demo&quot;
    var fields = Array.prototype.slice.call(form.querySelectorAll(&quot;input:not([type=hidden]):not([name=company_website]), select, textarea&quot;));
    var submit = form.querySelector(&quot;[type=submit]&quot;);
    var label = submit ? submit.textContent : &quot;&quot;;

    fields.forEach(function (f) {
      f.addEventListener(&quot;blur&quot;, function () { if (f.value || f.type === &quot;checkbox&quot;) validateField(f); });
      f.addEventListener(&quot;input&quot;, function () { if (f.getAttribute(&quot;aria-invalid&quot;) === &quot;true&quot;) validateField(f); });
      f.addEventListener(&quot;change&quot;, function () { if (f.getAttribute(&quot;aria-invalid&quot;) === &quot;true&quot;) validateField(f); });
    });

    form.addEventListener(&quot;submit&quot;, function (e) {
      e.preventDefault();
      var firstBad = null;
      fields.forEach(function (f) { if (!validateField(f) &amp;&amp; !firstBad) firstBad = f; });
      if (firstBad) {
        var n = fields.filter(function (f) { return f.getAttribute(&quot;aria-invalid&quot;) === &quot;true&quot;; }).length;
        setStatus(form, &quot;error&quot;, &quot;&lt;strong&gt;&quot; + n + (n === 1 ? &quot; field needs&quot; : &quot; fields need&quot;) + &quot; attention.&lt;/strong&gt; Check the highlighted fields and try again.&quot;);
        firstBad.focus();
        return;
      }
      var hp = form.querySelector(&quot;[name=company_website]&quot;);
      if (hp &amp;&amp; hp.value) { form.reset(); return; } // silently drop bots

      var data = collect(form);

      if (mode === &quot;demo&quot;) {
        submit.disabled = true; submit.textContent = &quot;Checking…&quot;;
        setTimeout(function () {
          submit.disabled = false; submit.textContent = label;
          form.reset();
          fields.forEach(function (f) { f.removeAttribute(&quot;aria-invalid&quot;); });
          setStatus(form, &quot;success&quot;, &quot;&lt;strong&gt;Request received — in a live site.&lt;/strong&gt; This is a demo concept, so nothing was sent and nothing was stored. On a real clinic site this goes straight to the front desk.&quot;);
        }, 600);
        return;
      }

      if (cfg.FORM_ENDPOINT) {
        submit.disabled = true; submit.textContent = &quot;Sending…&quot;;
        var payload = Object.assign({}, data, { _subject: &quot;Website enquiry — &quot; + (data.clinic || data.name) });
        if (cfg.WEB3FORMS_KEY) payload.access_key = cfg.WEB3FORMS_KEY;
        fetch(cfg.FORM_ENDPOINT, {
          method: &quot;POST&quot;,
          headers: { &quot;Content-Type&quot;: &quot;application/json&quot;, &quot;Accept&quot;: &quot;application/json&quot; },
          body: JSON.stringify(payload)
        }).then(function (res) {
          if (!res.ok) throw new Error(&quot;HTTP &quot; + res.status);
          form.reset();
          fields.forEach(function (f) { f.removeAttribute(&quot;aria-invalid&quot;); });
          setStatus(form, &quot;success&quot;, &quot;&lt;strong&gt;Enquiry sent.&lt;/strong&gt; I&#x27;ll reply within one working day on the number or email you gave.&quot;);
        }).catch(function () {
          setStatus(form, &quot;error&quot;, &quot;&lt;strong&gt;Your enquiry didn&#x27;t send.&lt;/strong&gt; Check your connection and press “Send enquiry” again.&quot; +
            (cfg.CONTACT_EMAIL ? &quot; Or email &lt;a href=\&quot;mailto:&quot; + cfg.CONTACT_EMAIL + &quot;\&quot;&gt;&quot; + cfg.CONTACT_EMAIL + &quot;&lt;/a&gt;.&quot; : &quot;&quot;));
        }).finally(function () {
          submit.disabled = false; submit.textContent = label;
        });
        return;
      }

      if (cfg.CONTACT_EMAIL) {
        window.location.href = mailtoFallback(data);
        setStatus(form, &quot;success&quot;, &quot;&lt;strong&gt;Your email app should now be open with the enquiry filled in.&lt;/strong&gt; Press send there to finish. If nothing opened, email &lt;a href=\&quot;mailto:&quot; + cfg.CONTACT_EMAIL + &quot;\&quot;&gt;&quot; + cfg.CONTACT_EMAIL + &quot;&lt;/a&gt;.&quot;);
        return;
      }

      setStatus(form, &quot;error&quot;, &quot;&lt;strong&gt;This form isn&#x27;t connected yet.&lt;/strong&gt; The site owner needs to add a form endpoint or email address in &lt;code&gt;assets/js/config.js&lt;/code&gt;. Nothing was sent.&quot;);
    });
  });
})();
&lt;/script&gt;
&lt;script&gt;
  /* Pre-select the package when a plan button is used */
  document.querySelectorAll(&quot;[data-plan]&quot;).forEach(function (a) {
    a.addEventListener(&quot;click&quot;, function () {
      var sel = document.getElementById(&quot;f-plan&quot;);
      if (sel) sel.value = a.getAttribute(&quot;data-plan&quot;);
    });
  });
&lt;/script&gt;

(function(){
  var PAGES={"home": "<!doctype html>\n<html lang=\"en-IN\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Dental Clinic Websites in Mumbai | Farhan Khan<\/title>\n  <meta name=\"description\" content=\"Fast, mobile-first websites for Mumbai dental clinics. Fixed prices from \u20b97,999, first draft in 7 working days, and the domain and code stay in your name.\">\n  <meta name=\"theme-color\" content=\"#0F3D37\">\n  <meta property=\"og:type\" content=\"website\">\n  <meta property=\"og:title\" content=\"Dental clinic websites in Mumbai | Farhan Khan\">\n  <meta property=\"og:description\" content=\"Fixed-price websites for dental clinics. Three demo concepts, clear packages, and you own everything.\">\n    <meta name=\"twitter:card\" content=\"summary_large_image\">\n  <link rel=\"icon\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iIzBGM0QzNyIvPjxwYXRoIGQ9Ik04IDZoMTZ2MTJhOCA4IDAgMCAxLTE2IDB6IiBmaWxsPSIjQThFNkNGIi8+PC9zdmc+Cg==\" type=\"image/svg+xml\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"preconnect\" href=\"https://images.unsplash.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;1,400&display=swap\">\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&amp;family=Young+Serif&amp;family=Archivo:wdth,wght@112,700&amp;display=swap&amp;text=Maison%20IvoireLittle%20BanyanFamily%20DentalAxial%20Implant%20Centre\">\n  <style>/* Shared foundation for the studio site and every demo concept.\n   Each page sets its own tokens on :root; this file only ex-wrap: wrap; gap: .25rem 1rem; align-items: center; justify-content: space-between; padding-block: .55rem; }\n.demo-bar strong { color: #ffd88a; font-weight: 600; }\n.demo-bar a { color: #f1f4f3; font-weight: 600; }\n.demo-bar nav { display: flex; gap: 1rem; flex-wrap: wrap; }\n.demo-bar nav a[aria-current=\"page\"] { text-decoration: none; opacity: .6; }\n\n/* ---------- Forms ---------- */\n.field { display: grid; gap: .4rem; align-content: start; }\n.field label, .field legend { font-weight: 600; font-size: .9375rem; }\n.field .hint { font-size: .8125rem; color: var(--muted); margin-top: -.2rem; }\n.field input, .field select, .field textarea {\n  width: 100%; min-height: 3rem; padding: .75rem .9rem;\n  background: var(--field-bg, #fff); color: var(--field-fg, inherit);\n  border: 1px solid var(--field-border, #9aa5a1); border-radius: var(--field-radius, 6px);\n  transition: border-color .15s ease, box-shadow .15s ease;\n}\n.field textarea { min-height: 7rem; resize: vertical; }\n.field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 1.15rem) 1.3rem, calc(100% - .8rem) 1.3rem; background-size: .35rem .35rem; background-repeat: no-repeat; padding-right: 2.25rem; }\n.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--field-border-hover, currentColor); }\n.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {\n  outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent);\n}\n.field.has-error input, .field.has-error select, .field.has-error textarea { border-color: var(--error, #b42318); }\n.field-error { color: var(--error, #b42318); font-size: .875rem; font-weight: 600; min-height: 0; }\n.field-error:empty { display: none; }\n.check { display: grid; grid-template-columns: auto 1fr; gap: .7rem; al -width: 14ch; }\n.lede { margin-top: 1.5rem; font-size: clamp(1.0625rem, 1rem + .3vw, 1.25rem); color: #D4E2DE; max-width: 52ch; }\n.hero-actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }\n.hero .btn { background: var(--mint); color: var(--green); border-color: var(--mint); }\n.hero .btn:hover { background: #C5F0DF; border-color: #C5F0DF; }\n.hero .btn-ghost { background: transparent; color: var(--porcelain); border-color: rgba(244,246,245,.5); }\n.hero .btn-ghost:hover { background: rgba(244,246,245,.1); border-color: var(--porcelain); }\n.hero-facts { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 1rem 2.5rem; margin-top: 2.75rem; padding-top: 1.5rem; border-top: 1px solid rgba(244,246,245,.18); }\n.hero-facts dt { font-size: .8125rem; color: #A9C0BA; }\n.hero-facts dd { font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; letter-spacing: -.01em; }\n@media (max-width: 30rem) { .hero-facts { grid-template-columns: 1fr 1fr; } }\n\n/* The memorable element: demos presented as a dental shade guide */\n.shade-guide { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(.6rem, 1.5vw, 1rem); align-items: start; padding-bottom: 2rem; }\n.shade { position: relative; display: block; text-decoration: none; color: var(--graphite); border-radius: 10px 10px 999px 999px / 10px 10px 34% 34%; overflow: hidden; background: var(--shade); box-shadow: 0 1px 0 rgba(255,255,255,.25) inset, 0 18px 40px -18px rgba(0,0,0,.55); transition: transform .35s cubic-bezier(.2,.7,.2,1); }\n.shade:nth-child(2) { margin-top: 2.5rem; }\n.shade:nth-child(3) { margin-top: 5rem; }\n.shade img { width: 100%; aspect-ratio: 42 / 62; object-fit: cover; }\n.shade-label { position: absolute; left: 0; right: 0; bottom: 0; display: grid; gap: .1rem; justify-items: center; text-align: center; padding: 2.6rem .5rem 1.6rem; background: linear-gradient(to top, rgba(10,22,20,.86) 30%, rgba(10,22,20,0)); color: #fff; }\n.shade-name { font-size: clamp(.95rem, .7rem + .9vw, 1.35rem); line-height: 1.1; }\n.shade-kind { font-size: .8125rem; color: #E1ECE8; }\n.shade:hover, .shade:focus-visible { transform: translateY(-.6rem); }\n.shade-note { position: absolute; left: 0; bottom: -.25rem; font-size: .8125rem; color: #A9C0BA; }\n@media (max-width: 30rem) { .shade:nth-child(2) { margin-top: 1.25rem; } .shade:nth-child(3) { margin-top: 2.5rem; } .shade-label { padding: 2rem .25rem 1rem; } }\n\n/* Demo brand faces, loaded as subsets */\n.ivoire-type { font-family: \"Bodoni Moda\", Didot, Georgia, serif; font-style: italic; font-weight: 500; letter-spacing: -.01em; }\n.banyan-type { font-family: \"Young Serif\", Georgia, serif; font-weight: 400; letter-spacing: -.01em; }\n.axial-type  { font-family: \"Archivo\", \"Arial Narrow\", sans-serif; font-weight: 700; font-stretch: 112%; letter-spacing: -.02em; }\n\n/* ---------- Sections ---------- */\n.section { padding: clamp(4rem, 9vw, 7.5rem) 0; }\n.section-head { display: grid; gap: 1rem; margin-bottom: clamp(2.5rem, 5vw, 4rem); }\n@media (min-width: 60rem) { .section-head { grid-template-columns: 1fr 1fr; align-items: end; gap: 4rem; } }\n.section-head p { color: var(--muted); font-size: 1.125rem; }\n\n/* ---------- Demos ---------- */\n.demo { display: grid; gap: 1.75rem; align-items: center; padding-block: clamp(2rem, 4vw, 3rem); border-top: 1px solid var(--rule); }\n.demo:last-child { border-bottom: 1px solid var(--rule); }\n@media (min-width: 60rem) {\n  .demo { grid-template-columns: 1.1fr 1fr; gap: 4rem; }\n  .demo:nth-of-type(even) .demo-media { order: 2; }\n}\n.demo-media { display: block; }\n.demo-media img { width: 100%; height: auto; background: transparent; transition: transform .5s cubic-bezier(.2,.7,.2,1); }\n.demo-media:hover img { transform: translateY(-4px); }\n.demo-kind { font-size: .9375rem; font-weight: 600; color: var(--green-2); }\n.demo h3 { font-size: clamp(2rem, 1.5rem + 2vw, 2.9rem); margin: .4rem 0 1r -top: auto; }\n.plan--featured { background: var(--green); color: var(--porcelain); border-color: var(--green); }\n.plan--featured .plan-for, .plan--featured .plan-price { color: #C6D8D3; }\n.plan--featured .plan-price .amount { color: #fff; }\n.plan--featured .plan-list { border-color: rgba(255,255,255,.18); }\n.plan--featured .btn { background: var(--mint); color: var(--green); border-color: var(--mint); }\n.plan--featured .btn:hover { background: #C5F0DF; border-color: #C5F0DF; }\n.plan-flag { align-self: flex-start; font-size: .8125rem; font-weight: 600; background: var(--mint); color: var(--green); padding: .25rem .6rem; border-radius: 4px; }\n\n.compare { margin-top: 3rem; overflow-x: auto; border: 1px solid var(--rule); border-radius: 12px; background: #fff; -webkit-overflow-scrolling: touch; }\n.compare table { width: 100%; min-width: 40rem; border-collapse: collapse; font-size: .9375rem; }\n.compare caption { text-align: left; padding: 1.25rem 1.25rem .75rem; font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; letter-spacing: -.01em; }\n.compare th, .compare td { padding: .8rem 1.25rem; text-align: left; vertical-align: top; border-top: 1px solid var(--rule); }\n.compare thead th { font-family: var(--font-display); font-size: 1rem; background: #F7F9F8; }\n.compare thead th:nth-child(3), .compare tbody td:nth-child(3) { background: #EEF6F3; }\n.compare tbody th { font-weight: 500; width: 34%; position: sticky; left: 0; background: #fff; }\n.compare .yes::before { content: \"\"; display: inline-block; width: .55rem; height: .3rem; border: solid var(--success); border-width: 0 0 2px 2px; transform: rotate(-45deg) translateY(-.15rem); margin-right: .5rem; }\n.compare .no { color: #5E6A66; }\n.compare .row-price th, .compare .row-price td { font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; }\n.compare-hint { font-size: .875rem; color: var(--muted); margin-top: .75rem; }\n@media (min-width: 46rem) { .compare-hint { displ g=\"async\">\n        <\/a>\n        <div class=\"demo-body\">\n          <p class=\"demo-kind\">Demo concept: implant and advanced dentistry<\/p>\n          <h3 class=\"axial-type\">Axial Implant Centre<\/h3>\n          <p>For a referral-driven implant practice where patients research for weeks and want to understand the procedure and the cost before they visit.<\/p>\n          <ul class=\"demo-points\">\n            <li>Clean clinical grid with a step-by-step implant timeline<\/li>\n            <li>An honest \u201cwhat affects the cost\u201d section instead of a fake price list<\/li>\n            <li>Equipment and process explained in plain language for patients and referring dentists<\/li>\n          <\/ul>\n          <a class=\"btn\" href=\"demos/axial-implant-centre.html\">Open the Axial demo<\/a>\n        <\/div>\n      <\/article>\n    <\/div>\n  <\/section>\n\n  <!-- ===== Included ===== -->\n  <section class=\"section included\" aria-labelledby=\"included-title\">\n    <div class=\"wrap included-grid\">\n      <h2 id=\"included-title\">Built for how patients actually use a clinic website<\/h2>\n      <dl class=\"included-list\">\n        <div><dt>One tap to call or get directions<\/dt><dd>Most visitors are on a phone looking for your number, your timings or the way to your clinic. Those are always one tap away.<\/dd><\/div>\n        <div><dt>A page for each treatment<\/dt><dd>Separate pages for implants, aligners, root canals and the rest, written in plain language, so you can be found for what you actually do.<\/dd><\/div>\n        <div><dt>Your real Google reviews<\/dt><dd>A link to, or a live embed of, your Google Business Profile reviews. Never invented testimonials.<\/dd><\/div>\n        <div><dt>Enquiries without medical data<\/dt><dd>Forms ask for name, number and a convenient time, nothing about a patient's health, and include consent wording for India's data protection law.<\/dd><\/div>\n        <div><dt>Fast on mobile data<\/dt><dd>Compressed images, no heavy page builders. You receive the Google PageSpeed report at handover so you can check it yourself.<\/dd><\/div>\n        <div><dt>Search basics done properly<\/dt><dd>Page titles, descriptions, clinic schema markup and a sitemap, linked to your Google Business Profile.<\/dd><\/div>\n      <\/dl>\n    <\/div>\n  <\/section>\n\n  <!-- ===== Packages ===== -->\n  <section id=\"packages\" class=\"section packages\" aria-labelledby=\"packages-title\">\n    <div class=\"wrap\">\n      <div class=\"section-head\">\n        <h2 id=\"packages-title\">Packages and prices<\/h2>\n        <p>One-time fixed prices in Indian rupees. 50% to start, 50% before the site goes live. GST is added only if applicable. Domain and hosting are paid directly to the provider, in your clinic's name.<\/p>\n      <\/div>\n\n      <div class=\"plans\">\n        <article class=\"plan\">\n          <h3>Essential<\/h3>\n          <p class=\"plan-for\">A single clinic that needs a professional site quickly.<\/p>\n          <p class=\"plan-price\"><span class=\"amount\">\u20b97,999<\/span> one-time<\/p>\n          <ul class=\"plan-list\">\n            <li>Up to 5 pages<\/li>\n            <li>Ready in 7 working days<\/li>\n            <li>2 revision rounds<\/li>\n          <\/ul>\n          <a class=\"btn btn-ghost\" href=\"#enquire\" data-plan=\"Essential\">Ask about Essential<\/a>\n        <\/article>\n        <article class=\"plan plan--featured\" aria-describedby=\"featured-note\">\n          <p id=\"featured-note\" class=\"plan-flag\">Best fit for an established clinic<\/p>\n          <h3>Signature<\/h3>\n          <p class=\"plan-for\">A busy practice with several treatments and doctors.<\/p>\n          <p class=\"plan-price\"><span class=\"amount\">\u20b914,999<\/span> one-time<\/p>\n          <ul class=\"plan-list\">\n            <li>Up to 10 pages, 6 treatment pages<\/li>\n            <li>Ready in 14 working days<\/li>\n            <li>3 revision rounds<\/li>\n          <\/ul>\n          <a class=\"btn\" href=\"#enquire\" data-plan=\"Signature\">Ask about Signature<\/a>\n        <\/article>\n        <article class=\"plan\">\n          <h3>Flagship<\/h3>\n          <p class=\"plan-for\">A cosmetic or implant brand, or a clinic with more than one branch.<\/p>\n          <p class=\"plan-price\"><span class=\"amount\">\u20b924,999<\/span> one-time<\/p>\n          <ul class=\"plan-list\">\n            <li>Up to 20 pages, custom art direction<\/li>\n            <li>Ready in 21\u201328 working days<\/li>\n            <li>4 revision rounds<\/li>\n          <\/ul>\n          <a class=\"btn btn-ghost\" href=\"#enquire\" data-plan=\"Flagship\">Ask about Flagship<\/a>\n        <\/article>\n      <\/div>\n\n      <div class=\"compare\" role=\"region\" aria-labelledby=\"compare-caption\" tabindex=\"0\">\n        <table>\n          <caption id=\"compare-caption\">Compare everything in each package<\/caption>\n          <thead>\n            <tr><th scope=\"col\">Included<\/th><th scope=\"col\">Essential<\/th><th scope=\"col\">Signature<\/th><th scope=\"col\">Flagship<\/th><\/tr>\n          <\/thead>\n          <tbody>\n            <tr><th scope=\"row\">Pages<\/th><td>Up to 5<\/td><td>Up to 10<\/td><td>Up to 20<\/td><\/tr>\n            <tr><th scope=\"row\">Treatment pages<\/th><td>1 combined page<\/td><td>Up to 6<\/td><td>Up to 12<\/td><\/tr>\n            <tr><th scope=\"row\">Design<\/th><td>Adapted from a demo concept<\/td><td>Tailored to your brand<\/td><td>Custom art direction<\/td><\/tr>\n            <tr><th scope=\"row\">Mobile-first, one-tap call, Maps, timings<\/th><td><span class=\"yes\">Included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><\/tr>\n            <tr><th scope=\"row\">Enquiry form with consent wording<\/th><td><span class=\"yes\">Included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><\/tr>\n            <tr><th scope=\"row\">WhatsApp chat button<\/th><td><span class=\"yes\">Included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><\/tr>\n            <tr><th scope=\"row\">Search basics: titles, schema, sitemap<\/th><td><span class=\"yes\">Included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><\/tr>\n            <tr><th scope=\"row\">Doctor profiles<\/th><td><span class=\"no\">Not included<\/span><\/td><td>Up to 3<\/td><td>Up to 8<\/td><\/tr>\n            <tr><th scope=\"row\">Google reviews link or live embed<\/th><td>Link<\/td><td>Live embed<\/td><td>Live embed<\/td><\/tr>\n            <tr><th scope=\"row\">Before-and-after gallery with patient consent checklist<\/th><td><span class=\"no\">Not included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><\/tr>\n            <tr><th scope=\"row\">Visitor analytics (privacy-friendly)<\/th><td><span class=\"no\">Not included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><td><span class=\"yes\">Included<\/span><\/td><\/tr>\n            <tr><th scope=\"row\">Second language (Hindi or Marathi)<\/th><td>Add-on \u20b93,999<\/td><td>Add-on \u20b93,999<\/td><td><span class=\"yes\">Included<\/span><\/td><\/tr>\n            <tr><th scope=\"row\">Multiple branches<\/th><td><span class=\"no\">Not included<\/span><\/td><td><span class=\"no\">Not included<\/span><\/td><td>Up to 3<\/td><\/tr>\n            <tr><th scope=\"row\">Copywriting for treatment pages<\/th><td>You supply, I edit<\/td><td>Written for you<\/td><td>Written for you<\/td><\/tr>\n            <tr><th scope=\"row\">Revision rounds<\/th><td>2<\/td><td>3<\/td><td>4<\/td><\/tr>\n            <tr><th scope=\"row\">Delivery<\/th><td>7 working days<\/td><td>14 working days<\/td><td>21\u201328 working days<\/td><\/tr>\n            <tr><th scope=\"row\">Free support after launch<\/th><td>30 days<\/td><td>60 days<\/td><td>90 days<\/td><\/tr>\n            <tr class=\"row-price\"><th scope=\"row\">Price<\/th><td>\u20b97,999<\/td><td>\u20b914,999<\/td><td>\u20b924,999<\/td><\/tr>\n          <\/tbody>\n        <\/table>\n      <\/div>\n      <p class=\"compare-hint\">On a small screen, scroll the table sideways to see all three packages.<\/p>\n\n      <div class=\"care\">\n        <div>\n          <h3>Care plan, optional<\/h3>\n          <p class=\"plan-price\"><span class=\"amount\">\u20b9999<\/span> per month, cancel any time<\/p>\n        <\/div>\n        <ul class=\"care-list\">\n          <li>Hosting set-up and monitoring, with monthly backups<\/li>\n          <li>Up to 1 hour of text, photo or timing changes each month<\/li>\n          <li>Security and software updates<\/li>\n          <li>Reply within one working day<\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ===== Process ===== -->\n  <section id=\"process\" class=\"section process\" aria-labelledby=\"process-title\">\n    <div class=\"wrap\">\n      <h2 id=\"process-title\">How a project runs<\/h2>\n      <ol class=\"steps\" role=\"list\">\n        <li><h3>A 20-minute call<\/h3><p>At your clinic or by phone. We agree the package, the pages and what makes your clinic different. You get a written quote the same day.<\/p><\/li>\n        <li><h3>Your content checklist<\/h3><p>A short list: logo, doctor details, timings, treatments and photos. If you don't have photos, I'll suggest a photographer or licensed stock images.<\/p><\/li>\n        <li><h3>First draft<\/h3><p>A private preview link you can open on your phone. You and your team comment on it directly.<\/p><\/li>\n        <li><h3>Revisions<\/h3><p>Each round covers all your changes at once. Fixes to my own mistakes never count as a round.<\/p><\/li>\n        <li><h3>Launch and handover<\/h3><p>The site goes live on your domain. You receive the logins, the code, the PageSpeed report and a short guide to editing timings yourself.<\/p><\/li>\n      <\/ol>\n    <\/div>\n  <\/section>\n\n  <!-- ===== Terms ===== -->\n  <section id=\"terms\" class=\"section terms\" aria-labelledby=\"terms-title\">\n    <div class=\"wrap terms-grid\">\n      <div>\n        <h2 id=\"terms-title\">Ownership, revisions and maintenance<\/h2>\n        <p>The details clinics usually find out too late, written down before you pay anything.<\/p>\n      <\/div>\n      <div class=\"terms-list\">\n        <details open>\n          <summary>Who owns the website?<\/summary>\n          <p>You do. The domain is registered in your clinic's name, and hosting is billed to you directly. After the final payment you receive the full code, images and logins. There's no lock-in: you can move to another developer at any time.<\/p>\n        <\/details>\n        <details>\n          <summary>What counts as a revision round?<\/summary>\n          <p>One consolidated list of changes to text, images, colours or layout within the agreed pages. Extra rounds are \u20b91,000 each. New pages beyond the package are \u20b91,000 per page.<\/p>\n        <\/details>\n        <details>\n          <summary>What happens after launch?<\/summary>\n          <p>Every package includes free fixes for anything that isn't working as agreed, for 30, 60 or 90 days. After that, the optional care plan covers updates and small changes, or you can make changes yourself.<\/p>\n        <\/details>\n        <details>\n          <summary>When is the delivery clock started?<\/summary>\n          <p>Delivery times start once I have the deposit and your content checklist. If content arrives late, the date moves by the same number of days, and I'll tell you the new date in writing.<\/p>\n        <\/details>\n        <details>\n          <summary>How are payments made?<\/summary>\n          <p>50% when we start and 50% after you approve the final draft, before it goes live, by UPI or bank transfer. You get an invoice for both.<\/p>\n        <\/details>\n        <details>\n          <summary>What won't you do?<\/summary>\n          <p>I won't write fake reviews, promise a first-page Google ranking or guarantee a number of new patients. I also won't publish before-and-after photos without the patient's written consent.<\/p>\n        <\/details>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ===== Enquire ===== -->\n  <section id=\"enquire\" class=\"section enquire\" aria-labelledby=\"enquire-title\">\n    <div class=\"wrap enquire-grid\">\n      <div class=\"enquire-copy\">\n        <h2 id=\"enquire-title\">Get a fixed quote for your clinic<\/h2>\n        <p>Tell me a little about the clinic. I'll reply within one working day with a suggested package and a time for a short call.<\/p>\n        <p class=\"who\">You'll deal with me directly: Farhan Khan, a computer science graduate based in Mumbai. There are no account managers or outsourced handovers.<\/p>\n        <p><a class=\"link-arrowless\" href=\"https://www.linkedin.com/in/farhan-khan-5382a9329\" rel=\"noopener\" target=\"_blank\">Farhan Khan on LinkedIn<span class=\"visually-hidden\"> (opens in a new tab)<\/span><\/a><\/p>\n        <a class=\"btn btn-wa\" href=\"#\" data-whatsapp hidden>Message on WhatsApp<span class=\"visually-hidden\"> (opens WhatsApp)<\/span><\/a>\n      <\/div>\n\n      <form class=\"enquiry-form\" data-enquiry=\"studio\" novalidate aria-describedby=\"form-note\">\n        <div class=\"form-row\">\n          <div class=\"field\">\n            <label for=\"f-name\">Your name<\/label>\n            <input id=\"f-name\" name=\"name\" type=\"text\" autocomplete=\"name\" required aria-describedby=\"f-name-error\">\n            <p id=\"f-name-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"f-clinic\">Clinic name<\/label>\n            <input id=\"f-clinic\" name=\"clinic\" type=\"text\" autocomplete=\"organization\" required aria-describedby=\"f-clinic-error\">\n            <p id=\"f-clinic-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n          <\/div>\n        <\/div>\n        <div class=\"form-row\">\n          <div class=\"field\">\n            <label for=\"f-phone\">Mobile number<\/label>\n            <input id=\"f-phone\" name=\"phone\" type=\"tel\" inputmode=\"tel\" autocomplete=\"tel-national\" required aria-describedby=\"f-phone-hint f-phone-error\" placeholder=\"98123 45678\">\n            <p id=\"f-phone-hint\" class=\"hint\">10 digits. I may reply on WhatsApp.<\/p>\n            <p id=\"f-phone-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"f-email\">Email <span class=\"optional\">(optional)<\/span><\/label>\n            <input id=\"f-email\" name=\"email\" type=\"email\" autocomplete=\"email\" aria-describedby=\"f-email-error\">\n            <p id=\"f-email-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n          <\/div>\n        <\/div>\n        <div class=\"form-row\">\n          <div class=\"field\">\n            <label for=\"f-area\">Clinic area<\/label>\n            <select id=\"f-area\" name=\"area\" required aria-describedby=\"f-area-error\">\n              <option value=\"\">Choose an area<\/option>\n              <option>South Mumbai<\/option>\n              <option>Bandra, Khar or Santacruz<\/option>\n              <option>Juhu, Andheri or Versova<\/option>\n              <option>Powai or Vikhroli<\/option>\n              <option>Chembur or Ghatkopar<\/option>\n              <option>Thane<\/option>\n              <option>Navi Mumbai<\/option>\n              <option>Elsewhere<\/option>\n            <\/select>\n            <p id=\"f-area-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"f-plan\">Package<\/label>\n            <select id=\"f-plan\" name=\"package\">\n              <option>Not sure yet<\/option>\n              <option>Essential<\/option>\n              <option>Signature<\/option>\n              <option>Flagship<\/option>\n            <\/select>\n          <\/div>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"f-site\">Current website<\/label>\n          <select id=\"f-site\" name=\"current_website\">\n            <option>We don't have one<\/option>\n            <option>We have one and want it redone<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field\">\n          <label for=\"f-msg\">Anything else <span class=\"optional\">(optional)<\/span><\/label>\n          <textarea id=\"f-msg\" name=\"message\" rows=\"4\" aria-describedby=\"f-msg-hint\" maxlength=\"1200\"><\/textarea>\n          <p id=\"f-msg-hint\" class=\"hint\">For example, your main treatments or a launch date. Please don't include patient information.<\/p>\n        <\/div>\n        <div class=\"hp\" aria-hidden=\"true\">\n          <label for=\"f-hp\">Leave this empty<\/label>\n          <input id=\"f-hp\" name=\"company_website\" type=\"text\" tabindex=\"-1\" autocomplete=\"off\">\n        <\/div>\n        <div class=\"field\">\n          <div class=\"check\">\n            <input id=\"f-consent\" name=\"consent\" type=\"checkbox\" value=\"yes\" required aria-describedby=\"f-consent-error\">\n            <label for=\"f-consent\">I agree to be contacted about this enquiry by phone, WhatsApp or email. My details are used only to reply, as described in the <a href=\"privacy.html\">privacy notice<\/a>.<\/label>\n          <\/div>\n          <p id=\"f-consent-error\" class=\"field-error\" aria-live=\"polite\"><\/p>\n        <\/div>\n        <p id=\"form-note\" class=\"form-note\">Takes about a minute. Nothing is shared with anyone else.<\/p>\n        <div class=\"form-status\" data-form-status role=\"status\" aria-live=\"polite\" hidden><\/div>\n        <button class=\"btn btn-block\" type=\"submit\">Send enquiry<\/button>\n      <\/form>\n    <\/div>\n  <\/section>\n<\/main>\n\n<footer class=\"site-footer\">\n  <div class=\"wrap footer-grid\">\n    <p><strong>Farhan Khan<\/strong>, dental clinic websites, Mumbai.<\/p>\n    <nav aria-label=\"Footer\">\n      <a href=\"#demos\">Demos<\/a>\n      <a href=\"#packages\">Packages<\/a>\n      <a href=\"privacy.html\">Privacy notice<\/a>\n    <\/nav>\n    <p class=\"fine\">Maison Ivoire, Little Banyan Family Dental and Axial Implant Centre are fictional demo clinics. Photographs from <a href=\"https://unsplash.com/license\" rel=\"noopener\" target=\"_blank\">Unsplash<span class=\"visually-hidden\"> (opens in a new tab)<\/span><\/a>, used under the Unsplash License. \u00a9 <span data-year>2026<\/span> Farhan Khan.<\/p>\n  <\/div>\n<\/footer>\n\n<script>/*\n * Site configuration \u2014 the only file you need to edit to go live.\n *\n * FORM_ENDPOINT\n *   A form backend that accepts a JSON POST and returns 2xx on success.\n *   Works with Formspree (https://formspree.io/f/xxxxxxx) or\n *   Web3Forms (https://api.web3forms.com/submit \u2014 also set WEB3FORMS_KEY).\n *   Leave empty and the studio form falls back to opening an email draft\n *   to CONTACT_EMAIL. If both are empty the form shows a clear\n *   \"not connected\" error instead of pretending to send.\n *\n * WHATSAPP_NUMBER\n *   International format, digits only, no \"+\" or spaces. e.g. \"919812345678\".\n *   Leave empty and every WhatsApp button stays hidden.\n */\nwindow.SITE_CONFIG = {\n  FORM_ENDPOINT: \"\",\n  WEB3FORMS_KEY: \"\",\n  CONTACT_EMAIL: \"\",\n  WHATSAPP_NUMBER: \"\",\n  WHATSAPP_MESSAGE: \"Hi Farhan, I saw your dental website demos and would like to discuss a website for my clinic.\"\n};\n<\/script>\n<script>/* Shared behaviour: navigation, enquiry forms, WhatsApp links. No dependencies. */\n(function () {\n  \"use strict\";\n  var cfg = window.SITE_CONFIG || {};\n\n  /* ---------- Mobile navigation ---------- */\n  document.querySelectorAll(\"[data-nav-toggle]\").forEach(function (btn) {\n    var menu = document.getElementById(btn.getAttribute(\"aria-controls\"));\n    if (!menu) return;\n    function close() {\n      btn.setAttribute(\"aria-expanded\", \"false\");\n      menu.classList.remove(\"is-open\");\n    }\n    btn.addEventListener(\"click\", function () {\n      var open = btn.getAttribute(\"aria-expanded\") === \"true\";\n      btn.setAttribute(\"aria-expanded\", String(!open));\n      menu.classList.toggle(\"is-open\", !open);\n    });\n    menu.querySelectorAll(\"a\").forEach(function (a) { a.addEventListener(\"click\", close); });\n    document.addEventListener(\"keydown\", function (e) {\n      if (e.key === \"Escape\" && btn.getAttribute(\"aria-expanded\") === \"true\") { close(); btn.focus(); }\n    });\n  });\n\n  /* ---------- WhatsApp: only shown when a number is configured ---------- */\n  var wa = String(cfg.WHATSAPP_NUMBER || \"\").replace(/\\D/g, \"\");\n  if (wa.length >= 10) {\n    var href = \"https://wa.me/\" + wa + \"?text=\" + encodeURIComponent(cfg.WHATSAPP_MESSAGE || \"\");\n    document.querySelectorAll(\"[data-whatsapp]\").forEach(function (el) {\n      el.setAttribute(\"href\", href);\n      el.setAttribute(\"target\", \"_blank\");\n      el.setAttribute(\"rel\", \"noopener\");\n      el.hidden = false;\n    });\n  }\n\n  /* ---------- Footer year ---------- */\n  document.querySelectorAll(\"[data-year]\").forEach(function (el) { el.textContent = new Date().getFullYear(); });\n\n  /* ---------- Forms ---------- */\n  var MESSAGES = {\n    name: \"Enter your name.\",\n    clinic: \"Enter your clinic's name.\",\n    phone: \"Enter a 10-digit Indian mobile number, e.g. 98123 45678.\",\n    email: \"Enter an email address like name@clinic.com.\",\n    consent: \"Tick the box so we're allowed to contact you.\",\n    select: \"Choose an option.\",\n    generic: \"Fill in this field.\"\n  };\n\n  function normalisePhone(v) {\n    var d = v.replace(/\\D/g, \"\");\n    if (d.length === 12 && d.indexOf(\"91\") === 0) d = d.slice(2);\n    if (d.length === 11 && d.charAt(0) === \"0\") d = d.slice(1);\n    return d;\n  }\n\n  function validateField(field) {\n    var v = field.type === \"checkbox\" ? field.checked : field.value.trim();\n    var key = field.dataset.msg || field.name;\n    var msg = \"\";\n    if (field.required && (field.type === \"checkbox\" ? !v : v === \"\")) {\n      msg = MESSAGES[key] || (field.tagName === \"SELECT\" ? MESSAGES.select : MESSAGES.generic);\n    } else if (v && field.type === \"tel\" && !/^[6-9]\\d{9}$/.test(normalisePhone(field.value))) {\n      msg = MESSAGES.phone;\n    } else if (v && field.type === \"email\" && !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(field.value.trim())) {\n      msg = MESSAGES.email;\n    }\n    var err = document.getElementById(field.id + \"-error\");\n    if (err) err.textContent = msg;\n    field.setAttribute(\"aria-invalid\", msg ? \"true\" : \"false\");\n    var wrap = field.closest(\".field\");\n    if (wrap) wrap.classList.toggle(\"has-error\", !!msg);\n    return !msg;\n  }\n\n  function setStatus(form, type, html) {\n    var box = form.querySelector(\"[data-form-status]\");\n    if (!box) return;\n    box.className = \"form-status is-\" + type;\n    box.innerHTML = html;\n    box.hidden = false;\n    box.setAttribute(\"tabindex\", \"-1\");\n    box.focus({ preventScroll: false });\n  }\n\n  function collect(form) {\n    var data = {};\n    new FormData(form).forEach(function (val, key) { data[key] = typeof val === \"string\" ? val.trim() : val; });\n    if (data.phone) data.phone = \"+91 \" + normalisePhone(data.phone);\n    delete data.company_website; // honeypot\n    return data;\n  }\n\n  function mailtoFallback(data) {\n    var lines = Object.keys(data).filter(function (k) { return k !== \"consent\"; })\n      .map(function (k) { return k.replace(/_/g, \" \") + \": \" + data[k]; });\n    return \"mailto:\" + cfg.CONTACT_EMAIL +\n      \"?subject=\" + encodeURIComponent(\"Website enquiry \u2014 \" + (data.clinic || data.name || \"dental clinic\")) +\n      \"&body=\" + encodeURIComponent(lines.join(\"\\n\"));\n  }\n\n  document.querySelectorAll(\"form[data-enquiry]\").forEach(function (form) {\n    var mode = form.getAttribute(\"data-enquiry\"); // \"studio\" | \"demo\"\n    var fields = Array.prototype.slice.call(form.querySelectorAll(\"input:not([type=hidden]):not([name=company_website]), select, textarea\"));\n    var submit = form.querySelector(\"[type=submit]\");\n    var label = submit ? submit.textContent : \"\";\n\n    fields.forEach(function (f) {\n      f.addEventListener(\"blur\", function () { if (f.value || f.type === \"checkbox\") validateField(f); });\n      f.addEventListener(\"input\", function () { if (f.getAttribute(\"aria-invalid\") === \"true\") validateField(f); });\n      f.addEventListener(\"change\", function () { if (f.getAttribute(\"aria-invalid\") === \"true\") validateField(f); });\n    });\n\n    form.addEventListener(\"submit\", function (e) {\n      e.preventDefault();\n      var firstBad = null;\n      fields.forEach(function (f) { if (!validateField(f) && !firstBad) firstBad = f; });\n      if (firstBad) {\n        var n = fields.filter(function (f) { return f.getAttribute(\"aria-invalid\") === \"true\"; }).length;\n        setStatus(form, \"error\", \"<strong>\" + n + (n === 1 ? \" field needs\" : \" fields need\") + \" attention.<\/strong> Check the highlighted fields and try again.\");\n        firstBad.focus();\n        return;\n      }\n      var hp = form.querySelector(\"[name=company_website]\");\n      if (hp && hp.value) { form.reset(); return; } // silently drop bots\n\n      var data = collect(form);\n\n      if (mode === \"demo\") {\n        submit.disabled = true; submit.textContent = \"Checking\u2026\";\n        setTimeout(function () {\n          submit.disabled = false; submit.textContent = label;\n          form.reset();\n          fields.forEach(function (f) { f.removeAttribute(\"aria-invalid\"); });\n          setStatus(form, \"success\", \"<strong>Request received \u2014 in a live site.<\/strong> This is a demo concept, so nothing was sent and nothing was stored. On a real clinic site this goes straight to the front desk.\");\n        }, 600);\n        return;\n      }\n\n      if (cfg.FORM_ENDPOINT) {\n        submit.disabled = true; submit.textContent = \"Sending\u2026\";\n        var payload = Object.assign({}, data, { _subject: \"Website enquiry \u2014 \" + (data.clinic || data.name) });\n        if (cfg.WEB3FORMS_KEY) payload.access_key = cfg.WEB3FORMS_KEY;\n        fetch(cfg.FORM_ENDPOINT, {\n          method: \"POST\",\n          headers: { \"Content-Type\": \"application/json\", \"Accept\": \"application/json\" },\n          body: JSON.stringify(payload)\n        }).then(function (res) {\n          if (!res.ok) throw new Error(\"HTTP \" + res.status);\n          form.reset();\n          fields.forEach(function (f) { f.removeAttribute(\"aria-invalid\"); });\n          setStatus(form, \"success\", \"<strong>Enquiry sent.<\/strong> I'll reply within one working day on the number or email you gave.\");\n        }).catch(function () {\n          setStatus(form, \"error\", \"<strong>Your enquiry didn't send.<\/strong> Check your connection and press \u201cSend enquiry\u201d again.\" +\n            (cfg.CONTACT_EMAIL ? \" Or email <a href=\\\"mailto:\" + cfg.CONTACT_EMAIL + \"\\\">\" + cfg.CONTACT_EMAIL + \"<\/a>.\" : \"\"));\n        }).finally(function () {\n          submit.disabled = false; submit.textContent = label;\n        });\n        return;\n      }\n\n      if (cfg.CONTACT_EMAIL) {\n        window.location.href = mailtoFallback(data);\n        setStatus(form, \"success\", \"<strong>Your email app should now be open with the enquiry filled in.<\/strong> Press send there to finish. If nothing opened, email <a href=\\\"mailto:\" + cfg.CONTACT_EMAIL + \"\\\">\" + cfg.CONTACT_EMAIL + \"<\/a>.\");\n        return;\n      }\n\n      setStatus(form, \"error\", \"<strong>This form isn't connected yet.<\/strong> The site owner needs to add a form endpoint or email address in <code>assets/js/config.js<\/code>. Nothing was sent.\");\n    });\n  });\n})();\n<\/script>\n<script>\n  /* Pre-select the package when a plan button is used */\n  document.querySelectorAll(\"[data-plan]\").forEach(function (a) {\n    a.addEventListener(\"click\", function () {\n      var sel = document.getElementById(\"f-plan\");\n      if (sel) sel.value = a.getAttribute(\"data-plan\");\n    });\n  });\n<\/script>\n<\/body>\n<\/html>\n", "ivoire": "<!doctype html>\n<html lang=\"en-IN\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  <title>Maison Ivoire, smile design studio (demo concept)<\/title>\n  <meta name=\"description\" content=\"Demo concept for a luxury cosmetic dentistry website. Maison Ivoire is a fictional clinic.\">\n  <meta name=\"robots\" content=\"noindex, nofollow\">\n  <meta name=\"theme-color\" content=\"#221A20\">\n  <link rel=\"icon\" href=\"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNyIgZmlsbD0iIzBGM0QzNyIvPjxwYXRoIGQ9Ik04IDZoMTZ2MTJhOCA4IDAgMCAxLTE2IDB6IiBmaWxsPSIjQThFNkNGIi8+PC9zdmc+Cg==\" type=\"image/svg+xml\">\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link rel=\"preconnect\" href=\"https://images.unsplash.com\" crossorigin>\n  <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400;1,6..96,500&family=Jost:wght@300;400;500&display=swap\">\n  <style>/* Shared foundation for the studio site and every demo concept.\n   Each page sets its own tokens on :root; this file only consumes them. */\n\n*, *::before, *::after { box-sizing: border-box; }\nhtml { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-behavior: smooth; }\nbody {\n  margin: 0;\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-body);\n  font-size: 1.0625rem;\n  line-height: 1.6;\n  text-rendering: optimizeLegibility;\n  -webkit-font-smoothing: antialiased;\n  overflow-x: clip;\n}\nimg, svg, video { display: block; max-width: 100%; height: auto; }\nimg { background: var(--img-placeholder, rgba(127,127,127,.15)); }\nh1, h2, h3, h4, p, ul, ol, dl, dd, figure, blockquote { margin: 0; }\nul[role=\"list\"], ol[role=\"list\"] { list-style: none; padding: 0; }\na { color: inherit; text-underline-offset: .18em; text-decoration-thickness: 1px; }\nbutton, input, select, textarea { font: inherit; color: inherit; }\nbutton { cursor: pointer; }\n:target { scroll-margin-top: 6rem; }\n[hidden] { display: none !important; }\n\n/* Focus: always visible for keyboard users */\n:focus { outline: none; }\n:focus-visible {\n  outline: 3px solid var(--focus, #1a73e8);\n  outline-offset: 3px;\n  border-radius: 2px;\n}\n\n.visually-hidden {\n  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;\n  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;\n}\n.skip-link {\n  position: absolute; left: 1rem; top: -4rem; z-index: 100;\n  background: var(--fg); color: var(--bg); padding: .75rem 1rem; text-decoration: none; font-weight: 600;\n}\n.skip-link:focus { top: 1rem; }\n\n.wrap { width: min(100% - 2rem, var(--max, 72rem)); margin-inline: auto; }\n@media (min-width: 48rem) { .wrap { width: min(100% - 4rem, var(--max, 72rem)); } }\n\n/* ---------- Demo concept banner (shown on every demo page) ---------- */\n.demo-bar {\n  position: relative; z-index: 60;\n  background: #1b1f1e; color: #f1f4f3;\n  font: 500 .8125rem/1.4 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n}\n.demo-bar .wrap { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: center; justify-content: space-between; padding-block: .55rem; }\n.demo-bar strong { color: #ffd88a; font-weight: 600; }\n.demo-bar a { color: #f1f4f3; font-weight: 600; }\n.demo-bar nav { display: flex; gap: 1rem; flex-wrap: wrap; }\n.demo-bar nav a[aria-current=\"page\"] { text-decoration: none; opacity: .6; }\n\n/* ---------- Forms ---------- */\n.field { display: grid; gap: .4rem; align-content: start; }\n.field label, .field legend { font-weight: 600; font-size: .9375rem; }\n.field .hint { font-size: .8125rem; color: var(--muted); margin-top: -.2rem; }\n.field input, .field select, .field textarea {\n  width: 100%; min-height: 3rem; padding: .75rem .9rem;\n  background: var(--field-bg, #fff); color: var(--field-fg, inherit);\n  border: 1px solid var(--field-border, #9aa5a1); border-radius: var(--field-radius, 6px);\n  transition: border-color .15s ease, box-shadow .15s ease;\n}\n.field textarea { min-height: 7rem; resize: vertical; }\n.field select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 1.15rem) 1.3rem, calc(100% - .8rem) 1.3rem; background-size: .35rem .35rem; background-repeat: no-repeat; padding-right: 2.25rem; }\n.field input:hover, .field select:hover, .field textarea:hover { border-color: var(--field-border-hover, currentColor); }\n.field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible {\n  outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent);\n}\n.field.has-error input, .field.has-error select, .field.has-error textarea { border-color: var(--error, #b42318); }\n.field-error { color: var(--error, #b42318); font-size: .875rem; font-weight: 600; min-height: 0; }\n.field-error:empty { display: none; }\n.check { display: grid; grid-template-columns: auto 1fr; gap: .7rem; align-items: start; font-size: .9375rem; }\n.check input { width: 1.25rem; height: 1.25rem; margin-top: .2rem; accent-color: var(--accent); }\n.check label { font-weight: 400; }\n.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }\n\n.form-status { border-radius: var(--field-radius, 6px); padding: 1rem 1.1rem; font-size: .9375rem; line-height: 1.5; border: 1px solid; }\n.form-status.is-success { background: color-mix(in srgb, var(--success, #127a4a) 10%, var(--bg)); border-color: var(--success, #127a4a); color: var(--fg); }\n.form-status.is-error { background: color-mix(in srgb, var(--error, #b42318) 8%, var(--bg)); border-color: var(--error, #b42318); color: var(--fg); }\n.form-status:focus-visible { outline-offset: 2px; }\n\nbutton[disabled] { opacity: .65; cursor: progress; }\n\n/* ---------- Motion ---------- */\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }\n}\n<\/style>\n  <style>/* Maison Ivoire \u2014 luxury cosmetic dentistry (demo concept)\n   Editorial: Bodoni Moda display, Jost text, plum-black and rose pearl, champagne accent */\n:root {\n  --plum: #221A20;\n  --plum-2: #33272F;\n  --pearl: #EFE9E7;\n  --rose: #D9C6C0;\n  --champagne: #C2A57A;\n  --champagne-ink: #8A6C41;\n  --bg: var(--pearl);\n  --fg: var(--plum);\n  --muted: #5E5158;\n  --accent: var(--plum);\n  --focus: #8A6C41;\n  --error: #A3262A;\n  --success: #3E6B4F;\n  --field-bg: #F8F5F4;\n  --field-border: #8F8288;\n  --field-radius: 0;\n  --font-display: \"Bodoni Moda\", Didot, \"Times New Roman\", serif;\n  --font-body: \"Jost\", \"Segoe UI\", system-ui, sans-serif;\n  --max: 76rem;\n  --img-placeholder: #3a2e36;\n}\nbody { font-weight: 400; font-size: 1.0625rem; }\nh1, h2 { font-family: var(--font-display); font-weight: 400; line-height: 1.02; letter-spacing: -.015em; text-wrap: balance; }\nh2 { font-size: clamp(2.4rem, 1.6rem + 3vw, 4rem); font-style: italic; }\n.iv-note { font-size: .875rem; color: var(--muted); }\n\n.iv-btn
